<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona em Cinco Perguntas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: página branca e arejada; cada persona tem ficha própria com índice lateral fixo; gráficos em SVG com rótulo direto. */
:root {
  --bg: #F6F7F7;
  --surface: #FFFFFF;
  --surface-2: #F0F3F2;
  --surface-3: #E6ECEA;
  --ink: #111A18;
  --ink-2: #44514E;
  --ink-3: #5E6A65;
  --line: #E1E6E4;
  --primary: #0E6A55;
  --primary-hover: #0A5645;
  --primary-ink: #FFFFFF;
  --primary-soft: #E2F1EB;
  --sun: #F2B230;
  --sun-soft: #FFF5DA;
  --sun-line: #F1DA9C;
  --sun-ink: #5A3E00;
  --lock: #EEF1F5;
  --c1: #2F6FB0; --c2: #B7791F; --c3: #13896A; --c4: #7B5AA6; --c5: #C8553D;
  --c1-soft: #E5EEF8; --c2-soft: #F8EEDC; --c3-soft: #E1F2EC; --c4-soft: #EEE8F6; --c5-soft: #F8E5E0;
  --shadow: 0 1px 2px rgba(17,26,24,.05), 0 6px 20px rgba(17,26,24,.05);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1513; --surface: #151C1A; --surface-2: #1B2421; --surface-3: #232E2A; --ink: #E8EFEC; --ink-2: #AEBDB7; --ink-3: #82938C; --line: #26322E;
    --primary: #4CC19F; --primary-hover: #66D1B1; --primary-ink: #06231B; --primary-soft: #17352C;
    --sun: #F2B230; --sun-soft: #2F2711; --sun-line: #574618; --sun-ink: #FFE2A0; --lock: #1A2230;
    --c1: #4F8BD0; --c2: #BC8422; --c3: #24A078; --c4: #9573C8; --c5: #D8664F;
    --c1-soft: #1A2738; --c2-soft: #2E2615; --c3-soft: #15302A; --c4-soft: #261F35; --c5-soft: #33201B;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1513; --surface: #151C1A; --surface-2: #1B2421; --surface-3: #232E2A; --ink: #E8EFEC; --ink-2: #AEBDB7; --ink-3: #82938C; --line: #26322E;
  --primary: #4CC19F; --primary-hover: #66D1B1; --primary-ink: #06231B; --primary-soft: #17352C;
  --sun: #F2B230; --sun-soft: #2F2711; --sun-line: #574618; --sun-ink: #FFE2A0; --lock: #1A2230;
  --c1: #4F8BD0; --c2: #BC8422; --c3: #24A078; --c4: #9573C8; --c5: #D8664F;
  --c1-soft: #1A2738; --c2-soft: #2E2615; --c3-soft: #15302A; --c4-soft: #261F35; --c5-soft: #33201B;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 84px; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
button { font: inherit; color: inherit; }
a { color: var(--primary); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; border-radius: 6px; }
.tempo__fonte, .numero__fonte, .miudo, .conceito__corpo { overflow-wrap: anywhere; }
.pilula-hip { display: inline-block; font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--c4); border: 1.5px solid currentColor; border-radius: 6px; padding: 1px 6px; vertical-align: middle; margin-left: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Barra */
.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.barra__dentro { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; }
.marca { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 17px; white-space: nowrap; }
.marca__sinal { width: 28px; height: 28px; flex: none; }
.selo { font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); background: var(--surface-2); border-radius: 999px; padding: 3px 9px; }
.barra__nav { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.barra__link { background: none; border: 0; padding: 8px 12px; border-radius: 999px; cursor: pointer; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.barra__link:hover, .barra__link[aria-current="page"] { background: var(--surface-2); color: var(--ink); }
.visao { display: inline-flex; align-items: center; gap: 6px; padding: 3px; border-radius: 999px; background: var(--surface-2); }
.visao__rotulo { font-size: 12px; color: var(--ink-3); padding-left: 8px; }
.visao button { border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.visao button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .15s, transform .15s; }
.btn:active { transform: translateY(1px); }
.btn--primario { background: var(--primary); color: var(--primary-ink); }
.btn--primario:hover { background: var(--primary-hover); }
.btn--fantasma { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn--fantasma:hover { box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.btn--sol { background: var(--sun); color: #2B1E00; }
.btn--pequeno { padding: 7px 13px; font-size: 14px; }

.palco { max-width: 1240px; margin: 0 auto; padding: 28px 16px 80px; }
.estreito { max-width: 720px; margin: 0 auto; }
.sobre { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); }
.miudo { font-size: 13px; color: var(--ink-3); }
.lead { font-size: 19px; color: var(--ink-2); max-width: 36em; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pilula { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 7px; letter-spacing: .02em; }
.etiqueta { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; border-radius: 6px; padding: 2px 6px; background: var(--surface-2); color: var(--ink-2); }

/* Foto */
.foto { position: relative; overflow: hidden; background: var(--surface-3); border-radius: var(--r-lg); aspect-ratio: 4 / 5; max-width: 100%; }
.foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
.foto--redonda { border-radius: 50%; aspect-ratio: 1; }
.foto__vazia { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink-3); font-size: 12px; padding: 8px; }
.foto__selo { position: absolute; left: 10px; bottom: 10px; font-size: 11px; font-weight: 600; background: rgba(0,0,0,.55); color: #fff; border-radius: 6px; padding: 3px 7px; }

/* Início */
.hero { display: grid; grid-template-columns: 1.05fr .95fr; gap: 44px; align-items: center; padding-block: 20px 44px; }
.hero h1 { font-size: clamp(36px, 5.6vw, 60px); font-weight: 800; margin: 12px 0 16px; }
.hero__acoes { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 0 10px; }
.mosaico { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.mosaico .foto:nth-child(2) { transform: translateY(24px); }
.secao-inicio { padding-block: 36px; border-top: 1px solid var(--line); }
.secao-inicio__cabeca { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
.secao-inicio h2 { font-size: clamp(26px, 3.2vw, 34px); font-weight: 700; }
.biblioteca { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.cartao-persona { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; text-align: left; cursor: pointer; padding: 0; display: grid; transition: transform .15s, box-shadow .15s; }
.cartao-persona:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.cartao-persona .foto { border-radius: 0; aspect-ratio: 5 / 4; }
.cartao-persona__corpo { padding: 16px 18px 18px; display: grid; gap: 8px; }
.cartao-persona__tipo { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.cartao-persona__nome { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
.cartao-persona__produto { color: var(--ink-2); font-size: 15px; }
.passos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; list-style: none; }
.passo { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; display: grid; gap: 8px; align-content: start; }
.passo__n { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-weight: 700; font-family: var(--font-display); }
.passo h3 { font-size: 18px; }
.passo p { color: var(--ink-2); font-size: 15px; }

/* Planos */
.matriz-planos { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.matriz-planos table { width: 100%; min-width: 640px; border-collapse: collapse; }
.matriz-planos th, .matriz-planos td { padding: 12px 16px; border-bottom: 1px solid var(--line); text-align: left; font-size: 15px; vertical-align: middle; }
.matriz-planos thead th { font-family: var(--font-display); font-size: 20px; vertical-align: bottom; }
.matriz-planos thead th small { display: block; font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--ink-3); }
.matriz-planos td.marca-sim, .matriz-planos td.marca-nao { text-align: center; width: 18%; }
.marca-sim span { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-weight: 800; }
.marca-nao span { color: var(--ink-3); }
.matriz-planos .col-pro { background: color-mix(in srgb, var(--primary-soft) 45%, transparent); }
.matriz-planos tr.grupo th { background: var(--surface-2); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }

/* Perguntas */
.progresso { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.progresso__trilho { flex: 1; height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.progresso__feito { height: 100%; background: var(--primary); border-radius: 999px; transition: width .3s ease; }
.progresso span { font-size: 14px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.pergunta { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: clamp(20px, 4vw, 34px); display: grid; gap: 16px; }
.pergunta h1 { font-size: clamp(28px, 4.2vw, 36px); font-weight: 700; }
.campo { width: 100%; border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 13px 15px; font: inherit; font-size: 17px; color: var(--ink); background: var(--bg); resize: vertical; min-height: 60px; }
.campo:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
.pergunta__acoes { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.escolhas { display: grid; gap: 10px; }
.escolha { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; text-align: left; background: var(--bg); border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 10px 14px; cursor: pointer; }
.escolha:hover { border-color: var(--primary); }
.escolha .foto { width: 56px; }
.escolha b { display: block; font-family: var(--font-display); font-size: 17px; }
.montando { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: clamp(22px, 5vw, 40px); display: grid; gap: 20px; }
.etapas { list-style: none; display: grid; gap: 14px; }
.etapa { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: center; color: var(--ink-3); }
.etapa__marca { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 14px; color: transparent; transition: all .3s; }
.etapa.feita { color: var(--ink); }
.etapa.feita .etapa__marca { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.etapa.agora .etapa__marca { border-color: var(--primary); border-top-color: transparent; animation: gira .9s linear infinite; }
.etapa small { display: block; font-size: 13px; color: var(--ink-3); }
@keyframes gira { to { transform: rotate(360deg); } }

/* Ficha */
.ficha { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 32px; align-items: start; }
.indice { position: sticky; top: 76px; display: grid; gap: 2px; font-size: 14px; max-height: calc(100vh - 96px); overflow-y: auto; padding-right: 4px; }
.indice__titulo { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin: 10px 0 4px 10px; }
.indice a { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--ink-2); text-decoration: none; padding: 6px 10px; border-radius: 8px; }
.indice a:hover { background: var(--surface-2); color: var(--ink); }
.indice a.trancado { color: var(--ink-3); }
.cadeado { font-size: 11px; font-weight: 700; color: var(--ink-3); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
.ficha__corpo { display: grid; gap: 22px; min-width: 0; }
.aviso-free { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; background: var(--sun-soft); border: 1px solid var(--sun-line); border-radius: var(--r-md); padding: 12px 16px; color: var(--sun-ink); font-size: 15px; }

.capa { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px; }
.capa h1 { font-size: clamp(34px, 4.6vw, 52px); font-weight: 800; }
.capa__linha { color: var(--ink-2); font-size: 17px; margin-top: 4px; }
.capa__fala { margin-top: 18px; font-family: var(--font-display); font-weight: 500; font-size: clamp(19px, 2.2vw, 23px); line-height: 1.32; padding-left: 18px; border-left: 4px solid var(--sun); }
.capa__resumo { margin-top: 16px; color: var(--ink-2); max-width: 46em; }
.capa__selos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.capa__selos span { background: var(--surface-2); border-radius: 999px; padding: 5px 12px; font-size: 14px; font-weight: 500; }
.capa__selos .selo-arq { background: var(--c4-soft); color: var(--ink); }
.capa__produto { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; font-size: 14px; color: var(--ink-2); }
.capa__produto b { color: var(--ink); }

.bloco { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: clamp(18px, 2.6vw, 26px); position: relative; min-width: 0; }
.bloco__cabeca { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 16px; }
.bloco__cabeca h2 { font-size: clamp(22px, 2.6vw, 27px); font-weight: 700; }
.bloco__sub { color: var(--ink-2); font-size: 15px; max-width: 48em; margin-top: 4px; }
.bloco h3 { font-size: 17px; font-weight: 700; }
.rot { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.conceito { font-size: 14px; }
.conceito summary { cursor: pointer; color: var(--primary); font-weight: 600; list-style: none; }
.conceito summary::-webkit-details-marker { display: none; }
.conceito[open] { flex-basis: 100%; }
.conceito__corpo { margin-top: 8px; padding: 12px 14px; background: var(--surface-2); border-radius: var(--r-sm); color: var(--ink-2); display: grid; gap: 6px; max-width: 60em; }
.trancado-bloco .bloco__conteudo { filter: blur(5px); opacity: .55; pointer-events: none; user-select: none; max-height: 260px; overflow: hidden; }
.tranca { position: absolute; inset: 70px 16px 16px; display: grid; place-items: center; z-index: 2; }
.tranca__caixa { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: var(--r-md); padding: 16px 18px; display: grid; gap: 8px; justify-items: center; text-align: center; max-width: 340px; }

.duas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
.tres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

/* Ficha básica */
.identidade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
.identidade div { display: grid; grid-template-columns: 140px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.identidade dt { color: var(--ink-3); font-weight: 600; font-size: 13px; padding-top: 2px; }
.identidade dd { margin: 0; }
.hip { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c4); margin-left: 6px; vertical-align: middle; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-3); margin-top: 12px; align-items: center; }
.legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* Como falar */
.falar { background: var(--sun-soft); border-color: var(--sun-line); }
.proposta { font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 2.8vw, 30px); line-height: 1.22; max-width: 30em; margin-top: 6px; }
.falar__grade { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 20px; }
.cx { background: var(--surface); border-radius: var(--r-md); padding: 15px; display: grid; gap: 9px; align-content: start; min-width: 0; }
.palavras { display: flex; flex-wrap: wrap; gap: 6px; }
.palavra { border-radius: 8px; padding: 4px 10px; font-size: 15px; font-weight: 600; }
.palavra--sim { background: var(--primary-soft); color: var(--primary); }
.palavra--nao { background: var(--c5-soft); color: var(--ink); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.evite { display: grid; gap: 10px; font-size: 14px; color: var(--ink-2); }
.evite > span { display: grid; gap: 3px; justify-items: start; }
.mensagem { margin-top: 14px; background: var(--surface); border-radius: var(--r-md); padding: 16px; display: grid; gap: 10px; }
.balao-msg { background: var(--primary-soft); border-radius: 16px 16px 16px 4px; padding: 13px 15px; max-width: 46em; }
.linha-acoes { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.por-etapa { list-style: none; display: grid; gap: 10px; margin-top: 14px; }
.por-etapa li { display: grid; grid-template-columns: 170px 1fr; gap: 14px; background: var(--surface); border-radius: var(--r-md); padding: 12px 15px; font-size: 15px; }
.por-etapa b { font-size: 14px; }

/* Números */
.numeros { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.numero { border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; display: grid; gap: 8px; align-content: start; background: var(--surface); }
.numero__valor { font-family: var(--font-display); font-weight: 800; font-size: 32px; line-height: 1.05; font-variant-numeric: tabular-nums; color: var(--primary); }
.numero__frase { font-size: 15px; }
.numero__fonte { font-size: 13px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.numero__fonte a { color: var(--ink-2); }

<script id="dados" type="application/json">{"ordem": ["jessica", "marcos", "luciene"], "fichas": {"jessica": {"id": "jessica", "nome": "Jéssica Souza", "idade": 23, "nascimento": 2003, "cidade": "Recife", "uf": "PE", "ocupacao": "Vendedora em loja de calçados de shopping", "resumo": "Vendedora de calçados num shopping da zona sul do Recife há cinco anos, Jéssica ajuda a sustentar a casa com a mãe e quer virar supervisora. Começou uma faculdade a distância em 2023 e parou com três mensalidades em aberto. Agora pesquisa de novo, pelo celular, no intervalo e antes de dormir, com medo de desistir outra vez.", "frase": "Eu quero sair do balcão. Só não posso largar o emprego para estudar.", "tracos": ["Determinada", "Prática", "Desconfia de promessa fácil", "Põe a casa antes de si", "Se cobra sozinha"], "foto": {"prompt_en": "head and shoulders portrait photograph of a 23-year-old Black Brazilian woman, dark brown skin, hair in a high bun, small hoop earrings, plain store uniform polo shirt, shoe store in a shopping mall behind her, hopeful determined look, natural light, blurred background, 50mm, realistic skin, candid", "alt": "Retrato gerado por inteligência artificial (IA), de pessoa que não existe. Jovem negra de 23 anos, cabelo crespo preso em coque alto, brincos de argola dourados. Veste camisa polo branca de uniforme, com alça de bolsa no ombro, num corredor de shopping.", "modelo": "stabilityai/stable-diffusion-xl-base-1.0", "semente": 2312, "parametros": "terceira de três variações (semente-base 2310, mais 2), 32 passos, guia 6,0, 896x1152, reduzida para 640x823; prompt negativo em dev/candidatas/jessica.json", "edicao": "Em 2026-10-05, o emblema preto que o modelo pôs no peito da camisa foi apagado, com preenchimento a partir do tecido em volta. Original em dev/candidatas/jessica-3.jpg; a versão publicada antes da edição ficou em dev/candidatas/jessica-publicada-com-emblema.jpg.", "arquivo": "img/jessica.jpg"}, "identidade": [{"rotulo": "Estado civil", "valor": "Solteira. Namora o Wellington, 25 anos, entregador de moto, há um ano e meio.", "hipotese": true}, {"rotulo": "Mora com", "valor": "A mãe, Rosângela, 47 anos, manicure que atende em casa, e o meio-irmão, Davi, 16 anos, no 2º ano do ensino médio.", "hipotese": true}, {"rotulo": "Filhos", "valor": "Nenhum. Diz que só pensa nisso depois do diploma.", "hipotese": true}, {"rotulo": "Moradia", "valor": "Casa de dois quartos, da família, herdada da avó. Divide o quarto com a mãe; o irmão dorme no outro.", "hipotese": true}, {"rotulo": "Bairro", "valor": "Ibura, zona sul do Recife. Cerca de uma hora de ônibus até o shopping, com troca no terminal.", "hipotese": true}, {"rotulo": "Renda pessoal", "valor": "De R$ 1.900 a R$ 2.600 por mês: piso do comércio mais comissão, que muda com o mês.", "hipotese": true}, {"rotulo": "Renda da casa", "valor": "Cerca de R$ 3.700 por mês para três pessoas, somando o salário dela e o que a mãe tira com as clientes.", "hipotese": true}, {"rotulo": "Escolaridade", "valor": "Ensino médio completo em 2020, em escola estadual. Começou Administração a distância em 2023 e parou no primeiro semestre.", "hipotese": true}, {"rotulo": "Transporte", "valor": "Dois ônibus por trecho, com vale-transporte pago pela loja.", "hipotese": true}, {"rotulo": "Celular e plano de dados", "valor": "Android intermediário, comprado em 10 vezes em 2024. Plano controle, com dados que acabam perto do dia 20. Sem computador. Em casa, internet de fibra que ela mesma paga.", "hipotese": true}], "arquetipo": {"principal": {"nome": "Herói", "motivacao": "Risco e maestria", "desejo": "Provar o próprio valor com uma ação corajosa e difícil.", "medo": "Parecer fraca ou incapaz. No caso dela: confirmar que \"não é de estudo\".", "por_que": "A história dela gira em torno de dar conta de uma prova difícil. Aos 19 anos, com a carteira assinada, assumiu parte das contas da casa. Em 2024, foi a vendedora que mais vendeu na loja no trimestre do Dia das Mães e anota as próprias vendas num caderno para bater a meta seguinte. A desistência de 2023 virou uma conta a acertar consigo mesma. Ela recusa a palavra \"fácil\": diploma fácil, para ela, vale pouco.", "como_aparece": "Pede meta alta e comemora quando bate. Fala \"eu dou conta\" e \"dessa vez vai\". Prefere desafio com prazo claro a promessa de conforto. Quando atrasa, se cobra e esconde, em vez de pedir ajuda. O risco que ela topa é a prova difícil; com dinheiro, foge de risco: parcela fixa, nada de aposta."}, "secundario": {"nome": "Prestativo", "por_que": "Põe a casa antes de si. Paga a internet, o lanche do irmão e cobre o mês quando a mãe tem pouca cliente. Só depois pensa no que é dela. A faculdade disputa esse dinheiro e esse tempo, por isso a culpa aparece junto com a vontade."}, "sombra": {"nome": "Mártir calada", "risco": "Carrega tudo sozinha e some em silêncio quando fica para trás, como em 2023. Ninguém em casa soube que ela tinha parado, e ela pagou a dívida sozinha no ano seguinte. Para quem vende o curso, o risco é a evasão que não faz barulho. O primeiro sinal é a semana sem entrar na plataforma, bem antes da mensalidade atrasada. Nome e leitura nossos, a partir do Herói e do Prestativo."}}, "personalidade": [{"traco": "Abertura a experiências", "valor": 3, "nota": "Hipótese. Topa coisa nova quando vê uso prático. Teoria longa a afasta. Experimenta aplicativo se uma colega indicar.", "faixa": "média"}, {"traco": "Escrupulosidade", "valor": 4, "nota": "Hipótese. Cumpre horário, anota vendas, controla gastos no caderno. Em semana de escala apertada, a disciplina cai; foi o que faltou em 2023.", "faixa": "alta"}, {"traco": "Extroversão", "valor": 4, "nota": "Hipótese. No balcão, puxa conversa e fecha venda. Em casa, à noite, quer silêncio e fone de ouvido.", "faixa": "alta"}, {"traco": "Socialização", "valor": 3, "nota": "Hipótese. Cordial com cliente e com a família. Com vendedor de faculdade e anúncio de promoção, fica desconfiada e pergunta duas vezes.", "faixa": "média"}, {"traco": "Neuroticismo", "valor": 3, "nota": "Hipótese. Segura no trabalho. Ansiosa com dinheiro, com cobrança e com a chance de falhar de novo.", "faixa": "média"}], "fase_de_vida": {"nome": "Intimidade versus isolamento", "em_jogo": "Criar laços firmes, no namoro e na turma da loja, sem abrir mão do projeto próprio. Aos 23 anos, ela ainda fecha uma ponta da fase anterior, a identidade: ser \"a vendedora\" ou \"alguém que estudou\".", "nota": "Leitura por idade, aproximada e marcada como hipótese (Erikson, 1950). No modelo de linha da vida da equipe, ela acabou de entrar na vida adulta (22 a 37 anos), fase de transições e de identidade profissional. Quem confirma é a entrevista: o que ela quer ter construído até os 30?"}, "formacao": [{"de": 2009, "ate": 2017, "titulo": "Ensino fundamental", "onde": "Escola municipal no Ibura", "nota": "Boa em matemática, fraca em redação. A partir dos 11 anos, cuidava do irmão à tarde.", "hipotese": true}, {"de": 2018, "ate": 2020, "titulo": "Ensino médio", "onde": "Escola estadual perto de casa", "nota": "O 3º ano, em 2020, foi quase todo pelo celular da mãe, com o pacote de dados dividido entre as duas.", "hipotese": true}, {"de": 2022, "ate": 2022, "titulo": "Treinamento de vendas da rede", "onde": "Plataforma on-line da loja", "nota": "Oito horas sobre atendimento e venda adicional. Primeiro certificado dela; está guardado na galeria do celular.", "hipotese": true}, {"de": 2023, "ate": 2023, "titulo": "Administração a distância (parou)", "onde": "Faculdade privada a distância", "nota": "Começou em fevereiro e parou em julho. Vídeos longos que travavam no celular. Ficou com três mensalidades em aberto.", "hipotese": true}, {"de": 2025, "ate": 2025, "titulo": "Planilha básica pelo YouTube", "onde": "Vídeos gratuitos", "nota": "Montou a planilha das próprias vendas. Parou no módulo de fórmulas.", "hipotese": true}, {"de": 2027, "ate": 2028, "titulo": "Tecnólogo em Gestão Comercial (horizonte)", "onde": "Curso a distância, com polo de prova perto de casa", "nota": "Se a matrícula sair em janeiro de 2027, ela se forma no fim de 2028, aos 25 anos.", "hipotese": true}], "trajetoria": [{"de": 2016, "ate": 2020, "titulo": "Ajuda no salão da mãe", "onde": "Casa da família, Ibura", "nota": "Aos sábados, dos 13 aos 17 anos: marcava horário pelo WhatsApp, cobrava as clientes, varria a sala. Sem pagamento fixo.", "hipotese": true}, {"de": 2021, "ate": 2021, "titulo": "Vendedora intermitente", "onde": "Loja de calçados, shopping da zona sul", "nota": "Primeiro emprego, aos 18 anos. Chamada para fins de semana e datas de pico, com hora paga. Entrou porque a mãe perdeu clientes na pandemia.", "hipotese": true}, {"de": 2022, "ate": "hoje", "titulo": "Vendedora com carteira assinada", "onde": "Mesma loja de calçados", "nota": "Efetivada em março de 2022. 44 horas por semana, escala que muda toda semana, comissão sobre vendas. Em 2024, maior venda da loja no trimestre do Dia das Mães.", "hipotese": true}, {"de": 2026, "ate": 2026, "titulo": "Candidata a supervisora (não ficou)", "onde": "Mesma loja", "nota": "Em julho de 2026, a vaga foi para uma colega que acabava de se formar. Foi o gatilho para voltar a pesquisar faculdade.", "hipotese": true}], "dia": [{"hora": "06:20", "o_que": "Acorda com o barulho do irmão saindo para a escola. Ainda na cama, abre o grupo da loja para ver a escala da semana e a meta do dia.", "canal": "WhatsApp"}, {"hora": "07:15", "o_que": "Café com a mãe, que já arruma a mesa de manicure na sala. Vê stories enquanto come pão com ovo.", "canal": "Instagram"}, {"hora": "08:30", "o_que": "Manhã livre na semana de turno da tarde: lava roupa, paga a conta de luz, passa Pix para a mãe. A sala já está cheia de clientes. Se voltar a estudar, é a melhor hora: no quarto, de fone.", "canal": "Aplicativo do banco (Pix)"}, {"hora": "10:30", "o_que": "Dois ônibus até o shopping. Fone no ouvido e vídeo baixado no Wi-Fi de casa, porque os dados do celular acabam perto do dia 20.", "canal": "TikTok e áudios do WhatsApp"}, {"hora": "11:40", "o_que": "Bate o ponto. Confere estoque e numeração, arruma a vitrine de sandálias. O cheiro de couro e de cola da loja ela nem sente mais.", "canal": "Sistema da loja"}, {"hora": "15:00", "o_que": "Uma hora de intervalo. Marmita no refeitório dos funcionários, Wi-Fi do shopping, três abas de faculdade a distância abertas. Manda direct perguntando o preço.", "canal": "Instagram e Google"}, {"hora": "17:30", "o_que": "Pico da tarde. Manda foto de tênis para clientes fiéis e fecha duas vendas por mensagem.", "canal": "WhatsApp da loja"}, {"hora": "20:00", "o_que": "Fecha o caixa dela, anota as vendas do dia no caderno e corre para o ponto de ônibus.", "canal": "Caderno de vendas"}, {"hora": "21:30", "o_que": "Chega em casa. Janta o que a mãe deixou no fogão, cobra o dever do irmão, responde a prima.", "canal": "WhatsApp"}, {"hora": "22:30", "o_que": "Deita no quarto que divide com a mãe, tela no brilho mínimo. Vídeos de rotina de estudo de meninas que trabalham no comércio; os anúncios de faculdade aparecem no meio.", "canal": "TikTok e Instagram"}], "linha_do_tempo": [{"ano": 2003, "idade": 0, "tipo": "vida", "titulo": "Nasce no Ibura, zona sul do Recife", "texto": "Primeira filha de Rosângela, então com 24 anos, manicure num salão do bairro. O pai sai de casa antes de ela fazer 5 anos."}, {"ano": 2005, "idade": 2, "tipo": "fato", "titulo": "Programa Universidade para Todos: bolsa em faculdade privada", "texto": "A Lei 11.096 cria o Programa Universidade para Todos (Prouni), que dá bolsa em faculdade privada. Hoje, quem fez o ensino médio em escola pública está entre os que podem receber. A pré-seleção é pela nota do Exame Nacional do Ensino Médio (Enem). A bolsa integral vai para quem tem renda familiar de até um salário mínimo e meio por pessoa.", "fonte": {"nome": "Planalto · Lei nº 11.096, de 13 de janeiro de 2005", "url": "https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2005/lei/l11096.htm"}, "marca": "Ela cresce achando que bolsa é coisa de quem tira nota alta. Em parte é: a pré-seleção é pela nota do Enem. Mas a renda também conta, e essa regra ela nunca conferiu. A renda que ela descreve é hipótese: R$ 3.700 para três pessoas, cerca de R$ 1.233 por pessoa (conta: 3.700 ÷ 3 = 1.233,33). O teto da bolsa integral em 2026 é R$ 2.431,50 (conta: 1,5 × R$ 1.621), e a casa ficaria abaixo dele. Ela nunca fez o Enem, e ninguém em casa sabia como pedir.", "free": true}, {"ano": 2010, "idade": 7, "tipo": "vida", "titulo": "Nasce o meio-irmão, Davi", "texto": "Davi é filho da mãe com outro companheiro. A mãe passa a atender em casa para ficar perto dos filhos. A sala vira salão de manicure, e Jéssica aprende cedo a cuidar do irmão."}, {"ano": 2013, "idade": 10, "tipo": "fato", "titulo": "Comerciário vira profissão regulamentada", "texto": "A Lei 12.790 regulamenta a profissão de comerciário. Fixa a jornada do comércio em 8 horas por dia e 44 por semana e deixa o piso salarial para convenção ou acordo coletivo.", "fonte": {"nome": "Planalto · Lei nº 12.790, de 14 de março de 2013", "url": "https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2013/lei/l12790.htm"}, "marca": "A tia, irmã da mãe, vendia numa loja do centro e chegava depois das 21h. Para a menina de 10 anos, comércio era isto: emprego firme, jornada longa, domingo de escala."}, {"ano": 2017, "idade": 14, "tipo": "fato", "titulo": "Faculdade pode ser só a distância", "texto": "O Decreto 9.057 permite credenciar faculdade só para cursos a distância e deixa a própria instituição criar polos, seguindo parâmetros do Ministério da Educação (MEC).", "fonte": {"nome": "Planalto · Decreto nº 9.057, de 25 de maio de 2017", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2017/decreto/d9057.htm"}, "marca": "Aos 14 anos, ela começa a ver faixas de faculdade a distância perto do terminal de ônibus (lembrança dela). Faculdade passa a parecer coisa que se faz em casa, sozinha."}, {"ano": 2017, "idade": 14, "tipo": "fato", "titulo": "Reforma trabalhista cria o trabalho intermitente", "texto": "A reforma trabalhista cria o contrato intermitente. Os períodos de trabalho e de inatividade são definidos em horas, dias ou meses. A hora paga nunca fica abaixo da hora do salário mínimo.", "fonte": {"nome": "Planalto · Lei nº 13.467, de 13 de julho de 2017", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2017/lei/l13467.htm"}, "marca": "Quatro anos depois, o primeiro emprego dela começa assim: chamada para fim de semana e data de pico, sem saber quanto ia ganhar no mês."}, {"ano": 2020, "idade": 17, "tipo": "fato", "titulo": "Ano letivo sem o mínimo de dias", "texto": "Com a pandemia, a Lei 14.040 dispensa as escolas de ensino fundamental e médio do mínimo de dias letivos, desde que cumprida a carga horária mínima.", "fonte": {"nome": "Planalto · Lei nº 14.040, de 18 de agosto de 2020", "url": "https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2020/lei/l14040.htm"}, "marca": "O 3º ano dela vira lista de atividades no celular da mãe. Ela aprende que estudar pela tela é estudar sozinha e termina o ensino médio sem festa e sem saber o que vem depois."}, {"ano": 2020, "idade": 17, "tipo": "fato", "titulo": "Pix começa a funcionar", "texto": "O Banco Central cria o Pix, pagamento instantâneo, que entra em operação plena em 16 de novembro de 2020.", "fonte": {"nome": "Banco Central do Brasil · Resolução BCB nº 1, de 12 de agosto de 2020", "url": "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=1"}, "marca": "Ela ensina a mãe a receber das clientes por Pix. Desde então, paga quase tudo assim."}, {"ano": 2021, "idade": 18, "tipo": "vida", "titulo": "Primeiro emprego", "texto": "A mãe perde metade das clientes na pandemia. Jéssica entra numa loja de calçados de shopping como vendedora intermitente, nos fins de semana e nas datas de pico."}, {"ano": 2022, "idade": 19, "tipo": "vida", "titulo": "Carteira assinada", "texto": "Efetivada em março, com 44 horas por semana, escala que muda toda semana e comissão. Passa a dividir as contas com a mãe e assume a internet de casa e o lanche do irmão."}, {"ano": 2023, "idade": 20, "tipo": "vida", "titulo": "Começa e para a primeira faculdade", "texto": "Matricula-se em Administração a distância em fevereiro, atraída por uma primeira mensalidade promocional. Em julho, com vídeos longos que travam no celular e a mensalidade cheia, para. Fica devendo três mensalidades e não conta a ninguém."}, {"ano": 2023, "idade": 20, "tipo": "fato", "titulo": "Desenrola: renegociar dívida para limpar o nome", "texto": "A Lei 14.690 cria o Desenrola Brasil, para renegociar dívidas de pessoas com nome em cadastro de inadimplentes e facilitar a volta ao crédito.", "fonte": {"nome": "Planalto · Lei nº 14.690, de 3 de outubro de 2023", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14690.htm"}, "marca": "A mãe, com o nome no cadastro de inadimplentes desde a pandemia, renegocia uma dívida no programa. Jéssica vê o alívio de perto e jura nunca mais assinar contrato sem saber o valor de cada parcela."}, {"ano": 2024, "idade": 21, "tipo": "vida", "titulo": "Quita a dívida e vira referência na loja", "texto": "Paga as três mensalidades atrasadas com o décimo terceiro. No trimestre do Dia das Mães, é a vendedora que mais vende na loja e ganha a primeira menção da gerente no grupo."}, {"ano": 2025, "idade": 22, "tipo": "fato", "titulo": "Novas regras para o curso a distância", "texto": "O Decreto 12.456 muda a graduação a distância. Ao menos 10% da carga horária passa a ser presencial, e outros 10%, presenciais ou ao vivo. As provas presenciais pesam mais na nota. O diploma não pode informar o formato do curso. As faculdades têm dois anos para cumprir tudo (art. 41).", "fonte": {"nome": "Planalto · Decreto nº 12.456, de 19 de maio de 2025", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/decreto/d12456.htm"}, "marca": "Ela vê um vídeo sobre a mudança e gosta: com prova presencial e diploma sem a palavra \"a distância\", a tia não teria do que reclamar. Ainda não sabe onde ficaria o polo da prova nem quantas horas teriam hora marcada.", "free": true}, {"ano": 2026, "idade": 23, "tipo": "fato", "titulo": "Salário mínimo de R$ 1.621", "texto": "Desde 1º de janeiro de 2026, o salário mínimo é de R$ 1.621 por mês, ou R$ 7,37 por hora.", "fonte": {"nome": "Planalto · Decreto nº 12.797, de 23 de dezembro de 2025", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/decreto/d12797.htm"}, "marca": "É a régua da casa. A mensalidade de R$ 249 do curso de exemplo equivale a 15,4% do mínimo (conta: 249 ÷ 1.621 = 0,154). É assim que ela pensa preço: em pedaços do mínimo."}, {"ano": 2026, "idade": 23, "tipo": "vida", "titulo": "Perde a vaga de supervisora", "texto": "Em julho, a vaga de supervisora da loja vai para uma colega que acabava de se formar. Na mesma noite, Jéssica volta a pesquisar faculdade a distância pelo celular."}, {"ano": 2026, "idade": 23, "tipo": "fato", "titulo": "Apostas de quota fixa proibidas no país", "texto": "Uma medida provisória proíbe no Brasil a exploração, a oferta e a publicidade de apostas de quota fixa, nas apostas esportivas e nos jogos on-line. Medida provisória perde a eficácia se não virar lei em 60 dias, prorrogáveis uma vez por mais 60 (Constituição, art. 62, §§ 3º e 7º).", "fonte": {"nome": "Planalto · Medida Provisória nº 1.394, de 25 de setembro de 2026", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2026/mpv/mpv1394.htm"}, "marca": "Dois colegas da loja apostavam toda semana, e um deles pediu dinheiro emprestado a ela em 2025. Ela criou aversão a promessa de ganho rápido e lê anúncio de faculdade com a mesma desconfiança.", "fontes_extra": [{"nome": "Planalto · Constituição Federal de 1988, art. 62, §§ 3º e 7º", "url": "https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}]}, {"ano": 2027, "idade": 24, "tipo": "horizonte", "titulo": "Matrícula possível e prazo das regras novas", "texto": "Se a decisão vier com a comissão do fim de ano, a matrícula sai em janeiro. Em maio, termina o prazo de dois anos para as faculdades cumprirem por inteiro o Decreto 12.456 (art. 41). Conta: publicação no Diário Oficial da União (DOU) em 20 de maio de 2025, mais dois anos. O primeiro semestre dela cai dentro da transição.", "fonte": {"nome": "Planalto · Decreto nº 12.456, de 19 de maio de 2025, art. 41 (DOU de 20.5.2025)", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/decreto/d12456.htm"}}, {"ano": 2028, "idade": 25, "tipo": "horizonte", "titulo": "Formatura possível", "texto": "Com dois anos de curso sem interrupção, ela se forma no fim de 2028, aos 25 anos. Nessa data, o prazo de adaptação ao decreto já terá terminado. O risco maior fica no primeiro semestre, quando parou da outra vez."}, {"ano": 2030, "idade": 27, "tipo": "horizonte", "titulo": "Para onde quer ir", "texto": "Supervisora de loja, ou à frente de um ponto próprio de calçados, se o diploma vier a tempo. O irmão, então com 20 anos, seria o próximo da casa a tentar faculdade."}], "trabalhos": {"frase": "Quando a vaga de supervisora vai para quem tem diploma, quero uma faculdade que caiba entre a loja e a casa, para subir sem largar o salário.", "funcional": "Conseguir um diploma de nível superior reconhecido em dois anos, estudando pelo celular no ônibus, no intervalo e nas manhãs livres, sem parar de trabalhar.", "emocional": "Provar para si mesma que termina o que começa e fechar a ferida da desistência de 2023.", "social": "Ser vista pela gerente, pela família e pelo namorado como alguém que estudou e está subindo.", "usa_hoje": "Hipótese. Hoje, no lugar do curso, ela usa vídeos grátis do YouTube, como os da planilha de 2025, parada no módulo de fórmulas. Usa também o treinamento de oito horas da rede, de 2022, e o caderno de vendas. Para a vaga de supervisora, faz o que dá: bate meta e espera a próxima. Se ela fizer o Enem, o concorrente pode ser o curso de graça, com bolsa do Prouni."}, "expectativas": [{"esfera": "Para ela", "texto": "Terminar desta vez. Sentir, já no primeiro mês, que aprendeu algo que usa na loja na semana seguinte."}, {"esfera": "No trabalho", "texto": "Virar supervisora até 2028 e entender os números da loja: meta, ticket médio, estoque e margem."}, {"esfera": "Com os outros", "texto": "Ser a primeira da casa com diploma, calar a dúvida da tia e mostrar ao irmão que dá para estudar trabalhando."}], "dores": {"superficie": [{"texto": "Chega em casa por volta das 21h30, sem energia para vídeo longo."}, {"texto": "A escala muda toda semana; não consegue horário fixo para estudar."}, {"texto": "Medo de a mensalidade subir depois da matrícula."}, {"texto": "Celular cheio e dados que acabam perto do dia 20; vídeo que trava."}, {"texto": "Não sabe se o diploma a distância vale para a gerente e para a próxima loja."}], "fundo": [{"texto": "Medo de desistir de novo e confirmar que \"não é de estudo\"."}, {"texto": "Culpa de gastar com ela o dinheiro que falta em casa."}, {"texto": "Sensação de ficar para trás enquanto colegas com diploma sobem."}, {"texto": "Vergonha da dívida de 2023, que ela escondeu de todos em casa."}], "raiz": "Hipótese: ela já parou uma vez, escondeu, e ainda segura parte da casa. Por isso cada mensalidade parece dinheiro tirado da família, e cada semana sem estudar parece o começo da próxima desistência."}, "ganhos": ["Diploma de nível superior em dois anos, sem a palavra \"a distância\" (regra do Decreto 12.456, de 2025, a cumprir até maio de 2027).", "Aula curta que rende no ônibus e na manhã livre, baixada no Wi-Fi.", "A mesma mensalidade do começo ao fim, com o total escrito antes de assinar.", "Algo para mostrar na loja antes do fim: um certificado no meio do caminho.", "Turma de gente que também trabalha no comércio, para não estudar sozinha.", "Entender os números da loja e usar já na meta do mês seguinte."], "empatia": {"pensa_sente": ["Se eu começar e parar de novo, nunca mais tento.", "Estou ficando para trás das meninas que estudaram.", "Será que faculdade a distância vale menos? Minha tia acha.", "Orgulho de ser a que mais vende, e cansaço de não sair do lugar."], "ve": ["A colega recém-formada assumir a supervisão.", "Anúncio de faculdade com primeira mensalidade quase de graça no feed.", "Vídeos de vendedoras que estudam no ônibus.", "A mãe fazendo conta no caderno no fim do mês."], "ouve": ["Da gerente: \"quem quer crescer aqui precisa estudar\".", "Da tia: \"faculdade pela internet vale menos\".", "Da prima formada: \"o difícil é o primeiro semestre\".", "Dos colegas: piada sobre quem \"virou universitária\"."], "fala_faz": ["Pergunta preço no direct e some quando a resposta vem com \"a partir de\".", "Salva vídeos de faculdade e não abre.", "Anota as vendas no caderno todo dia.", "Diz \"em janeiro eu começo\"."], "dores": ["Tempo curto e escala que muda", "Mensalidade que sobe", "Medo de desistir de novo"], "ganhos": ["Diploma em dois anos", "Promoção a supervisora", "Orgulho da família"]}, "jornada": [{"etapa": "Necessidade", "faz": "Perde a vaga de supervisora para uma colega com diploma. Volta calada no ônibus e, à noite, pesquisa \"faculdade a distância barata\".", "pensa": "Se eu tivesse terminado em 2023, a vaga era minha.", "canal": "Google e TikTok", "emocao": -2, "oportunidade": "Chegar quando a frustração vira busca: conteúdo sobre como vendedoras chegaram a supervisora estudando, antes do anúncio de preço."}, {"etapa": "Pesquisa", "faz": "Compara quatro ou cinco faculdades pelo celular, manda direct perguntando preço e assiste a vídeos de alunas.", "pensa": "Qual não vai subir a mensalidade? Qual é reconhecida?", "canal": "Instagram, YouTube e WhatsApp", "emocao": 0, "oportunidade": "Preço do curso inteiro na primeira resposta e uma aula de amostra que abre no celular sem cadastro."}, {"etapa": "Decisão", "faz": "Conversa com a prima formada e com a mãe, faz a conta no caderno e espera a comissão do fim de ano.", "pensa": "Cabe mais uma conta fixa se eu cortar o delivery e a música?", "canal": "WhatsApp e conversa em casa", "emocao": -1, "oportunidade": "Uma conta honesta: regra da mensalidade, total dos dois anos, endereço do polo da prova e quantas idas por semestre."}, {"etapa": "Matrícula", "faz": "Faz a matrícula pelo celular e assiste à primeira semana de aula no ônibus.", "pensa": "Dessa vez vai.", "canal": "Site da faculdade e WhatsApp da tutoria", "emocao": 1, "oportunidade": "Primeira semana desenhada para uma vitória rápida: aula curta e uma tarefa ligada à loja dela."}, {"etapa": "Primeiros meses", "faz": "Semana de estoque e de pico no shopping. Fica nove dias sem entrar na plataforma.", "pensa": "Já fiquei para trás. É igual da outra vez.", "canal": "Notificação e WhatsApp", "emocao": -2, "oportunidade": "Uma pessoa da tutoria que chama no sétimo dia sem acesso, e um calendário que respeita as datas de pico do comércio."}, {"etapa": "Indicação", "faz": "Termina o primeiro ano, mostra as notas à gerente e chama duas colegas para começar.", "pensa": "Eu dou conta.", "canal": "WhatsApp e Instagram", "emocao": 2, "oportunidade": "Indicação entre colegas de loja, com benefício para as duas, e o depoimento dela como peça de comunicação."}], "canais": [{"canal": "WhatsApp", "uso": 5, "confianca": 4, "nota": "Onde fala com a prima, a mãe, a gerente e as clientes fiéis. Pelo uso e pela confiança, cai em \"Fale por aqui\", mas com uma regra. Mensagem de faculdade só depois que ela pede informação. Antes disso, soa como invasão.", "fonte": null}, {"canal": "Instagram", "uso": 4, "confianca": 2, "nota": "Vê anúncio, salva post e pergunta preço no direct. Desconfia de promoção de primeira mensalidade.", "fonte": null}, {"canal": "TikTok", "uso": 4, "confianca": 3, "nota": "Assiste a vídeos de rotina de estudo de quem trabalha e estuda. Confia mais em aluna do que em marca.", "fonte": null}, {"canal": "YouTube", "uso": 3, "confianca": 4, "nota": "Para ver a plataforma por dentro e uma aula de verdade antes de decidir.", "fonte": null}, {"canal": "Busca no Google", "uso": 3, "confianca": 3, "nota": "Pesquisa \"faculdade a distância Recife\" e \"curso reconhecido pelo MEC\". Compara três ou quatro resultados.", "fonte": null}, {"canal": "Indicação da prima e de colegas", "uso": 2, "confianca": 5, "nota": "Pouca conversa, peso enorme. A prima Tainá, formada a distância, decide mais que qualquer anúncio.", "fonte": null}, {"canal": "Inteligência artificial (IA)", "uso": 2, "confianca": 2, "nota": "Usa às vezes para escrever mensagem a cliente (hipótese). No grupo: em 2025, 55% dos usuários de internet de 16 a 24 anos usaram inteligência artificial generativa; entre quem tem ensino médio, 29%.", "fonte": {"nome": "Cetic.br (Centro Regional de Estudos para o Desenvolvimento da Sociedade da Informação), TIC Domicílios 2025 (tecnologias de informação e comunicação nos domicílios), gráfico 3C", "url": "https://cetic.br/media/analises/tic_domicilios_2025_principais_resultados.pdf"}}], "consumo": [{"rotulo": "Como paga", "valor": "Pix para quase tudo. Cartão de loja com limite baixo para compra parcelada, como o celular. Evita boleto desde a dívida de 2023."}, {"rotulo": "Onde compra", "valor": "Pelo celular, em loja on-line e no direct do Instagram. No shopping onde trabalha, só com desconto de funcionária."}, {"rotulo": "Quanto pesquisa", "valor": "Muito, para compra acima de R$ 200: compara em três lugares, tira print e pergunta à prima. Faculdade, pesquisa desde julho."}, {"rotulo": "Sensibilidade a preço", "valor": "Alta para valor mensal e para surpresa; média para o total. Prefere parcela fixa a desconto que acaba no segundo mês."}, {"rotulo": "Quando faz compra grande", "valor": "Com o décimo terceiro e a comissão do fim de ano, entre dezembro e janeiro, ou logo depois de uma frustração no trabalho."}, {"rotulo": "O que cortaria pelo curso", "valor": "Delivery de fim de semana e a assinatura de música. A internet de casa e a ajuda ao irmão ficam."}], "decisao": {"criterios": [{"criterio": "Mensalidade fixa até a formatura", "peso": 5}, {"criterio": "Diploma reconhecido pelo Ministério da Educação (MEC) e aceito pela gerente", "peso": 5}, {"criterio": "Aula que abre bem no celular e pode ser baixada", "peso": 5}, {"criterio": "Polo de prova perto de casa ou do shopping", "peso": 4}, {"criterio": "Duração curta, de dois anos", "peso": 4}, {"criterio": "Conteúdo que serve na loja já no primeiro mês", "peso": 3}, {"criterio": "Marca conhecida", "peso": 2}], "gatilhos": ["Perder uma promoção para alguém com diploma, como em julho de 2026.", "Comissão do fim de ano e décimo terceiro na conta, entre dezembro e janeiro.", "Uma colega da loja topar começar junto.", "Ver uma aluna parecida com ela contando a rotina em vídeo.", "Uma aula de amostra que abre bem no celular dela."], "objecoes": [{"objecao": "E se a mensalidade subir depois?", "resposta": "Diga a regra antes da matrícula, por escrito. Se os R$ 249 ficam iguais até a formatura, escreva isso e o total: R$ 5.976 em dois anos (conta: 24 × 249). Se há reajuste, diga quando e por qual índice e mostre a conta dos dois anos. Reajuste explicado ela aceita; surpresa a faz sumir.", "free": true}, {"objecao": "Diploma a distância vale menos.", "resposta": "Mostre a regra de 2025, que as faculdades têm até maio de 2027 para cumprir por inteiro (Decreto 12.456, art. 41). Por ela, o diploma não pode informar o formato do curso. E a prova presencial vale a maior parte da nota de cada disciplina. Diga se o seu curso já segue a regra. Quando ela se formar, no fim de 2028, o prazo já terá terminado. Para a gerente, mostre a situação do curso no Ministério da Educação (MEC). Não compare salário: a renda média de quem tem superior em Recife mistura todas as profissões.", "fontes": [{"afirmacao": "Diploma sem o formato do curso; prova presencial com peso majoritário na nota; dois anos para cumprir por inteiro, com transição por ato do Ministro", "fonte": "Planalto · Decreto nº 12.456, de 19 de maio de 2025, arts. 23, 40 e 41 (art. 100 do Decreto nº 9.235, na nova redação)", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/decreto/d12456.htm", "trecho": "Art. 23. As Instituições de Educação Superior deverão aplicar avaliações de aprendizagem presenciais, em suas sedes, nos campi fora das sedes e nos Polos EaD, em todas as suas unidades curriculares ofertadas de forma parcial ou integral em educação a distância. § 1º As avaliações de que trata o caput deverão: I - ocorrer periodicamente e observar os referenciais de qualidade para os cursos de graduação com oferta de ensino a distância; II - ter peso majoritário na composição da nota final de cada unidade curricular; [...] Art. 40. O Decreto nº 9.235, de 15 dezembro de 2017, passa a vigorar com as seguintes alterações: [...] Art. 100. É vedada a identificação do formato de oferta do curso na emissão e no registro de diplomas. [...] Art. 41. As Instituições de Educação Superior credenciadas e os cursos autorizados deverão atender, de forma integral, as disposições deste Decreto e do ato do Ministro de Estado que o discipline, no prazo de dois anos, contado da data de publicação deste Decreto. Parágrafo único. Ato do Ministro de Estado da Educação disciplinará as regras de transição para a aplicação do disposto neste Decreto [...] Este texto não substitui o publicado no DOU de 20.5.2025.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-jessica.json (fato de 2025); art. 41, parágrafo único, e rodapé do DOU relidos em 2026-10-05 no texto guardado (_coleta/jes-planalto-d12456-ead-2025)"}]}, {"objecao": "Tecnólogo é faculdade mesmo?", "resposta": "É graduação. O Instituto Nacional de Estudos e Pesquisas Educacionais Anísio Teixeira (Inep) conta os cursos tecnológicos entre as matrículas de graduação. Em 2024, eram 20,2% delas (Inep, Notas Estatísticas do Censo 2024, p. 23). Use \"graduação\" antes de \"tecnólogo\" e diga a duração, dois anos.", "fontes": [{"afirmacao": "Cursos tecnológicos são 20,2% das matrículas de graduação (2024)", "fonte": "Inep, Censo da Educação Superior 2024: Notas Estatísticas, p. 23", "url": "https://download.inep.gov.br/publicacoes/institucionais/estatisticas_e_indicadores/notas_estatisticas_censo_escolar_da_educacao_superior_2024.pdf", "trecho": "Os cursos tecnológicos representam 20,2% do total de matrículas de graduação, e os de licenciatura, 16,9%.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-jessica.json (inep-tecnologicos-parte-da-graduacao-2024)"}]}, {"objecao": "E o Prouni?", "resposta": "Responda com a verdade. Pela renda da casa, ela pode caber na bolsa integral. A pré-seleção é pela nota do Exame Nacional do Ensino Médio (Enem) (Lei 11.096, arts. 1º e 3º). Se o seu curso tem vagas do Prouni, explique como se inscrever. Se não tem, diga isso e mostre o que ela ganha ao pagar: começar já, sem depender da nota nem da seleção. Não diga que a bolsa é difícil nem que não vale a pena.", "fontes": [{"afirmacao": "Bolsa integral para renda familiar de até 1,5 salário mínimo por pessoa; pré-seleção pela nota do Enem", "fonte": "Planalto · Lei nº 11.096, de 13 de janeiro de 2005, arts. 1º e 3º", "url": "https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2005/lei/l11096.htm", "trecho": "§ 1º A bolsa de estudo integral será concedida a brasileiros não portadores de diploma de curso superior, cuja renda familiar mensal per capita não exceda o valor de até 1 (um) salário-mínimo e 1/2 (meio). [...] Art. 3º O estudante a ser beneficiado pelo Prouni será pré-selecionado pelos resultados do Exame Nacional do Ensino Médio (Enem), observados o disposto no § 1º do art. 2º desta Lei e outros critérios estabelecidos pelo Ministério da Educação, e, na etapa final, será selecionado pela instituição privada de ensino superior, que poderá realizar processo seletivo próprio.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-jessica.json (fato de 2005); art. 3º na redação da Lei 14.350, de 2022"}]}, {"objecao": "Onde faço a prova?", "resposta": "Responda com endereço. A regra de 2025 exige prova presencial na sede, num campus ou num polo. As faculdades têm até maio de 2027 para cumprir por inteiro. Diga o polo mais perto do Ibura ou do shopping, quanto tempo de ônibus e quantas idas por semestre. Se não houver polo no Recife, diga antes da matrícula: \"online para todo o Brasil\" não basta para ela.", "free": true, "fontes": [{"afirmacao": "Prova presencial na sede, num campus ou num polo; dois anos para cumprir por inteiro", "fonte": "Planalto · Decreto nº 12.456, de 19 de maio de 2025, arts. 23 e 41", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/decreto/d12456.htm", "trecho": "Art. 23. As Instituições de Educação Superior deverão aplicar avaliações de aprendizagem presenciais, em suas sedes, nos campi fora das sedes e nos Polos EaD, em todas as suas unidades curriculares ofertadas de forma parcial ou integral em educação a distância. § 1º As avaliações de que trata o caput deverão: I - ocorrer periodicamente e observar os referenciais de qualidade para os cursos de graduação com oferta de ensino a distância; II - ter peso majoritário na composição da nota final de cada unidade curricular; [...] Art. 41. As Instituições de Educação Superior credenciadas e os cursos autorizados deverão atender, de forma integral, as disposições deste Decreto e do ato do Ministro de Estado que o discipline, no prazo de dois anos, contado da data de publicação deste Decreto. Parágrafo único. Ato do Ministro de Estado da Educação disciplinará as regras de transição para a aplicação do disposto neste Decreto [...] Este texto não substitui o publicado no DOU de 20.5.2025.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-jessica.json (fato de 2025)"}]}, {"objecao": "Não tenho tempo nem cabeça às 22h.", "resposta": "Não diga que é fácil. Diga quantas horas por semana o curso pede e quanto dele tem hora marcada. Pelo Decreto 12.456, art. 12, ao menos 10% do curso são presenciais, e outros 10% são presenciais ou ao vivo. As faculdades têm até maio de 2027 para cumprir por inteiro (art. 41). Diga em que dias e horários, e quantas idas ao polo. Se o horário ao vivo é fixo, avise logo: com a escala mudando toda semana, é o tipo de coisa que a faz parar.", "fontes": [{"afirmacao": "Ao menos 10% do curso presencial e outros 10% presenciais ou síncronos mediados; dois anos para cumprir por inteiro", "fonte": "Planalto · Decreto nº 12.456, de 19 de maio de 2025, arts. 12 e 41", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/decreto/d12456.htm", "trecho": "Art. 12. Os cursos de graduação a distância deverão ofertar, observadas as Diretrizes Curriculares Nacionais e ato do Ministro de Estado da Educação, no mínimo: I - 10% (dez por cento) da carga horária total do curso por meio de atividades presenciais; e II - 10% (dez por cento) da carga horária total do curso em atividades presenciais ou síncronas mediadas. [...] Art. 41. As Instituições de Educação Superior credenciadas e os cursos autorizados deverão atender, de forma integral, as disposições deste Decreto e do ato do Ministro de Estado que o discipline, no prazo de dois anos, contado da data de publicação deste Decreto. Parágrafo único. Ato do Ministro de Estado da Educação disciplinará as regras de transição para a aplicação do disposto neste Decreto [...] Este texto não substitui o publicado no DOU de 20.5.2025.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-jessica.json (fato de 2025)"}]}, {"objecao": "Meu celular trava com vídeo.", "resposta": "Mande o link de uma aula para ela abrir no celular dela antes de decidir. Diga quanto dura o vídeo, se baixa no Wi-Fi e se há versão em áudio ou texto. Se a aula é vídeo longo que não baixa, diga isso: foi o que a fez parar em 2023."}, {"objecao": "Já comecei e parei uma vez.", "resposta": "Pergunte o que a fez parar e responda a isso, sem jurar que desta vez será diferente. Diga o que acontece se ela ficar para trás: se há segunda chamada de prova, se dá para trancar sem dívida e quem fala com ela quando some. Se o curso ainda não tem nada disso, diga, e anote: é a lacuna que mais pesa."}, {"objecao": "Isso vai me fazer virar supervisora?", "resposta": "Não prometa cargo nem salário: quem decide a vaga é a loja. Mostre na grade as disciplinas que tratam de meta, estoque, margem e equipe, se houver, e sugira que ela pergunte à gerente o que pesa na promoção."}], "quem_influencia": ["Prima Tainá, 28 anos, tecnóloga em Recursos Humanos formada a distância: a voz que decide.", "Mãe, Rosângela: pesa o dinheiro da casa.", "Gerente da loja: diz que diploma conta na promoção.", "Tia comerciária: acha faculdade a distância mais fraca.", "Criadoras de conteúdo que trabalham no comércio e estudam."]}, "numeros": [{"valor": "22 anos", "frase": "é a idade mais comum de quem está matriculado na graduação a distância. Na entrada, 19; na formatura, 24.", "fonte": "Inep (Instituto Nacional de Estudos e Pesquisas Educacionais Anísio Teixeira), Censo da Educação Superior 2024: Notas Estatísticas, Quadro 2", "url": "https://download.inep.gov.br/publicacoes/institucionais/estatisticas_e_indicadores/notas_estatisticas_censo_escolar_da_educacao_superior_2024.pdf", "ano": 2024, "tipo": "lido", "free": true, "grafico": {"tipo": "barras", "unidade": "anos", "serie": [{"rotulo": "Entrada · presencial", "valor": 19}, {"rotulo": "Entrada · a distância", "valor": 19}, {"rotulo": "Matrícula · presencial", "valor": 20}, {"rotulo": "Matrícula · a distância", "valor": 22}, {"rotulo": "Formatura · presencial", "valor": 23}, {"rotulo": "Formatura · a distância", "valor": 24}]}}, {"valor": "82,6%", "frase": "das matrículas em cursos superiores de tecnologia eram a distância. Em 2014, a maioria era presencial.", "fonte": "Inep (Instituto Nacional de Estudos e Pesquisas Educacionais Anísio Teixeira), Censo da Educação Superior 2024: Notas Estatísticas, Gráfico 19", "url": "https://download.inep.gov.br/publicacoes/institucionais/estatisticas_e_indicadores/notas_estatisticas_censo_escolar_da_educacao_superior_2024.pdf", "ano": 2024, "tipo": "lido", "free": true, "grafico": {"tipo": "barras", "unidade": "matrículas", "serie": [{"rotulo": "2014 · presencial", "valor": 645125}, {"rotulo": "2014 · a distância", "valor": 384642}, {"rotulo": "2024 · presencial", "valor": 356970}, {"rotulo": "2024 · a distância", "valor": 1697467}]}}, {"valor": "32,8%", "frase": "das mulheres de 15 a 29 anos do Nordeste com ensino médio completo (ou superior incompleto) que não estudam dizem que precisam trabalhar. Falta de dinheiro caiu de 19,8% em 2019 para 9,6%.", "fonte": "IBGE (Instituto Brasileiro de Geografia e Estatística), PNAD Contínua (Pesquisa Nacional por Amostra de Domicílios Contínua) anual, tabela 7221 do SIDRA (Sistema IBGE de Recuperação Automática)", "url": "https://apisidra.ibge.gov.br/values/t/7221/n2/2/v/10410,10412,10413/p/2019,2025/c2/5/c879/all?formato=json", "ano": 2025, "tipo": "lido", "free": true, "grafico": {"tipo": "barras", "unidade": "%", "serie": [{"rotulo": "Precisa trabalhar", "valor": 32.8}, {"rotulo": "Cuida da casa ou de alguém", "valor": 17.3}, {"rotulo": "Já concluiu o que queria", "valor": 16.6}, {"rotulo": "Não tem interesse", "valor": 11.0}, {"rotulo": "Falta de dinheiro", "valor": 9.6}, {"rotulo": "Falta escola, vaga, curso ou turno", "valor": 4.7}, {"rotulo": "Estuda por conta própria", "valor": 3.9}, {"rotulo": "Outro motivo", "valor": 3.9}]}}, {"valor": "59,7%", "frase": "das mulheres de 18 a 24 anos no Brasil não estudavam e não tinham concluído o ensino superior. Só 28,8% cursavam o superior.", "fonte": "IBGE (Instituto Brasileiro de Geografia e Estatística), PNAD Contínua (Pesquisa Nacional por Amostra de Domicílios Contínua): Educação 2025 (informativo)", "url": "https://biblioteca.ibge.gov.br/visualizacao/livros/liv102286_informativo.pdf", "ano": 2025, "tipo": "lido", "free": false, "grafico": {"tipo": "rosca", "unidade": "%", "serie": [{"rotulo": "Cursa o superior", "valor": 28.8}, {"rotulo": "Ainda na educação básica", "valor": 6.3}, {"rotulo": "Já concluiu o superior", "valor": 5.2}, {"rotulo": "Não estuda e não concluiu", "valor": 59.7}]}}, {"valor": "29,5%", "frase": "das mulheres de 18 a 24 anos em Pernambuco estavam no ensino superior ou já o tinham concluído. Em 2016, eram 22,5%. A tabela não tem 2020 nem 2021, e parte do sobe e desce pode ser oscilação da amostra.", "fonte": "IBGE (Instituto Brasileiro de Geografia e Estatística), PNAD Contínua (Pesquisa Nacional por Amostra de Domicílios Contínua) anual, tabela 7141 do SIDRA", "url": "https://apisidra.ibge.gov.br/values/t/7141/n3/26/v/10282,10283/p/all/c2/5/c871/47819?formato=json", "ano": 2025, "tipo": "lido", "free": false, "grafico": {"tipo": "barras", "unidade": "%", "serie": [{"rotulo": "2016", "valor": 22.5}, {"rotulo": "2017", "valor": 17.7}, {"rotulo": "2018", "valor": 20.6}, {"rotulo": "2019", "valor": 21.9}, {"rotulo": "2022", "valor": 23.8}, {"rotulo": "2023", "valor": 23.7}, {"rotulo": "2024", "valor": 27.0}, {"rotulo": "2025", "valor": 29.5}]}}, {"valor": "12,9%", "frase": "das mulheres de 15 a 29 anos em Pernambuco trabalhavam e estudavam ao mesmo tempo. Outras 25,8% trabalhavam sem estudar, o grupo de onde a Jéssica quer sair. Estudar, aqui, inclui escola, pré-vestibular, curso técnico e qualificação.", "fonte": "IBGE (Instituto Brasileiro de Geografia e Estatística), PNAD Contínua (Pesquisa Nacional por Amostra de Domicílios Contínua) anual, tabela 7206 do SIDRA", "url": "https://apisidra.ibge.gov.br/values/t/7206/n3/26/v/10313,10315,10316/p/2019,2025/c2/5/c876/all?formato=json", "ano": 2025, "tipo": "lido", "free": false, "grafico": {"tipo": "barras", "unidade": "%", "serie": [{"rotulo": "Trabalha e estuda", "valor": 12.9}, {"rotulo": "Trabalha e não estuda", "valor": 25.8}, {"rotulo": "Estuda e não trabalha", "valor": 28.6}, {"rotulo": "Nem trabalha nem estuda", "valor": 32.7}]}}, {"valor": "R$ 2.071 e R$ 7.313", "frase": "era o rendimento médio mensal, em Recife, de quem tinha ensino médio completo e de quem tinha superior completo, no 2º trimestre de 2026. A média junta todas as profissões e não serve como promessa de salário de tecnólogo.", "fonte": "IBGE (Instituto Brasileiro de Geografia e Estatística), PNAD Contínua (Pesquisa Nacional por Amostra de Domicílios Contínua) trimestral, tabela 5438 do SIDRA", "url": "https://apisidra.ibge.gov.br/values/t/5438/n6/2611606/n7/2601/v/5932,5940/p/202602/c1568/all?formato=json", "ano": 2026, "tipo": "lido", "free": false, "grafico": {"tipo": "barras", "unidade": "R$ por mês", "serie": [{"rotulo": "Médio completo", "valor": 2071}, {"rotulo": "Superior incompleto", "valor": 2390}, {"rotulo": "Superior completo", "valor": 7313}]}}, {"valor": "73%", "frase": "dos usuários de internet com ensino médio acessavam a rede só pelo celular, contra 24% dos que têm superior. De 16 a 24 anos, 56%.", "fonte": "Cetic.br (Centro Regional de Estudos para o Desenvolvimento da Sociedade da Informação), TIC Domicílios 2025 (tecnologias de informação e comunicação nos domicílios), gráfico 2D", "url": "https://cetic.br/media/analises/tic_domicilios_2025_principais_resultados.pdf", "ano": 2025, "tipo": "lido", "free": false, "grafico": {"tipo": "barras", "unidade": "%", "serie": [{"rotulo": "Superior", "valor": 24}, {"rotulo": "Médio", "valor": 73}, {"rotulo": "Fundamental", "valor": 84}]}}, {"valor": "12,0%", "frase": "da renda média de quem tem ensino médio completo em Recife iria para a mensalidade de R$ 249 do curso de exemplo. Conta: 249 ÷ 2.071 = 0,120. Em dois anos sem reajuste, o curso soma R$ 5.976 (conta: 24 × 249).", "fonte": "IBGE (Instituto Brasileiro de Geografia e Estatística), PNAD Contínua (Pesquisa Nacional por Amostra de Domicílios Contínua) trimestral, tabela 5438 do SIDRA (renda); mensalidade do curso de exemplo (premissa do produto)", "url": "https://apisidra.ibge.gov.br/values/t/5438/n6/2611606/n7/2601/v/5932,5940/p/202602/c1568/all?formato=json", "ano": 2026, "tipo": "conta", "free": false, "conta": "249 ÷ 2.071 = 0,1202, ou 12,0%. Resto da renda média: 2.071 menos 249 = 1.822. Total do curso: 24 × 249 = 5.976.", "grafico": {"tipo": "rosca", "unidade": "R$", "serie": [{"rotulo": "Mensalidade do curso", "valor": 249}, {"rotulo": "Resto da renda média", "valor": 1822}]}}], "falar": {"proposta": "Graduação tecnológica em Gestão Comercial, de dois anos (curso de tecnólogo), sem largar a loja, por R$ 249 por mês. Preço, polo da prova e regra da mensalidade vão por escrito antes de você assinar.", "use": ["graduação tecnológica", "a vaga de supervisora, como meta dela (nunca como promessa)", "dois anos", "R$ 249 por mês", "por escrito", "endereço do polo", "total dos dois anos", "sem largar a loja (se o horário couber)", "para quem trabalha no comércio"], "evite": [["fácil", "confirma a dúvida da tia sobre diploma a distância e apaga o mérito que ela quer provar"], ["rápido", "soa como diploma comprado; ela quer a prova de que estudou"], ["a partir de", "é quando ela some no direct, porque lembra a mensalidade que subiu em 2023"], ["100% online", "a regra de 2025 pede prova presencial e um quinto do curso com hora marcada. As faculdades têm até maio de 2027 para cumprir por inteiro (Decreto 12.456, art. 41), e ela estuda até 2028. Ela descobre no polo e deixa de confiar"], ["primeira mensalidade com desconto", "foi a isca da faculdade de 2023"], ["invista em você", "ela põe a casa antes de si; soa como dinheiro que sai da casa"], ["tecnólogo, sem dizer que é graduação", "ela procura \"faculdade\"; sozinha, a palavra deixa a tia achar que é curso menor"], ["garantia de promoção", "ninguém garante cargo, e ela lê promessa de ganho rápido com a desconfiança que criou das apostas dos colegas"]], "canal": "Instagram e TikTok para o primeiro contato, com aluna do comércio falando no lugar da marca. WhatsApp só depois que ela pede informação, com mensagem que ela possa encaminhar à prima.", "hora": "No intervalo, por volta das 15h, no Wi-Fi do shopping, e das 21h30 às 23h, na fibra de casa. Na semana de turno da tarde, também de manhã. Nessas janelas, vídeo funciona. No ônibus, depois do dia 20, os dados acabam: ali, só texto e áudio curto. Campanha de matrícula depois do Natal, que é pico da loja, e em janeiro, quando o décimo terceiro e a comissão já entraram.", "mensagem": "Oi, Jéssica! A graduação tecnológica em Gestão Comercial, de dois anos (curso de tecnólogo), custa R$ 249 por mês. Dá para fazer sem largar a loja se os horários com hora marcada couberem na sua escala. Antes de você decidir, te mando por escrito: endereço do polo da prova, idas por semestre, horários com hora marcada e regra de reajuste. Posso mandar?", "por_etapa": [{"etapa": "Necessidade", "mensagem": "Quer disputar a próxima vaga? A graduação tecnológica em Gestão Comercial, de dois anos (curso de tecnólogo), é para quem trabalha no comércio. Te mostro na grade o que ela tem de meta, estoque e margem."}, {"etapa": "Pesquisa", "mensagem": "R$ 249 por mês. Dois anos: 24 × R$ 249 = R$ 5.976, se não houver reajuste. Se houver, a regra vai por escrito. Pergunte o que quiser por aqui."}, {"etapa": "Decisão", "mensagem": "Para mostrar em casa: preço, total dos dois anos, regra do reajuste, endereço do polo e idas por semestre, numa imagem só. Encaminhe para quem você quiser."}, {"etapa": "Matrícula", "mensagem": "Bem-vinda, Jéssica! Aqui está o calendário do semestre: prazos, provas e encontros com hora marcada, com dia, horário e lugar. Confira com a sua escala e me diga se alguma data cai no pico da loja."}, {"etapa": "Primeiros meses", "mensagem": "Jéssica, você não entrou nesta semana. Pico na loja? Me diga quantos minutos você tem por dia, e a gente refaz o plano até a prova (proposta a testar)."}, {"etapa": "Indicação", "mensagem": "Um ano de curso, Jéssica. Se uma colega da loja quiser começar no próximo semestre, indique: as duas ganham um benefício na mensalidade (proposta a testar)."}], "condicao": "Use a proposta e a mensagem só se o seu curso tiver três coisas. Polo de prova no Recife, regra de reajuste por escrito e horários com hora marcada que caibam numa escala que muda. Se faltar uma delas, tire a promessa e diga o que falta.", "fontes": [{"afirmacao": "Prova presencial com peso maior, um quinto do curso com hora marcada e prazo até maio de 2027", "fonte": "Planalto · Decreto nº 12.456, de 19 de maio de 2025, arts. 12, 23 e 41", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/decreto/d12456.htm", "trecho": "Art. 12. Os cursos de graduação a distância deverão ofertar, observadas as Diretrizes Curriculares Nacionais e ato do Ministro de Estado da Educação, no mínimo: I - 10% (dez por cento) da carga horária total do curso por meio de atividades presenciais; e II - 10% (dez por cento) da carga horária total do curso em atividades presenciais ou síncronas mediadas. [...] Art. 23. As Instituições de Educação Superior deverão aplicar avaliações de aprendizagem presenciais, em suas sedes, nos campi fora das sedes e nos Polos EaD, em todas as suas unidades curriculares ofertadas de forma parcial ou integral em educação a distância. § 1º As avaliações de que trata o caput deverão: I - ocorrer periodicamente e observar os referenciais de qualidade para os cursos de graduação com oferta de ensino a distância; II - ter peso majoritário na composição da nota final de cada unidade curricular; [...] Art. 41. As Instituições de Educação Superior credenciadas e os cursos autorizados deverão atender, de forma integral, as disposições deste Decreto e do ato do Ministro de Estado que o discipline, no prazo de dois anos, contado da data de publicação deste Decreto. Parágrafo único. Ato do Ministro de Estado da Educação disciplinará as regras de transição para a aplicação do disposto neste Decreto [...] Este texto não substitui o publicado no DOU de 20.5.2025.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-jessica.json (fato de 2025)"}]}, "encaixe": {"tarefas": ["Ter um diploma de graduação até o fim de 2028 sem largar o salário que segura a casa", "Entender meta, ticket médio, estoque e margem para disputar a próxima vaga de supervisora", "Terminar desta vez e fechar a conta da desistência de 2023", "Ser vista na loja e em casa como alguém que estudou"], "dores": ["Medo de parar de novo e confirmar que \"não é de estudo\"", "Escala que muda toda semana, sem horário fixo para estudar", "Medo de a mensalidade subir depois da matrícula", "Celular cheio e dados que acabam perto do dia 20", "Dúvida se o diploma a distância vale para a gerente e para a próxima loja", "Culpa de tirar da casa o dinheiro do curso"], "ganhos": ["Diploma de graduação sem a palavra \"a distância\"", "Preço do mês e total dos dois anos conhecidos antes de assinar", "Estudo que cabe no ônibus, no intervalo e na manhã livre", "Algo para mostrar na loja antes da formatura", "Alguém que perceba quando ela some"], "produtos": ["Curso superior de tecnologia em Gestão Comercial: graduação de dois anos", "A distância, vendido online para todo o Brasil", "R$ 249 por mês", "Por regra federal, a cumprir até maio de 2027 (Decreto 12.456, art. 41): prova presencial que vale a maior parte da nota (art. 23). Ao menos 10% do curso presencial e outros 10% presenciais ou ao vivo (art. 12)."], "aliviadores": ["A distância: ela estuda sem largar o emprego. Falta dizer em que dias e horários fica o quinto do curso com hora marcada.", "Hipótese: R$ 249 por mês cabe se ela cortar o delivery e a música; a quinta pergunta de campo testa isso. Para comparar: é 12,0% da renda média de quem tem ensino médio completo em Recife (conta: 249 ÷ 2.071). E é 15,4% do salário mínimo (conta: 249 ÷ 1.621).", "Dois anos: se começar em janeiro de 2027, ela se forma no fim de 2028, aos 25 anos."], "criadores": ["O diploma não pode informar que o curso foi a distância (Decreto 9.235, art. 100, na redação do Decreto 12.456, de 2025). Responde à dúvida da tia. O prazo para as faculdades cumprirem vai até maio de 2027, e ela se forma depois disso.", "A prova presencial vale a maior parte da nota, pela regra a cumprir até maio de 2027. É a prova de que ela estudou de verdade, que ela mesma pede.", "O público do curso, segundo o próprio produto, é gente que trabalha no comércio e quer crescer no emprego. O produto declara esse público; quem de fato se matricula se confere na primeira turma.", "Gestão comercial é o assunto da vaga que ela quer. A grade ainda precisa mostrar meta, estoque, margem e equipe."], "lacunas": ["Ficar até o fim. A dor mais forte dela é parar de novo, e a oferta não diz o que acontece quando ela some uma semana. Nos cursos a distância da rede privada, 68,1% de quem entrou em 2020 tinha desistido até 2024, contando também quem faleceu. A fonte é o Instituto Semesp (Mapa do Ensino Superior 2026), com dados do Instituto Nacional de Estudos e Pesquisas Educacionais Anísio Teixeira (Inep). O Semesp é a entidade que representa as mantenedoras do ensino superior privado.", "Polo da prova. \"Online para todo o Brasil\" não diz onde ela faz a prova presencial que a regra de 2025 exige. Sem polo perto do Ibura ou do shopping, ela não fecha. O endereço precisa vir antes da matrícula.", "Horário com hora marcada. Pelo decreto, ao menos 10% do curso é presencial e outros 10% são presenciais ou ao vivo, com controle de frequência (Decreto 12.456, art. 12). Um quinto do curso fica com hora marcada (conta nossa: 10% + 10%). As faculdades têm até maio de 2027 para cumprir por inteiro (art. 41). Se os horários forem fixos, batem de frente com a escala que muda toda semana. A portaria do Ministério da Educação (MEC) que detalha o decreto não foi lida.", "Mensalidade. Sabemos o valor de hoje, R$ 249. Não sabemos se fica igual até a formatura. Em 24 meses sem reajuste, o curso soma R$ 5.976 (conta: 24 × 249). Falta a regra do
