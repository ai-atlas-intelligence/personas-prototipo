carga: a oferta não diz onde carregar nem se ajuda a instalar um ponto na garagem. É a dúvida que mais trava a compra. Faltam três respostas. Quantos km a tomada comum repõe numa noite em casa, contra os 160 km do dia (hipótese da ficha)? A noite dele vai das 20h20 às 5h40 (conta: 9 horas e 20 minutos). Quem paga a luz da garagem, que fica na casa dos pais? Dá para instalar um ponto numa casa sem escritura própria? Diga o que existe e não prometa rede de recarga que você não controla.", "Bateria: falta a garantia por escrito, em anos e em quilômetros, e o preço da troca fora dela. Para quem roda muito, o limite em quilômetros pesa. Marcos roda perto de 50 mil km por ano (hipótese da ficha). O governo supôs o mesmo para carro de aplicativo ou táxi, como premissa sem medição publicada (exposição de motivos da Medida Provisória 1.362, de 2026).", "Oficina e carro parado: a oferta não fala de rede de manutenção nem de carro reserva. Se o carro parar, a renda dele para no mesmo dia.", "Revenda: não há valor de recompra. A fatia dos eletrificados, somando elétricos e híbridos, subiu de 9,4% das vendas de carros leves em agosto de 2025 para 21,8% em agosto de 2026 (ABVE). Isso não diz quanto o carro dele vai valer.", "Crédito federal: a oferta ainda não sabe se Marcos chega a ele. São três confirmações. O modelo entra? A montadora precisa de habilitação do governo (Lei 15.503, art. 8º), e os itens financiáveis dependem de um ato que não lemos (art. 6º, § 10). Marcos entra? Os critérios de quem pode pedir saem do mesmo ato, e quem informa se ele cumpre é a plataforma de corrida (art. 10, I). Em maio, a Agência Senado noticiou dois critérios: cadastro ativo há 12 meses e 100 corridas na mesma plataforma. A norma não foi lida. O MEI atrasado pode pesar, mas isso é hipótese. O banco aprova? O risco de crédito fica com o banco (art. 6º, § 6º).", "Crédito federal, o outro lado: a mesma linha pode financiar um flex novo, que concorre com o elétrico na planilha dele. O governo calculou o programa com 200 mil carros flex (exposição de motivos da Medida Provisória 1.362). O teto por carro aparece como R$ 150 mil na Agência Senado e R$ 200 mil na ABVE. Juros e prazo ficam com o Conselho Monetário Nacional (art. 6º, § 9º), e os limites, com o ato conjunto (art. 6º, § 10). As páginas dessas normas no gov.br pediram login. E a linha financia um carro por motorista (art. 12): o segundo carro que ele sonha fica fora dela."], "nota": "Canvas de proposta de valor (Osterwalder, Pigneur, Bernarda e Smith, 2014). O lado de Marcos sai da ficha e é hipótese. O lado do produto usa só o que o empreendedor informou. É um carro elétrico compacto, com financiamento para motorista de aplicativo. Custa a partir de R$ 130 mil ou em parcela semanal, e é vendido na concessionária em São Paulo e no site. Todo encaixe é afirmação a testar com motoristas.", "fontes": [{"afirmacao": "R$ 2.873 por mês, motorista de carro por aplicativo, Brasil, 2025", "fonte": "IBGE, PNAD Contínua (Pesquisa Nacional por Amostra de Domicílios Contínua), Trabalho por meio de plataformas digitais 2025", "url": "https://biblioteca.ibge.gov.br/visualizacao/livros/liv102309_informativo.pdf", "trecho": "o rendimento médio mensal real habitualmente recebido no trabalho principal pelos condutores plataformizados foi de R$ 2 873, ou seja, R$ 68 superior ao observado entre os não plataformizados (R$ 2 805). Essa diferença caiu no último ano, pois, em 2024, era de R$ 359.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json; o IBGE escreve R$ 2 873", "lacuna": 0}, {"afirmacao": "Gasolina a R$ 6,35 e etanol a R$ 3,91 o litro na cidade de São Paulo, semana de 27/9 a 3/10/2026", "fonte": "ANP, Síntese Semanal de Preços dos Combustíveis 40/2026", "url": "https://www.gov.br/anp/pt-br/assuntos/precos-e-defesa-da-concorrencia/precos/arq-sintese-semanal/2026/sintese-precos-40.pdf", "trecho": "Preços médios de revenda da gasolina C comum por capitais - Semana de 27/09/2026 a 03/10/2026 [...] São Paulo | 6,35 | 0,95% | 3,08% [...] Preços médios de revenda do etanol hidratado por capitais [...] São Paulo | 3,91 | 2,36% | -6,24%", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json", "bloco": "aliviadores"}, {"afirmacao": "80,2% dizem que o aplicativo define totalmente o valor recebido (2025)", "fonte": "IBGE, PNAD Contínua, Trabalho por meio de plataformas digitais 2025", "url": "https://biblioteca.ibge.gov.br/visualizacao/livros/liv102309_informativo.pdf", "trecho": "entre as pessoas que trabalhavam por meio de aplicativo de transporte particular de passageiros (exclusive aplicativo de táxi), em 2025, 80,2% afirmaram que dependiam totalmente do aplicativo para definição do valor a ser recebido. [...] Aplicativo de transporte particular de passageiros (1) | 80,2 | 16,1 | 60,8 | 28,1 | 49,5 | 26,4 | 60,6 | 25,9", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json", "bloco": "criadores"}, {"afirmacao": "50 mil km por ano por carro e 200 mil carros flex, premissas do governo", "fonte": "Planalto · Exposição de motivos nº 1.248/2026, da MP (medida provisória) 1.362, de 25 de maio de 2026", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2026/exm/exm-mp-1362-26.pdf", "trecho": "considerando a comercialização de 200.000 veículos “ﬂex-fuel” e a quilometragem média anual de 50.000 km por veículo, estima-se que a frota beneﬁciada percorra aproximadamente 10 bilhões de quilômetros por ano.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json (fontes_extras do fato de 2026); premissa, sem medição", "lacuna": 2}, {"afirmacao": "Eletrificados: 9,4% das vendas de leves em agosto de 2025 e 21,8% em agosto de 2026", "fonte": "ABVE, balanço de agosto de 2026 (09/09/2026)", "url": "https://abve.org.br/com-57-mil-emplacamentos-em-agosto-eletrificados-abrem-a-corrida-para-o-milhao-em-setembro/", "trecho": "Evolução da participação dos eletrificados no mercado brasileiro: ago/25: 9,4% nov/25: 9,3% fev/26: 14,1% maio/26: 17,0% ago/26: 21,8% [...] Em outras palavras, de cada 100 veículos leves vendidos no Brasil em agosto, 22 foram eletrificados.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json", "lacuna": 4}, {"afirmacao": "Montadora precisa de habilitação do governo federal", "fonte": "Planalto · Lei nº 15.503, de 14 de setembro de 2026, art. 8º", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2026/lei/l15503.htm", "trecho": "Art. 8º A habilitação das montadoras dos veículos a serem financiados no âmbito das linhas de financiamento de que trata o art. 6º será realizada pelo Ministério do Desenvolvimento, Indústria, Comércio e Serviços.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json (fontes_extras do fato de 2026)", "capturas": ["capturas/marcos-planalto-l15503-arts-8-10-12-13.png"], "lacuna": 5}, {"afirmacao": "Critérios de quem pode pedir e dos itens financiáveis ficam para ato conjunto", "fonte": "Planalto · Lei nº 15.503, de 14 de setembro de 2026, art. 6º, § 10", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2026/lei/l15503.htm", "trecho": "§ 10. Ato conjunto do Ministro de Estado do Desenvolvimento, Indústria, Comércio e Serviços e do Ministro de Estado da Fazenda disporá sobre as linhas de financiamento de que trata o caput, inclusive quanto a critérios de elegibilidade dos beneficiários, critérios de elegibilidade para adesão das plataformas digitais intermediadoras do serviço de transporte remunerado privado individual de passageiros, critérios de elegibilidade dos itens financiáveis e critérios de sustentabilidade ambiental, social ou econômica, bem como sobre os limites e termos das referidas linhas de financiamento.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json (fontes_extras do fato de 2026)", "capturas": ["capturas/marcos-planalto-l15503-art6-par4-a-par10.png"], "lacuna": 5}, {"afirmacao": "A plataforma de corrida informa se o motorista cumpre os critérios", "fonte": "Planalto · Lei nº 15.503, de 14 de setembro de 2026, art. 10, I", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2026/lei/l15503.htm", "trecho": "Art. 10. A concordância, realizada eletronicamente em sítio eletrônico, para fins de requerimento de acesso às linhas de financiamento de que trata o art. 6º, implicará o consentimento e a autorização para envio ao Ministério do Desenvolvimento da Indústria, Comércio e Serviços e ao BNDES: I - da informação sobre se o solicitante atende ou não aos critérios de elegibilidade da medida, no caso dos beneficiários de que trata o art. 6º, § 1º, inciso I, pela plataforma digital intermediadora do serviço de transporte remunerado privado individual de passageiros;", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json (fontes_extras do fato de 2026)", "capturas": ["capturas/marcos-planalto-l15503-arts-8-10-12-13.png"], "lacuna": 5}, {"afirmacao": "O banco assume o risco de crédito", "fonte": "Planalto · Lei nº 15.503, de 14 de setembro de 2026, art. 6º, § 6º", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2026/lei/l15503.htm", "trecho": "§ 6º As linhas de financiamento de que trata o caput serão fornecidas pelo BNDES ou por instituições financeiras por ele habilitadas, que assumirão os riscos das operações, incluído o risco de crédito, e as ofertarão aos beneficiários a que se refere o § 1º, observados os critérios de elegibilidade de que trata o § 10.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json (fontes_extras do fato de 2026)", "capturas": ["capturas/marcos-planalto-l15503-art6-par4-a-par10.png"], "lacuna": 5}, {"afirmacao": "Critérios noticiados em maio (12 meses de cadastro e 100 corridas na mesma plataforma), carros flex no programa e teto de R$ 150 mil", "fonte": "Agência Senado · MP libera R$ 30 bilhões para compra de táxis e carros de aplicativos (26/05/2026), fonte secundária", "url": "https://www12.senado.leg.br/noticias/materias/2026/05/26/mp-libera-r-30-bilhoes-para-compra-de-taxis-e-carros-de-aplicativos", "trecho": "O dinheiro será usado para a compra de veículos novos considerados sustentáveis (elétricos, híbridos a etanol ou flex) por taxistas, motoristas de aplicativo e cooperativas. [...] podem participar do programa motoristas de aplicativos com cadastro ativo há pelo menos 12 meses, que tenham realizado ao menos 100 corridas nesse período, na mesma plataforma, além de taxistas registrados e em atividade. As condições favoráveis de financiamento valem para carros novos de até R$ 150 mil de montadoras habilitadas no Programa Mover.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json (fontes_extras do fato de 2026); fonte secundária", "capturas": ["capturas/marcos-senado-move-brasil-150-mil.png"], "lacuna": 5}, {"afirmacao": "Teto de R$ 200 mil e prazo de até 84 meses, segundo a ABVE", "fonte": "ABVE · Com vendas de 57 mil em agosto, eletrificados abrem corrida para o milhão em setembro (09/09/2026), fonte secundária", "url": "https://abve.org.br/com-57-mil-emplacamentos-em-agosto-eletrificados-abrem-a-corrida-para-o-milhao-em-setembro/", "trecho": "O programa dispõe de até R$ 30 bilhões e prevê o financiamento de automóveis de até R$ 200 mil, com prazo de até 84 meses.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json (fontes_extras do fato de 2026); fonte secundária", "capturas": ["capturas/marcos-abve-move-brasil-200-mil.png"], "lacuna": 6}, {"afirmacao": "Juros, prazos e condições ficam com o Conselho Monetário Nacional", "fonte": "Planalto · Lei nº 15.503, de 14 de setembro de 2026, art. 6º, § 9º", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2026/lei/l15503.htm", "trecho": "§ 9º As condições, os encargos financeiros, os prazos e as demais normas regulamentadoras das linhas de financiamento de que trata o caput serão estabelecidos pelo Conselho Monetário Nacional.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json (fontes_extras do fato de 2026)", "capturas": ["capturas/marcos-planalto-l15503-art6-par4-a-par10.png"], "lacuna": 6}, {"afirmacao": "Um carro por motorista na linha federal", "fonte": "Planalto · Lei nº 15.503, de 14 de setembro de 2026, art. 12", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2026/lei/l15503.htm", "trecho": "Art. 12. O acesso às linhas de financiamento de que trata o art. 6º fica limitado a 1 (um) veículo por beneficiário, no caso do art. 6º, § 1º, incisos I e II, e por cooperado, no caso do art. 6º, § 1º, inciso III.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json (fontes_extras do fato de 2026)", "capturas": ["capturas/marcos-planalto-l15503-arts-8-10-12-13.png"], "lacuna": 6}]}, "ideias": [{"tipo": "Produto", "titulo": "A conta da semana na primeira tela", "texto": "No site e no WhatsApp, três campos: quilômetros por dia, gasto de hoje com combustível e oficina, e a parcela semanal. Do lado do produto, entram o consumo do modelo e a tarifa de energia. A resposta é quanto sobra, com o preço da bomba da semana e a fonte ao lado. Comece com uma planilha que o vendedor preenche no WhatsApp; vira ferramenta depois que provar venda.", "teste": "Em 30 dias, comparar quantas conversas com a conta feita viram visita à loja, contra as conversas sem a conta."}, {"tipo": "Oferta", "titulo": "Um dia de corrida antes de assinar", "texto": "Test drive de um dia inteiro, com o aplicativo ligado e a planilha dele à noite. É o que ele pede na hora de decidir. Antes de lançar, confirme seguro e cadastro do carro no aplicativo. Confirme também o CSVAPP (Certificado de Segurança do Veículo de Aplicativo), que a Prefeitura de São Paulo exige do carro de aplicativo.", "fontes": [{"fonte": "Prefeitura de São Paulo, Decreto nº 56.981, de 2016, art. 15, § 1º, com redação do Decreto nº 58.595, de 2019 (texto compilado)", "url": "https://legislacao.prefeitura.sp.gov.br/decreto-56981-de-10-de-maio-de-2016", "trecho": "§ 1º Os motoristas e veículos cadastrados nas OTTCs devem possuir, respectivamente, o CONDUAPP e o CSVAPP.(Redação dada pelo Decreto nº 58.595/2019)", "conferido_em": "2026-10-05", "como": "Texto guardado em dados/_coleta-marcos/sp-decreto-56981.texto.txt, página aberta em 2026-10-05 às 10h15 (HTTP 200)"}], "teste": "Oferecer a quem já fez a conta e medir quantos fecham em até 15 dias, contra quem fez a volta comum na loja."}, {"tipo": "Oferta", "titulo": "Bateria e recarga numa folha só", "texto": "Antes da proposta, entregue por escrito a garantia da bateria em anos e em quilômetros e o preço da troca fora dela. Na mesma folha, vão o tempo de carga na tomada comum da garagem dele e o orçamento para instalar um ponto de recarga. Ele compra o que consegue conferir.", "teste": "Mandar a folha junto com a proposta para metade dos interessados e ver quantos respondem em uma semana, contra a outra metade."}, {"tipo": "Portfólio", "titulo": "Parcela protegida", "texto": "Seguro do carro e seguro prestamista, ligado ao financiamento, na mesma parcela. O que cada um cobre depende da apólice. Se o crédito vier da linha federal, a Lei 15.503, de 2026, permite financiar os dois junto com o carro (art. 6º, § 4º). Vale nos termos de um ato ainda não lido. A mesma lei deixa o banco usar parcelas iniciais e finais diferentes, para facilitar o acesso ao crédito (art. 13). O seguro na parcela sai do mesmo teto de R$ 620 da conta dele (hipótese da ficha). Inclua ajuda para pôr o MEI (microempreendedor individual) em dia. Em 2025, só 25,5% dos motoristas de carro por aplicativo contribuíam para a previdência (IBGE, Instituto Brasileiro de Geografia e Estatística).", "fontes": [{"fonte": "Planalto · Lei nº 15.503, de 14 de setembro de 2026, art. 6º, § 4º, I", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2026/lei/l15503.htm", "trecho": "§ 4º Nas linhas de financiamento de que trata o caput, admitem-se: I - o financiamento de seguro do bem e de seguro prestamista, quando contratados em conjunto com o referido bem, nos termos estabelecidos no ato de que trata o § 10;", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json (fontes_extras do fato de 2026)", "capturas": ["capturas/marcos-planalto-l15503-art6-par4-a-par10.png"]}, {"fonte": "Planalto · Lei nº 15.503, de 14 de setembro de 2026, art. 13", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2026/lei/l15503.htm", "trecho": "Art. 13. Respeitada a governança interna de cada instituição, os agentes financeiros das linhas de financiamento de que trata o art. 6º poderão adotar sistema de amortização variável que viabilize o acesso ao crédito pelo beneficiário por meio da diferenciação de parcelas iniciais e finais.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json (fontes_extras do fato de 2026)", "capturas": ["capturas/marcos-planalto-l15503-arts-8-10-12-13.png"]}, {"fonte": "IBGE, PNAD Contínua, Trabalho por meio de plataformas digitais 2025", "url": "https://biblioteca.ibge.gov.br/visualizacao/livros/liv102309_informativo.pdf", "trecho": "Observa-se que apenas 43,8% do total de condutores de automóveis, sejam eles plataformizados ou não, estavam cobertos por instituto de previdência em 2025, percentual esse substancialmente abaixo do observado para o total de ocupados no setor privado, cuja proporção de contribuintes alcançava 62,4%. Entre os motoristas plataformizados, o percentual de contribuintes era ainda menor (25,5%), ao passo que 59,2% dos não plataformizados contribuíam para instituto de previdência.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json"}], "teste": "Na simulação, mostrar a parcela com e sem seguro e anotar quantos escolhem a protegida e quanto a mais aceitam pagar."}, {"tipo": "Portfólio", "titulo": "Aluguel semanal com opção de compra", "texto": "Para quem ainda desconfia do elétrico: algumas semanas de aluguel, a planilha na mão e só então o financiamento, com parte do aluguel abatida. Marcos rodou com carro alugado por semana entre 2016 e 2018 e conhece o modelo. Serve também a quem ainda não tem carro.", "teste": "Antes de montar frota, perguntar nas simulações quem trocaria o financiamento por algumas semanas de aluguel. Se forem poucos, a frota não se paga."}, {"tipo": "Comunicação", "titulo": "A semana de quem já trocou", "texto": "Quando houver os primeiros clientes motoristas, eles mostram o extrato da semana, com autorização, em vídeo curto e nos grupos de WhatsApp em que o administrador permitir. Sem ator e sem frase de efeito. Para ele, o extrato do colega vale mais que qualquer anúncio. Antes disso, o test drive de um dia faz esse papel.", "teste": "Com autorização do administrador de cada grupo, postar duas semanas de extrato real em três grupos, assinado pelo cliente, e contar quantos motoristas pedem a conta pelo WhatsApp."}], "conversa": [["O que te faria trocar de carro este ano?", "Ver a conta fechar. Se a parcela mais a energia der menos que o etanol mais a manutenção, eu troco."], ["Qual o seu maior medo com o elétrico?", "A bateria. Se der problema, quanto custa? E ficar sem carga no meio de uma corrida."], ["Onde você pesquisa antes de comprar?", "No grupo dos motoristas. Se um colega mostra quanto ganhou na semana, vale mais que qualquer propaganda."], ["O preço do carro pesa?", "Eu nem penso no preço do carro. Eu penso na parcela da semana."], ["Você ouviu falar do crédito do governo para motorista?", "Ouvi no grupo. Uns falam em 150 mil, outros em 200 mil. Quero ver no papel, com juros e prazo, antes de acreditar."], ["O que você faria com duas horas a mais por dia?", "Buscava a Lívia na escola. E dormia um pouco mais, para falar a verdade."]], "teste": {"texto": "O futuro chegou! Carro 100% elétrico a partir de R$ 130 mil. Zero combustível, tecnologia de ponta e muita economia. Venha fazer seu test drive!", "funciona": ["“Zero combustível” toca na maior dor da conta dele.", "O convite ao test drive acerta: ele quer experimentar antes de decidir."], "afasta": ["“A partir de R$ 130 mil” põe o preço cheio na frente; ele pensa na parcela da semana.", "“Muita economia” vem sem número e sem conta; ele quer o custo por quilômetro na rotina dele.", "“O futuro chegou” e “tecnologia de ponta” soam caros e frágeis para quem trabalha com o carro e decide pela semana que vem.", "Não diz onde carregar nem o que acontece se a bateria falhar, as duas dúvidas que travam a compra.", "Uma volta no quarteirão não responde; ele quer rodar um dia inteiro com o aplicativo ligado."], "reescrita": "Quanto sobra na sua semana com um elétrico de parcela semanal? Mande os seus quilômetros e o gasto de hoje com combustível e oficina. A gente devolve a conta por escrito, antes de você vir à loja em São Paulo.", "condicao": "Só prometa a conta por escrito com o consumo do modelo, a tarifa de energia da casa dele e a parcela semanal em mãos."}, "elenco": [{"nome": "Ana Paula Rocha", "idade": 45, "ocupacao": "Representante comercial", "cidade": "Campinas (SP)", "quer": "Rodar a região gastando menos", "medo": "Viagem longa sem ponto de recarga", "palavra": "autonomia", "canal": "LinkedIn e concessionária", "foto_prompt_en": "Photorealistic head-and-shoulders portrait of a fictional 45-year-old Brazilian woman, fair skin with light freckles, shoulder-length wavy light brown hair, thin-framed glasses, dark green blouse, standing beside a car in an open office parking lot of a mid-size city, natural afternoon light, blurred background, eye-level framing, no text, no logos, no brand marks, not a real person.", "foto": {"arquivo": "img/marcos-elenco-1.jpg", "alt": "Retrato gerado por inteligência artificial (IA) para Ana; não é uma pessoa real"}}, {"nome": "Diego Santos", "idade": 29, "ocupacao": "Entregador de moto que quer virar motorista", "cidade": "Guarulhos (SP)", "quer": "Sair da moto", "medo": "Não ter o financiamento aprovado", "palavra": "entrada baixa", "canal": "TikTok e WhatsApp", "foto_prompt_en": "Photorealistic head-and-shoulders portrait of a fictional 29-year-old Black Brazilian man, dark brown skin, short curly hair, light stubble, orange delivery jacket open over a plain t-shirt, holding a motorcycle helmet under his arm on a busy sidewalk in a Brazilian city, natural late-afternoon light, blurred background, eye-level framing, no text, no logos, no brand marks, not a real person.", "foto": {"arquivo": "img/marcos-elenco-2.jpg", "alt": "Retrato gerado por inteligência artificial (IA) para Diego; não é uma pessoa real"}}], "derruba": ["Se, nas entrevistas, a maioria dos motoristas que trocaram de carro decidiu pelo preço cheio e pela marca, sem olhar a parcela nem o custo por quilômetro.", "Se a maioria dos motoristas de aplicativo em tempo integral em São Paulo dirige carro alugado e não pensa em comprar nos próximos dois anos.", "Se a opinião dos colegas no grupo pesa pouco, e a decisão vem do vendedor, do anúncio ou do próprio aplicativo de corrida."], "perguntas_campo": ["Me conte a última vez que você trocou de carro. O que estava acontecendo na sua vida?", "Como você faz a conta do que sobra no fim da semana? Pode me mostrar?", "Em quem você confia para falar de carro? Por quê?", "O que precisaria ser verdade para você comprar um carro elétrico?", "Se o carro parar por uma semana, o que acontece na sua casa?", "Se o crédito do governo financiar um flex novo com juro menor, você ainda olha o elétrico?", "Me mostra a conta que você fez do elétrico. O que entrou nela? (Pergunte por pneu, revisão, seguro e IPVA só se ele não citar.)", "Se a retífica der mais quatro anos ao carro, por que trocar agora?", "Quantas horas o carro fica parado em casa à noite?", "Quem paga a luz da garagem?", "Daria para instalar um ponto de recarga na garagem?"], "hipoteses": "Os números e os fatos de época vêm do IBGE, da ABVE, da ANP, do Planalto, da Prefeitura de São Paulo, da Câmara e da Receita. Foram conferidos na origem em 5 de outubro de 2026. A Agência Senado entra como fonte secundária, conferida no mesmo dia. A vida do Marcos, o arquétipo, a personalidade, as falas e as notas de 1 a 5 são hipóteses. A jornada, os quilômetros e a conta da semana dele também. Tudo isso fica para testar com motoristas reais.", "pronome": "ele"}, "luciene": {"id": "luciene", "nome": "Luciene Veras", "idade": 44, "nascimento": 1982, "cidade": "Teresina", "uf": "PI", "ocupacao": "Dona de um pet shop", "resumo": "Passou 22 anos no comércio com carteira assinada, 19 deles com o plano de saúde da empresa, com uma parte descontada em folha. Em 2023 saiu por acordo e abriu um pet shop no bairro. Ficou no plano da antiga empresa pagando o valor inteiro e cancelou no ano seguinte. Hoje paga em dia o plano da cachorra e o carnê funerário da família, e passa a própria consulta no cartão de crédito.", "frase": "Quando eu tinha carteira assinada, o plano vinha junto. Hoje cada boleto disputa com o aluguel da loja.", "tracos": ["Organizada", "Desconfia de contrato", "Cuida de todo mundo antes de si", "Sabe o preço de tudo", "Decide devagar e por escrito"], "foto": {"prompt_en": "head and shoulders portrait photograph of a 44-year-old Brazilian woman, mixed-race with warm brown skin, dark curly hair tied back, small gold earrings, coral blouse, inside her small pet shop, warm tired smile, natural light, blurred background, 50mm, realistic skin, candid", "alt": "Retrato gerado por inteligência artificial (IA) para a persona: mulher de pele morena, cabelo escuro curto e cacheado, sorriso largo, brincos grandes de contas cor de coral, colar fino dourado e blusa cor de terracota com decote em V. Ao fundo, desfocadas, as prateleiras de uma loja.", "geracao": {"modelo": "stabilityai/stable-diffusion-xl-base-1.0", "seed": 4410, "variacao": 1, "negativo": "cartoon, illustration, painting, drawing, 3d render, cgi, anime, doll, plast  "Hipótese. Prefere o que já testou. Mudou de vida aos 41 por necessidade e com plano B: o banho e tosa já rodava nas folgas e aos domingos desde 2019.", "faixa": "baixa"}, {"traco": "Escrupulosidade", "valor": 5, "nota": "Hipótese. Caderno de caixa, conta paga no dia, cada recibo guardado num envelope. Hábito de 13 anos de crediário.", "faixa": "alta"}, {"traco": "Extroversão", "valor": 3, "nota": "Hipótese. Conversa o dia inteiro no balcão e no WhatsApp da loja. À noite, quer silêncio.", "faixa": "média"}, {"traco": "Socialização", "valor": 4, "nota": "Hipótese. Cordial e prestativa com cliente e vizinha. Dura quando negocia prazo com fornecedor.", "faixa": "alta"}, {"traco": "Neuroticismo", "valor": 3, "nota": "Hipótese. Aguenta a pressão do dia. Perde o sono com conta que muda de valor e com sintoma que não passa.", "faixa": "média"}], "fase_de_vida": {"nome": "Generatividade versus estagnação", "em_jogo": "Cuidar de quem vem depois e deixar algo de pé: a filha formada, a mãe amparada, a loja com nome no bairro. O risco é cuidar de tudo e parar de cuidar de si.", "nota": "Leitura de fase, hipótese. Erikson põe essa questão na vida adulta; as idades das fases são aproximadas. Aos 48, em 2030, ela segue na mesma fase, com a mãe mais velha e a filha saindo de casa."}, "formacao": [{"de": 1989, "ate": 1996, "titulo": "Ensino fundamental", "onde": "Escola pública do bairro, em Teresina", "nota": "Ia a pé com a irmã mais nova. Boa em matemática: ajudava a mãe a somar as encomendas de costura.", "hipotese": true}, {"de": 1997, "ate": 1999, "titulo": "Ensino médio", "onde": "Escola pública, turno da noite no último ano", "nota": "No 3º ano passou a estudar à noite para ajudar nas costuras durante o dia.", "hipotese": true}, {"de": 2005, "ate": 2005, "titulo": "Treinamento de vendas e crediário", "onde": "Na rede de lojas onde trabalhava", "nota": "Aprendeu a ler cadastro, juros e parcela. Vem daí o olho treinado para contrato.", "hipotese": true}, {"de": 2012, "ate": 20 domingos", "nota": "Começou com clientes da rua. Recebia em dinheiro e, a partir do fim de 2020, por Pix.", "hipotese": true}, {"de": 2023, "ate": "hoje", "titulo": "Dona do pet shop", "onde": "Ponto alugado no bairro, sem CNPJ", "nota": "Montou a loja com o dinheiro da rescisão. Trabalha sozinha; a filha ajuda no sábado.", "hipotese": true}], "dia": [{"hora": "05h30", "o_que": "Acorda antes do despertador. Passa o café e deixa o remédio da pressão da mãe ao lado da xícara.", "canal": "Em casa"}, {"hora": "06h15", "o_que": "Leva a Pipoca para dar a volta no quarteirão antes de o sol esquentar.", "canal": "Rua do bairro"}, {"hora": "07h00", "o_que": "Responde os pedidos de ração que chegaram de madrugada e confirma os horários de banho do dia.", "canal": "WhatsApp da loja"}, {"hora": "08h00", "o_que": "Abre a loja. Paga o fornecedor de ração por Pix e anota no caderno de caixa.", "canal": "Pix e caderno"}, {"hora": "10h30", "o_que": "Dá banho em dois cachorros seguidos. Na segunda tosa, o ombro direito reclama.", "canal": "Na loja"}, {"hora": "12h30", "o_que": "Almoça em casa com a mãe em vinte minutos. Na porta da loja, a placa de volto já.", "canal": "Em casa"}, {"hora": "15h00", "o_que": "Sai de moto para entregar ração. Na volta, cobra uma cliente que comprou fiado.", "canal": "Moto e Pix"}, {"hora": "18h30", "o_que": "Fecha a loja, conta o caixa e separa o dinheiro do aluguel num envelope.", "canal": "Caderno e envelope"}, {"hora": "20h00", "o_que": "Janta com a mãe e a filha. A filha conta da escola; a mãe pergunta da irmã.", "canal": "Em casa, TV ligada"}, {"hora": "21h30", "o_que": "Na cama, cota plano de saúde no celular, vê o preço e fecha a tela. Abre um vídeo de receita.", "canal": "Busca no celular e Instagram"}], "linha_do_tempo": [{"ano": 1982, "idade": 0, "tipo": "vida", "titulo": "Nasce em Teresina", "texto": "Primeira filha de um motorista de ônibus e de uma costureira. A família se trata no posto de saúde do bairro.", "free": false}, {"ano": 1988, "idade": 6, "tipo": "fato", "titulo": "A saúde vira direito de todos", "texto": "A Constituição de 1988 diz que a saúde é direito de todos e dever do Estado (art. 196).", "fonte": {"nome": "Presidência da República (Planalto) · Constituição de 1988, art. 196", "url": "https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}, "marca": "Cresce com o posto como o lugar natural da saúde da família. Plano de saúde parecia coisa de quem tinha emprego bom.", "marca_hipotese": true, "free": false}, {"ano": 1990, "idade": 8, "tipo": "fato", "titulo": "Nasce o Sistema Único de Saúde", "texto": "A Lei 8.080 organiza o Sistema Único de Saúde (SUS), a rede pública de saúde do país.", "fonte": {"nome": "Presidência da República (Planalto) · Lei nº 8.080, de 19 de setembro de 1990", "url": "https://www.planalto.gov.br/ccivil_03/leis/l8080.htm"}, "marca": "O posto da infância dela vira parte do SUS. É a rede que ela conhece por dentro: a vacina da filha, o remédio da mãe, o pronto atendimento. É também o lugar da espera, que ela teme desde a morte do pai.", "marca_hipotese": true, "free": false}, {"ano": 1994, "idade": 12, "tipo": "fato", "titulo": "O real chega", "texto": "Em 1º de julho de 1994, o real passa a ser a moeda do país. Pela nossa contagem, foi a quinta moeda desde 1986.", "fonte": {"nome": "Presidência da República (Planalto) · Lei nº 9.069, de 29 de junho de 1995 (Plano Real)", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9069.htm"}, "marca": "Dos 4 aos 12 anos, viu a moeda trocar cinco vezes. Daí pode vir o apego à conta fixa e o pavor de valor que muda. Lente de Malmendier e Nagel, com dados dos Estados Unidos.", "marca_hipotese": true, "free": false, "fontes_extra": [{"nome": "Presidência da República (Planalto) · Decreto-Lei nº 2.283, de 27 de fevereiro de 1986 (cruzado)", "url": "https://www.planalto.gov.br/ccivil_03/decreto-lei/del2283.htm"}, {"nome": "Presidência da República (Planalto) · Lei nº 7.730, de 31 de janeiro de 1989 (cruzado novo)", "url": "https://www.planalto.gov.br/ccivil_03/leis/l7730.htm"}, {"nome": "Presidência da República (Planalto) · Lei nº 8.024, de 12 de abril de 1990 (cruzeiro)", "url": "https://www.planalto.gov.br/ccivil_03/leis/l8024.htm"}, {"nome": "Presidência da República (Planalto) · Lei nº 8.697, de 27 de agosto de 1993 (cruzeiro real)", "url": "https://www.planalto.gov.br/ccivil_03/leis/l8697.htm"}]}, {"ano": 1998, "idade": 16, "tipo": "fato", "titulo": "Plano de saúde ganha lei", "texto": "A Lei 9.656 regula os planos de saúde e permite vender o plano por partes. Uma delas é a ambulatorial: consultas sem limite de número e exames pedidos pelo médico.", "fonte": {"nome": "Presidência da República (Planalto) · Lei nº 9.656, de 3 de junho de 1998, art. 12", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9656.htm"}, "marca": "Aos 16, nem sabia disso. É a regra que, quase 30 anos depois, permite o plano sem internação que ela avalia hoje.", "marca_hipotese": true, "free": false}, {"ano": 2004, "idade": 22, "tipo": "vida", "titulo": "A primeira carteirinha", "texto": "Entra como vendedora numa rede de lojas do Centro. Com o crachá vem o plano de saúde da empresa, com uma parte descontada em folha. Pela primeira vez, consulta sem fila.", "free": false}, {"ano": 2008, "idade": 26, "tipo": "fato", "titulo": "Nasce o microempreendedor individual", "texto": "A Lei Complementar 128 cria o microempreendedor individual (MEI), que paga os impostos em valor fixo por mês, a partir de julho de 2009.", "fonte": {"nome": "Presidência da República (Planalto) · Lei Complementar nº 128, de 19 de dezembro de 2008", "url": "https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp128.htm"}, "marca": "Aos 26, com carteira assinada, nem prestou atenção. Hoje o MEI é a porta que ela adia, com medo da burocracia e do imposto.", "marca_hipotese": true, "free": false}, {"ano": 2010, "idade": 28, "tipo": "vida", "titulo": "Nasce a Yasmin", "texto": "Tem a filha aos 28, com o parto pelo plano da empresa. O pai da menina a inclui como dependente no plano do emprego dele.", "free": false}, {"ano": 2015, "idade": 33, "tipo": "vida", "titulo": "O pai morre esperando vaga", "texto": "Aos 61, o pai passa dias no pronto atendimento à espera de vaga em hospital público e morre. O plano da empresa dela não aceitava pai como dependente.", "free": true}, {"ano": 2017, "idade": 35, "tipo": "fato", "titulo": "Demissão por acordo", "texto": "A reforma trabalhista cria o fim do contrato por acordo entre empregado e empregador, com metade do aviso prévio e da multa do FGTS (Fundo de Garantia do Tempo de Serviço).", "fonte": {"nome": "Presidência da República (Planalto) · Lei nº 13.467, de 13 de julho de 2017 (reforma trabalhista)", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2017/lei/l13467.htm"}, "marca": "No ano em que vira encarregada do crediário, a lei cria a porta pela qual ela vai sair seis anos depois.", "marca_hipotese": true, "free": false}, {"ano": 2018, "idade": 36, "tipo": "fato", "titulo": "ANS atualiza a cartilha do empresário individual", "texto": "Cartilha da ANS (Agência Nacional de Saúde Suplementar), versão atualizada em maio de 2018: o empresário individual com pelo menos 6 meses de atividade, como o MEI, pode contratar plano coletivo empresarial. A data é a da versão; quando a regra nasceu não foi lido.", "fonte": {"nome": "ANS · Cartilha \"Plano de saúde coletivo empresarial por empresário individual\" (versão de maio de 2018)", "url": "http://www.ans.gov.br/images/stories/noticias/pdf/Cartilha_atualizada_maio.pdf"}, "marca": "Ela só ouve falar disso em 2024, de uma corretora, e esbarra no CNPJ que não tem. Para quem vende o plano do exemplo, é o concorrente direto.", "marca_hipotese": true, "free": false}, {"ano": 2019, "idade": 37, "tipo": "vida", "titulo": "Banho e tosa nas folgas", "texto": "Separada desde o ano anterior, faz um curso de três meses e começa a atender na garagem de casa, na folga da semana e aos domingos. Compra uma moto usada para buscar e levar os cachorros.", "free": false}, {"ano": 2020, "idade": 38, "tipo": "fato", "titulo": "O Pix entra no ar", "texto": "O Pix, pagamento instantâneo criado pelo Banco Central, entra em operação plena em 16 de novembro de 2020.", "fonte": {"nome": "Banco Central do Brasil · Resolução BCB nº 1, de 12 de agosto de 2020", "url": "https://www.bcb.gov.br/api/conteudo/app/normativos/exibenormativo?p1=Resolu%C3%A7%C3%A3o%20BCB&p2=1"}, "marca": "Em poucas semanas, as clientes do banho passam a pagar por Pix. Hoje ela paga e recebe quase tudo assim.", "marca_hipotese": true, "free": false}, {"ano": 2022, "idade": 40, "tipo": "fato", "titulo": "Consulta a distância vira lei", "texto": "A Lei 14.510 autoriza e organiza a telessaúde, o atendimento de saúde a distância, em todo o país.", "fonte": {"nome": "Presidência da República (Planalto) · Lei nº 14.510, de 27 de dezembro de 2022", "url": "https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2022/lei/l14510.htm"}, "marca": "Pelo plano da empresa, já tinha feito consulta por vídeo no intervalo do almoço e gostado: não perdeu meio dia de trabalho.", "marca_hipotese": true, "free": false}, {"ano": 2023, "idade": 41, "tipo": "vida", "titulo": "Sai por acordo e abre a loja", "texto": "A loja do Centro enxuga a equipe e ela sai por acordo. Com a rescisão, aluga um ponto no bairro e abre o pet shop.", "free": true}, {"ano": 2024, "idade": 42, "tipo": "vida", "titulo": "Cancela o plano", "texto": "Depois do acordo, fica no plano da antiga empresa pagando o valor inteiro sozinha. No quinto mês, o boleto chega com reajuste, sem explicação. No sétimo, faz a conta com o aluguel da loja e cancela. A conferir: a Lei 9.656 (art. 30) garante ficar no plano a quem contribuía e saiu sem justa causa; se a saída por acordo dá o mesmo direito não foi conferido.", "free": true, "fonte": {"nome": "Presidência da República (Planalto) · Lei nº 9.656, de 3 de junho de 1998, art. 30", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9656.htm"}}, {"ano": 2026, "idade": 44, "tipo": "fato", "titulo": "Salário mínimo de R$ 1.621", "texto": "Desde 1º de janeiro de 2026, o salário mínimo é de R$ 1.621,00.", "fonte": {"nome": "Presidência da República (Planalto) · Decreto nº 12.797, de 23 de dezembro de 2025", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/decreto/d12797.htm"}, "marca": "Pela nossa conta, um plano de R$ 180 é 11,1% desse mínimo. A mãe se aposentou com um mínimo, e é por ele que Luciene mede o que cabe na casa.", "marca_hipotese": true, "free": false}, {"ano": 2026, "idade": 44, "tipo": "fato", "titulo": "Teto do reajuste em 5,11%", "texto": "A ANS (Agência Nacional de Saúde Suplementar) limita a 5,11% o reajuste dos planos individuais ou familiares que fazem aniversário de contrato entre 1º de maio de 2026 e 30 de abril de 2027. O teto muda todo ano. Quem assina em outubro de 2026 tem o primeiro reajuste em outubro de 2027, pelo teto do ano que vem, que ainda não saiu. O plano coletivo contratado por empresa, como o do microempreendedor individual (MEI), fica fora desse teto, segundo nota do Ministério da Fazenda. Pela cartilha da ANS, de 2018, nos contratos com menos de 30 vidas o reajuste é um só para todos os da operadora (pode ter mudado).", "fonte": {"nome": "ANS · Nota Técnica nº 2/2026/COREF/GEFAP/GGREP/DIRAD-DIPRO/DIPRO", "url": "https://www.gov.br/ans/pt-br/arquivos/assuntos/consumidor/reajustes-de-mensalidade/reajuste-anual-de-planos-individuais-familiares/metodologia-de-calculo/2023/IRPI2026_NT_Reajuste.pdf"}, "marca": "Ela não sabe disso. Saber que o reajuste do plano individual tem teto pode pesar mais que o preço de entrada.", "marca_hipotese": true, "free": true, "fontes_extra": [{"nome": "Ministério da Fazenda · Nota Técnica SEI (Sistema Eletrônico de Informações) nº 3878/2026, itens 6 e 7", "url": "https://www.gov.br/ans/pt-br/assuntos/consumidor/reajuste-variacao-de-mensalidade/reajuste-anual-de-planos-individuais-familiares-1/IRPI2026_NT_MinFazenda.pdf"}, {"nome": "ANS · Cartilha \"Plano de saúde coletivo empresarial por empresário individual\" (versão de maio de 2018)", "url": "http://www.ans.gov.br/images/stories/noticias/pdf/Cartilha_atualizada_maio.pdf"}]}, {"ano": 2027, "idade": 45, "tipo": "horizonte", "titulo": "Formaliza a loja", "texto": "Hipótese: formaliza a loja como microempreendedora individual (MEI) para vender a uma clínica veterinária que pede nota. Seis meses depois, pela regra da cartilha da ANS de 2018 (pode ter mudado), já pode cotar plano de empresa, que fica fora do teto de reajuste da ANS. A conferir: se a receita da loja cabe no teto anual do MEI, que não foi conferido aqui.", "free": true}, {"ano": 2030, "idade": 48, "tipo": "horizonte", "titulo": "A decisão vira da casa", "texto": "Hipótese: a mãe, aos 73, precisa de mais exames. A filha, aos 20, começa a trabalhar e quer plano próprio. Luciene deixa de decidir só por ela e passa a decidir pelas três.", "free": false}], "trabalhos": {"frase": "Quando um sintoma me preocupa e a loja não pode fechar, quero consultar e fazer exame perto, por um valor que não muda de surpresa, para me cuidar sem tirar da casa nem da loja.", "funcional": "Consulta e exame de rotina perto da loja, em horário que não feche as portas, com o que cobre escrito antes de assinar.", "emocional": "Dormir sem fazer de cabeça a conta de quanto custaria ficar doente. Voltar a se sentir coberta, como no tempo do crachá.", "social": "Mostrar à filha e à irmã que também se cuida. Poder dizer, na roda das comerciantes da rua, que tem plano de novo.", "usa_hoje": "Hipótese. Hoje, no lugar do plano, ela paga consulta e exame avulsos no cartão de crédito, em três vezes, e usa o posto do SUS (Sistema Único de Saúde) quando dá para esperar."}, "expectativas": [{"esfera": "Para ela", "texto": "Fazer os exames do ano sem esperar meses e sem passar no cartão de crédito."}, {"esfera": "No trabalho", "texto": "Não fechar a loja um dia inteiro por causa de uma consulta."}, {"esfera": "Com os outros", "texto": "Poder incluir a mãe, que mora com ela, sabendo antes quanto custa."}], "dores": {"superficie": [{"texto": "Pagou sozinha o plano da antiga empresa por sete meses e parou: caro para o que usava."}, {"texto": "Nunca sabe direito o que o plano cobre e o que fica de fora."}, {"texto": "Reajuste que chega no boleto sem explicação."}, {"texto": "Consulta e exame no cartão de crédito. Em mês fraco, paga só o mínimo da fatura. Hipótese: pelos 13 anos de crediário, sabe que é o juro mais caro, paga assim mesmo e tem vergonha disso."}], "fundo": [{"texto": "Se ela adoece, a loja para e a renda some."}, {"texto": "Medo de esperar vaga, como o pai esperou."}, {"texto": "Sente que perdeu a proteção que tinha no emprego e que cuidar de si virou luxo."}], "raiz": "Hipótese. Desde que saiu do emprego, cuidar de si virou gasto que disputa com a loja e com a família. Por isso todo valor que muda sem aviso dói duas vezes: pesa no caixa e lembra a espera que o pai viveu."}, "ganhos": ["Saber o valor dos próximos 12 meses antes de assinar.", "Consulta depois das 19h, com a loja já fechada, ou no sábado à tarde, com a filha no balcão.", "Uma lista curta do que cobre e do que não cobre, em mensagem.", "Incluir a mãe com preço claro.", "Resultado de exame no celular, sem voltar ao laboratório.", "Uma carteirinha na bolsa de novo."], "empatia": {"pensa_sente": ["Se eu cair, quem abre a loja?", "Plano é para quem tem salário fixo.", "Culpa de gastar com ela antes da mãe.", "Alívio quando a dor passa sozinha."], "ve": ["A mãe na fila do posto para pegar o remédio da pressão.", "A filha usando o plano do pai sem pensar duas vezes.", "Clientes da loja com o plano do cachorro em dia.", "Anúncio de plano com preço pequeno e letra miúda."], "ouve": ["A irmã: sem internação, serve para quê?", "A vizinha: no meu veio reajuste alto e eu saí.", "A corretora: abre um MEI que fica mais barato.", "Áudio no grupo da rua sobre pronto atendimento lotado."], "fala_faz": ["Pede a proposta por escrito no WhatsApp.", "Diz que vai ver com a irmã e some por dias.", "Passa a consulta no cartão em três vezes.", "Cota exame em três laboratórios antes de fazer."], "dores": ["Conta que muda de valor.", "Fechar a loja para ir ao médico.", "Letra miúda de contrato.", "Ligação de vendedor no horário de movimento."], "ganhos": ["Preço que cabe até em mês fraco.", "Atendimento perto e fora do horário da loja.", "Regra de reajuste por escrito.", "Incluir a mãe."]}, "jornada": [{"etapa": "Percebe", "faz": "Sente tontura no balcão num sábado cheio. A irmã mede a pressão dela e manda procurar médico.", "pensa": "Não posso fechar a loja agora.", "canal": "Na loja, com a irmã; depois, por WhatsApp", "emocao": -2, "oportunidade": "Estar perto no susto sem vender no susto: indicar o atendimento de hoje pelo caminho que ela já tem e mandar a proposta depois, com a carência em dias por escrito."}, {"etapa": "Procura", "faz": "À noite, busca plano de saúde em Teresina no celular e pergunta no grupo das comerciantes da rua.", "pensa": "Quanto custa isso hoje?", "canal": "Busca no celular; grupo de WhatsApp", "emocao": -1, "oportunidade": "Preço visível e lista do que cobre na primeira tela, sem cadastro."}, {"etapa": "Compara", "faz": "Pede três propostas por escrito. Passa para o caderno: preço, carência, o que cobre, reajuste.", "pensa": "Onde está a pegadinha?", "canal": "WhatsApp da corretora; caderno", "emocao": -1, "oportunidade": "Proposta em mensagem, numa tela, com o reajuste explicado e simulado."}, {"etapa": "Decide", "faz": "Mostra a proposta para a irmã. Espera um mês bom de vendas para assinar.", "pensa": "Se a Luana aprovar, eu fecho.", "canal": "Irmã; corretora no Centro", "emocao": 0, "oportunidade": "Versão curta para a irmã ler e data de início que caia no mês bom."}, {"etapa": "Usa", "faz": "Marca a primeira consulta para depois das 19h e recebe o resultado do exame no celular.", "pensa": "Não precisei fechar a loja.", "canal": "WhatsApp ou aplicativo do plano", "emocao": 2, "oportunidade": "Primeira consulta rápida e perto: é ela que prova a compra."}, {"etapa": "Indica", "faz": "No primeiro reajuste, confere se bateu com o que estava escrito. Se bateu, indica para duas comerciantes da rua.", "pensa": "Aqui não teve surpresa.", "canal": "Boca a boca; grupo da rua", "emocao": 1, "oportunidade": "Aviso do reajuste com antecedência e indicação com vantagem para as duas."}], "canais": [{"canal": "WhatsApp", "uso": 5, "confianca": 3, "nota": "Fala com cliente, fornecedor e família o dia todo. Confia na mensagem de quem conhece; desconfia de número estranho.", "fonte": null}, {"canal": "Pix", "uso": 5, "confianca": 4, "nota": "Paga e recebe quase tudo por Pix. Entre pessoas de 35 a 44 anos, 91,1% usavam Pix para pagar contas ou compras em 2024.", "fonte": {"nome": "Banco Central do Brasil · O brasileiro e sua relação com o dinheiro, 2024", "url": "https://www.bcb.gov.br/content/cedulasemoedas/pesquisabrasileirodinheiro/Apresentacao_brasileiro_relacao_dinheiro_2024.pdf"}}, {"canal": "Indicação da rua", "uso": 4, "confianca": 5, "nota": "Comerciantes vizinhas e clientes antigas. É a voz que mais pesa.", "fonte": null}, {"canal": "Irmã", "uso": 3, "confianca": 5, "nota": "Técnica de enfermagem. Lê a proposta antes de ela assinar.", "fonte": null}, {"canal": "Instagram", "uso": 4, "confianca": 2, "nota": "Usa para mostrar a loja e ver receita à noite. Anúncio de plano ali parece golpe.", "fonte": null}, {"canal": "Busca no celular", "uso": 3, "confianca": 2, "nota": "Cota à noite e fecha a tela quando vê o preço.", "fonte": null}, {"canal": "Corretora no Centro", "uso": 2, "confianca": 3, "nota": "Vai quando já quase decidiu. Quer olhar no olho de quem vende.", "fonte": null}], "consumo": [{"rotulo": "Como paga", "valor": "Pix no dia a dia. Cartão de crédito parcelado para consulta, exame e equipamento da loja. Boleto para conta fixa."}, {"rotulo": "Onde compra", "valor": "Ração da loja na distribuidora, paga por Pix na entrega. Prazo para pagar, só se a distribuidora aceitar o CPF (hipótese a conferir). Compra da casa no atacarejo do bairro, uma vez por mês."}, {"rotulo": "Quanto pesquisa", "valor": "Muito. Três orçamentos por escrito para qualquer gasto acima de R$ 100. Leva dias."}, {"rotulo": "Sensibilidade a preço", "valor": "Alta para conta que muda. Baixa para conta fixa e pequena: o plano da Pipoca e o carnê funerário estão em dia há anos."}, {"rotulo": "Contas fixas", "valor": "Aluguel da loja, luz, internet, celular, plano da cachorra e carnê funerário. Plano de saúde dela: nenhum."}, {"rotulo": "Quando compra", "valor": "Depois de um susto de saúde na família ou num mês bom de vendas, como dezembro."}], "decisao": {"criterios": [{"criterio": "Mensalidade que cabe até em mês fraco", "peso": 5}, {"criterio": "Reajuste com regra por escrito", "peso": 5}, {"criterio": "Saber o que cobre e o que não cobre", "peso": 4}, {"criterio": "Consulta perto e fora do horário da loja", "peso": 4}, {"criterio": "Indicação de quem já usa", "peso": 4}, {"criterio": "Poder incluir a mãe", "peso": 3}, {"criterio": "Carência curta", "peso": 3}], "gatilhos": ["Um susto de saúde dela ou da mãe", "Um mês bom de vendas", "Uma vizinha que usou e gostou", "Exame pedido no posto com data distante"], "objecoes": [{"objecao": "E se o reajuste vier alto?", "resposta": "Mostre a regra antes do preço. Se o contrato for individual ou familiar, o reajuste anual tem teto da ANS (Agência Nacional de Saúde Suplementar), definido todo ano e aplicado no aniversário do contrato. O teto deste ciclo é 5,11%. Se ela assinar em outubro de 2026, o primeiro reajuste vem em outubro de 2027, pelo teto que a ANS publicar no ano que vem. De 2012 a 2026, o teto foi de -8,19% (2021) a 15,50% (2022). Se for coletivo, fica fora desse teto; no plano de empresa com menos de 30 vidas, a cartilha da ANS, de 2018, fala em reajuste único para todos os contratos pequenos da operadora (pode ter mudado). Ela precisa ouvir isso com a mesma clareza. Mande também a tabela de faixas de idade, que a lei exige no contrato (Lei 9.656, art. 16, IV, e art. 15).", "fontes": [{"afirmacao": "O teto de 5,11% vale para os planos individuais ou familiares na data de aniversário de cada contrato, entre 1º de maio de 2026 e 30 de abril de 2027.", "fonte": "ANS · Nota Técnica nº 2/2026/COREF/GEFAP/GGREP/DIRAD-DIPRO/DIPRO", "url": "https://www.gov.br/ans/pt-br/arquivos/assuntos/consumidor/reajustes-de-mensalidade/reajuste-anual-de-planos-individuais-familiares/metodologia-de-calculo/2023/IRPI2026_NT_Reajuste.pdf", "trecho": "O índice máximo de reajuste anual por variação de custos a incidir sobre as mensalidades dos planos privados de assistência à saúde médico-hospitalares de contratação individual ou familiar, na vigência da Lei nº 9.656/98 ou a ela adaptados, no período de 1º de maio de 2026 a 30 de abril de 2027 é de 5,11% (cinco inteiros e onze centésimos por cento). [...] Estão sujeitos à sua aplicação todos os beneﬁciários de planos privados de assistência à saúde médico-hospitalares, com ou sem cobertura odontológica, de contratação individual ou familiar, contratados na vigência da Lei nº 9.656/98 ou a ela adaptados, na data de aniversário de seus contratos.", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id ans-nt-2026-aniversario); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/ans-nt-reajuste-2026.pdf.txt (HTTP 200, 10:16)", "id_lista": "normas/ans-nt-2026-aniversario"}, {"afirmacao": "Teto do reajuste individual de 2012 a 2026: de -8,19% (2021) a 15,50% (2022); 5,11% em 2026", "fonte": "Ministério da Fazenda · Nota Técnica SEI (Sistema Eletrônico de Informações) nº 3878/2026, tabela 4, com dados da ANS", "url": "https://www.gov.br/ans/pt-br/assuntos/consumidor/reajuste-variacao-de-mensalidade/reajuste-anual-de-planos-individuais-familiares-1/IRPI2026_NT_MinFazenda.pdf", "trecho": "Tabela 4 - Comparação reajuste dos planos de saúde e IPCA 2012 2013 2014 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026 [...] REAJUSTE ANS 7,93% 9,04% 9,65% 13,55% 13,57% 13,55% 10% 7,35% 8,14% -8,19% 15,50% 9,63% 6,91% 6,06% 5,11% [...] Fonte: Dados ANS e IBGE. [...] 6. Por fim, o reajuste dos planos coletivos contratados por pessoas jurídicas é livre.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-luciene.json (numeros, id ans-reajuste-maximo-individual-2012-2026)", "id_lista": "numeros/ans-reajuste-maximo-individual-2012-2026"}, {"afirmacao": "O reajuste do plano coletivo contratado por empresa é livre; na prática, o teto da ANS vale para os planos individuais ou familiares contratados depois de 2 de janeiro de 1999, menos os só odontológicos.", "fonte": "Ministério da Fazenda · Nota Técnica SEI (Sistema Eletrônico de Informações) nº 3878/2026, itens 6 e 7", "url": "https://www.gov.br/ans/pt-br/assuntos/consumidor/reajuste-variacao-de-mensalidade/reajuste-anual-de-planos-individuais-familiares-1/IRPI2026_NT_MinFazenda.pdf", "trecho": "6. Por fim, o reajuste dos planos coletivos contratados por pessoas jurídicas é livre. [...] 7. Portanto, na prática, os planos efetivamente sujeitos ao reajuste máximo estabelecido pela ANS são os planos individuais/familiares novos (pós 2 de janeiro de 1999), exceto os planos exclusivamente odontológicos", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id minfaz-nt-3878-itens-6-7); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/ans-nt-minfaz-2026.pdf.txt (HTTP 200, 10:16)", "id_lista": "normas/minfaz-nt-3878-itens-6-7"}, {"afirmacao": "Plano de empresa do empresário individual: 6 meses de registro para contratar, reajuste único para contratos com menos de 30 vidas e rescisão pela operadora uma vez por ano, no aniversário, com 60 dias de aviso.", "fonte": "ANS · Cartilha \"Plano de saúde coletivo empresarial por empresário individual\" (versão de maio de 2018)", "url": "http://www.ans.gov.br/images/stories/noticias/pdf/Cartilha_atualizada_maio.pdf", "trecho": "deve apresentar à operadora documentos que comprovem, pelo tempo mínimo de 6 meses: [...] Por vontade da operadora, apenas uma vez ao ano, no aniversário do contrato, desde que você seja comunicado com 60 dias de antecedência, informando o motivo da rescisão. [...] Contratos com menos de 30 vidas: reajuste único aplicável a todos os contratos com menos de 30 vidas da sua operadora.", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id ans-cartilha-empresario-individual-regras); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/ans-cartilha-empresario-individual.pdf.txt (HTTP 200, 10:17)", "id_lista": "normas/ans-cartilha-empresario-individual-regras"}, {"afirmacao": "O contrato precisa trazer as faixas de idade e o percentual de reajuste de cada uma.", "fonte": "Presidência da República (Planalto) · Lei nº 9.656, de 3 de junho de 1998, art. 16, IV", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9656.htm", "trecho": "Art. 16. Dos contratos, regulamentos ou condições gerais dos produtos de que tratam o inciso I e o § 1o do art. 1o desta Lei devem constar dispositivos que indiquem com clareza: [...] IV - as faixas etárias e os percentuais a que alude o caput do art. 15;", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id lei9656-art16-iv); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/planalto-l9656.texto.txt (HTTP 200, 10:10)", "id_lista": "normas/lei9656-art16-iv"}, {"afirmacao": "A mensalidade só muda por idade se as faixas e os percentuais estiverem no contrato inicial.", "fonte": "Presidência da República (Planalto) · Lei nº 9.656, de 3 de junho de 1998, art. 15", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9656.htm", "trecho": "Art. 15. A variação das contraprestações pecuniárias estabelecidas nos contratos de produtos de que tratam o inciso I e o § 1o do art. 1o desta Lei, em razão da idade do consumidor, somente poderá ocorrer caso estejam previstas no contrato inicial as faixas etárias e os percentuais de reajustes incidentes em cada uma delas, conforme normas expedidas pela ANS, ressalvado o disposto no art. 35-E. (Redação dada pela Medida Provisória nº 2.177-44, de 2001)", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id lei9656-art15); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/planalto-l9656.texto.txt (HTTP 200, 10:10)", "id_lista": "normas/lei9656-art15"}], "free": true}, {"objecao": "Plano sem internação me serve?", "resposta": "Serve para o que ela mais usa: consulta sem limite de número e exame pedido pelo médico, dentro dos limites de cobertura que a lei define (Lei 9.656, art. 12). Internação fica de fora e segue pelo SUS (Sistema Único de Saúde). Se internação é o que mais pesa para ela, este plano não resolve esse medo, e é melhor ela saber agora.", "fontes": [{"afirmacao": "Plano ambulatorial cobre consulta sem limite de número e exame pedido pelo médico", "fonte": "Presidência da República (Planalto) · Lei nº 9.656, de 3 de junho de 1998, art. 12, I", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9656.htm", "trecho": "LEI Nº 9.656, DE 3 DE JUNHO DE 1998. [...] Dispõe sobre os planos e seguros privados de assistência à saúde. [...] Art. 12. São facultadas a oferta, a contratação e a vigência dos produtos de que tratam o inciso I e o § 1o do art. 1o desta Lei, nas segmentações previstas nos incisos I a IV deste artigo, respeitadas as respectivas amplitudes de cobertura definidas no plano-referência de que trata o art. 10, segundo as seguintes exigências mínimas: (Redação dada pela Medida Provisória nº 2.177-44, de 2001) I - quando incluir atendimento ambulatorial: a) cobertura de consultas médicas, em número ilimitado, em clínicas básicas e especializadas, reconhecidas pelo Conselho Federal de Medicina; [...] b) cobertura de serviços de apoio diagnóstico, tratamentos e demais procedimentos ambulatoriais, solicitados pelo médico assistente; (Redação dada pela Medida Provisória nº 2.177-44, de 2001)", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-luciene.json (fatos_de_epoca, \"Plano de saúde ganha lei\")", "id_lista": "fatos_de_epoca/Plano de saúde ganha lei"}], "free": false}, {"objecao": "Não tenho CNPJ.", "resposta": "Ela não precisa de CNPJ (Cadastro Nacional da Pessoa Jurídica) se o plano for contratado no CPF (Cadastro de Pessoas Físicas). Isso pode jogar a favor: no plano individual, o reajuste tem teto da ANS, definido todo ano, e a operadora só cancela por fraude ou atraso de mais de 60 dias em 12 meses (Lei 9.656, art. 13). O plano de empresa do MEI (microempreendedor individual) pede 6 meses de registro e fica fora do teto da ANS. O reajuste dele é um só para todos os contratos com menos de 30 vidas da operadora, e a operadora pode desfazer o contrato uma vez por ano, no aniversário (cartilha da ANS, de 2018, que pode ter mudado, e nota do Ministério da Fazenda). Mostre as duas regras e deixe a escolha com ela.", "fontes": [{"afirmacao": "No plano contratado individualmente, a operadora só suspende ou cancela por fraude ou por mais de 60 dias de atraso nos últimos 12 meses, com aviso até o 50º dia.", "fonte": "Presidência da República (Planalto) · Lei nº 9.656, de 3 de junho de 1998, art. 13, parágrafo único, II", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9656.htm", "trecho": "Art. 13. Os contratos de produtos de que tratam o inciso I e o § 1o do art. 1o desta Lei têm renovação automática a partir do vencimento do prazo inicial de vigência, não cabendo a cobrança de taxas ou qualquer outro valor no ato da renovação. [...] Parágrafo único. Os produtos de que trata o caput, contratados individualmente, terão vigência mínima de um ano, sendo vedadas: [...] II - a suspensão ou a rescisão unilateral do contrato, salvo por fraude ou não-pagamento da mensalidade por período superior a sessenta dias, consecutivos ou não, nos últimos doze meses de vigência do contrato, desde que o consumidor seja comprovadamente notificado até o qüinquagésimo dia de inadimplência;", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id lei9656-art13-pu-ii); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/planalto-l9656.texto.txt (HTTP 200, 10:10)", "id_lista": "normas/lei9656-art13-pu-ii"}, {"afirmacao": "Plano de empresa do empresário individual: 6 meses de registro para contratar, reajuste único para contratos com menos de 30 vidas e rescisão pela operadora uma vez por ano, no aniversário, com 60 dias de aviso.", "fonte": "ANS · Cartilha \"Plano de saúde coletivo empresarial por empresário individual\" (versão de maio de 2018)", "url": "http://www.ans.gov.br/images/stories/noticias/pdf/Cartilha_atualizada_maio.pdf", "trecho": "deve apresentar à operadora documentos que comprovem, pelo tempo mínimo de 6 meses: [...] Por vontade da operadora, apenas uma vez ao ano, no aniversário do contrato, desde que você seja comunicado com 60 dias de antecedência, informando o motivo da rescisão. [...] Contratos com menos de 30 vidas: reajuste único aplicável a todos os contratos com menos de 30 vidas da sua operadora.", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id ans-cartilha-empresario-individual-regras); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/ans-cartilha-empresario-individual.pdf.txt (HTTP 200, 10:17)", "id_lista": "normas/ans-cartilha-empresario-individual-regras"}, {"afirmacao": "O plano contratado por empresário individual é coletivo empresarial. A página antiga da ANS ainda indica a cartilha para o empresário individual, e o portal avisa que não é mais atualizado.", "fonte": "ANS · página \"Quero contratar um plano de saúde, o que preciso saber?\" (portal antigo da ANS)", "url": "http://www.ans.gov.br/ans-com-voce/quero-contratar-um-plano-de-saude-o-que-preciso-saber", "trecho": "Este site migrou para https://www.gov.br/ans/pt-br e não está sendo mais atualizado. [...] Se a contratação for por meio de uma empresa ou de um empresário individual, ele será coletivo empresarial. [...] Se você é empresário individual, baixe a cartilha da ANS sobre contratação de plano de saúde coletivo empresarial.", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id ans-quero-contratar-cartilha); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/ans-quero-contratar.texto.txt (HTTP 200, 10:16)", "id_lista": "normas/ans-quero-contratar-cartilha"}, {"afirmacao": "O reajuste do plano coletivo contratado por empresa é livre; na prática, o teto da ANS vale para os planos individuais ou familiares contratados depois de 2 de janeiro de 1999, menos os só odontológicos.", "fonte": "Ministério da Fazenda · Nota Técnica SEI (Sistema Eletrônico de Informações) nº 3878/2026, itens 6 e 7", "url": "https://www.gov.br/ans/pt-br/assuntos/consumidor/reajuste-variacao-de-mensalidade/reajuste-anual-de-planos-individuais-familiares-1/IRPI2026_NT_MinFazenda.pdf", "trecho": "6. Por fim, o reajuste dos planos coletivos contratados por pessoas jurídicas é livre. [...] 7. Portanto, na prática, os planos efetivamente sujeitos ao reajuste máximo estabelecido pela ANS são os planos individuais/familiares novos (pós 2 de janeiro de 1999), exceto os planos exclusivamente odontológicos", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id minfaz-nt-3878-itens-6-7); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/ans-nt-minfaz-2026.pdf.txt (HTTP 200, 10:16)", "id_lista": "normas/minfaz-nt-3878-itens-6-7"}], "free": false}, {"objecao": "E a carência?", "resposta": "Escreva a carência de consulta e a de exame, em dias, na mesma mensagem do preço. A lei põe teto: até 180 dias nos casos comuns e até 24 horas para urgência e emergência (Lei 9.656, art. 12, V). Carência curta na urgência não diz o que o plano cobre ali: mande por escrito o que ele faz no pronto atendimento e onde para. Prometa só o número que está no contrato.", "fontes": [{"afirmacao": "Carência: até 180 dias nos casos comuns, até 300 dias para parto e até 24 horas na urgência e na emergência.", "fonte": "Presidência da República (Planalto) · Lei nº 9.656, de 3 de junho de 1998, art. 12, V", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9656.htm", "trecho": "V - quando fixar períodos de carência: a) prazo máximo de trezentos dias para partos a termo; b) prazo máximo de cento e oitenta dias para os demais casos; c) prazo máximo de vinte e quatro horas para a cobertura dos casos de urgência e emergência;", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id lei9656-art12-v); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/planalto-l9656.texto.txt (HTTP 200, 10:10)", "id_lista": "normas/lei9656-art12-v"}], "free": false}, {"objecao": "Vou ver com a minha irmã.", "resposta": "Bom sinal: a irmã é técnica de enfermagem e lê tudo antes. Mande uma versão pronta para ela, com o que cobre, o que fica de fora, a rede, a cobrança por consulta ou exame, se houver, e o que o plano faz numa urgência. Combine o dia de voltar a falar.", "free": false}, {"objecao": "E a minha mãe?", "resposta": "Ela pode entrar: a lei proíbe impedir alguém de ter plano por causa da idade (Lei 9.656, art. 14). O preço dela segue outra faixa de idade. Mande o valor por escrito, separado do valor da Luciene, para uma decisão não travar a outra. A mãe tem pressão alta: diga por escrito o que ela precisa declarar na entrada e o que o plano cobre para a pressão nos primeiros 24 meses. Depois de 24 meses de contrato, a lei proíbe excluir a cobertura de doença que já existia (Lei 9.656, art. 11).", "fontes": [{"afirmacao": "Ninguém pode ser impedido de ter plano por causa da idade ou de deficiência.", "fonte": "Presidência da República (Planalto) · Lei nº 9.656, de 3 de junho de 1998, art. 14", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9656.htm", "trecho": "Art. 14. Em razão da idade do consumidor, ou da condição de pessoa portadora de deficiência, ninguém pode ser impedido de participar de planos privados de assistência à saúde. (Redação dada pela Medida Provisória nº 2.177-44, de 2001)", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id lei9656-art14); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/planalto-l9656.texto.txt (HTTP 200, 10:10)", "id_lista": "normas/lei9656-art14"}, {"afirmacao": "A mensalidade só muda por idade se as faixas e os percentuais estiverem no contrato inicial.", "fonte": "Presidência da República (Planalto) · Lei nº 9.656, de 3 de junho de 1998, art. 15", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9656.htm", "trecho": "Art. 15. A variação das contraprestações pecuniárias estabelecidas nos contratos de produtos de que tratam o inciso I e o § 1o do art. 1o desta Lei, em razão da idade do consumidor, somente poderá ocorrer caso estejam previstas no contrato inicial as faixas etárias e os percentuais de reajustes incidentes em cada uma delas, conforme normas expedidas pela ANS, ressalvado o disposto no art. 35-E. (Redação dada pela Medida Provisória nº 2.177-44, de 2001)", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id lei9656-art15); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/planalto-l9656.texto.txt (HTTP 200, 10:10)", "id_lista": "normas/lei9656-art15"}, {"afirmacao": "Depois de 24 meses de contrato, o plano não pode excluir a cobertura de doença ou lesão que a pessoa já tinha ao contratar.", "fonte": "Presidência da República (Planalto) · Lei nº 9.656, de 3 de junho de 1998, art. 11", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9656.htm", "trecho": "Art. 11. É vedada a exclusão de cobertura às doenças e lesões preexistentes à data de contratação dos produtos de que tratam o inciso I e o § 1o do art. 1o desta Lei após vinte e quatro meses de vigência do aludido instrumento contratual, cabendo à respectiva operadora o ônus da prova e da demonstração do conhecimento prévio do consumidor ou beneficiário. (Redação dada pela Medida Provisória nº 2.177-44, de 2001)", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id lei9656-art11); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/planalto-l9656.texto.txt (HTTP 200, 10:10)", "id_lista": "normas/lei9656-art11"}], "free": false}, {"objecao": "R$ 180 pesa em mês fraco.", "resposta": "Não esconda o peso: R$ 180 é 11,1% do salário mínimo de 2026, de R$ 1.621 (conta nossa: 180 dividido por 1.621). Peça para ela somar no caderno o que passou no cartão com consulta e exame nos últimos 12 meses e pôr ao lado de 12 vezes R$ 180, que dá R$ 2.160 (conta nossa). A decisão fica com ela.", "fontes": [{"afirmacao": "Salário mínimo de R$ 1.621 em 2026; R$ 180 é 11,1% dele (conta nossa)", "fonte": "Presidência da República (Planalto) · Decreto nº 12.797, de 23 de dezembro de 2025", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/decreto/d12797.htm", "trecho": "DECRETO Nº 12.797, DE 23 DE DEZEMBRO DE 2025 [...] Art. 1º A partir de 1º de janeiro de 2026, o valor do salário mínimo será de R$ 1.621,00 (mil seiscentos e vinte e um reais).", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-luciene.json (fatos_de_epoca, \"Salário mínimo de R$ 1.621\"); conta: 180 / 1.621 = 11,1% e 12 × 180 = 2.160", "id_lista": "fatos_de_epoca/Salário mínimo de R$ 1.621"}], "free": false}], "quem_influencia": ["A irmã, Luana, de 40 anos, técnica de enfermagem", "Comerciantes vizinhas que já têm plano", "A corretora conhecida do bairro", "A mãe, que pergunta quanto custa", "Clientes antigas da loja"]}, "numeros": [{"valor": "34.021", "frase": "No Censo 2022, 42.832 mulheres de 14 anos ou mais de Teresina trabalhavam por conta própria, sem empregados: 34.021 sem CNPJ (Cadastro Nacional da Pessoa Jurídica) e 8.811 com CNPJ.", "fonte": "IBGE (Instituto Brasileiro de Geografia e Estatística), Censo Demográfico 2022, tabela 10261", "url": "https://apisidra.ibge.gov.br/values/t/10261/n6/2211001/v/4090,1004090/p/2022/c11913/96165,79377,45934,45935,79378,45936,45937/c2/6794,5/c86/95251?formato=json", "ano": 2022, "tipo": "lido", "free": true, "grafico": {"tipo": "barras", "unidade": "mulheres", "serie": [{"rotulo": "Conta própria sem CNPJ", "valor": 34021}, {"rotulo": "Conta própria com CNPJ", "valor": 8811}, {"rotulo": "Empregadora com CNPJ", "valor": 3300}, {"rotulo": "Empregadora sem CNPJ", "valor": 602}]}}, {"valor": "11,1%", "frase": "Um plano de R$ 180 por mês equivale a 11,1% do salário mínimo de 2026, que é de R$ 1.621,00. Conta nossa: 180 dividido por 1.621.", "fonte": "Presidência da República (Planalto), Decreto nº 12.797, de 23 de dezembro de 2025", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/decreto/d12797.htm", "ano": 2026, "tipo": "conta", "free": false, "grafico": {"tipo": "rosca", "unidade": "%", "serie": [{"rotulo": "Plano de R$ 180", "valor": 11.1}, {"rotulo": "Resto do salário mínimo", "valor": 88.9}]}}, {"valor": "2,7%", "frase": "Conta nossa no arquivo da ANS (Agência Nacional de Saúde Suplementar): em junho de 2026, só 872 dos 31.735 vínculos de mulheres de 35 a 44 anos de Teresina a plano médico eram de plano sem internação (só ambulatorial): 2,7%. Dos 872, 743 eram individuais ou familiares. A mesma pessoa pode ter mais de um vínculo.", "fonte": "ANS (Agência Nacional de Saúde Suplementar), dados abertos de beneficiários, Piauí, junho de 2026", "url": "https://dadosabertos.ans.gov.br/FTP/PD Eletrônico de Informações) nº 3878/2026, tabela 4 e item 6, com dados da ANS", "url": "https://www.gov.br/ans/pt-br/assuntos/consumidor/reajuste-variacao-de-mensalidade/reajuste-anual-de-planos-individuais-familiares-1/IRPI2026_NT_MinFazenda.pdf", "ano": 2026, "tipo": "lido", "free": false, "grafico": {"tipo": "barras", "unidade": "%", "serie": [{"rotulo": "2012", "valor": 7.93}, {"rotulo": "2013", "valor": 9.04}, {"rotulo": "2014", "valor": 9.65}, {"rotulo": "2015", "valor": 13.55}, {"rotulo": "2016", "valor": 13.57}, {"rotulo": "2017", "valor": 13.55}, {"rotulo": "2018", "valor": 10.0}, {"rotulo": "2019", "valor": 7.35}, {"rotulo": "2020", "valor": 8.14}, {"rotulo": "2021", "valor": -8.19}, {"rotulo": "2022", "valor": 15.5}, {"rotulo": "2023", "valor": 9.63}, {"rotulo": "2024", "valor": 6.91}, {"rotulo": "2025", "valor": 6.06}, {"rotulo": "2026", "valor": 5.11}], "nota": "Em 2021, o teto foi negativo (-8,19%). A barra desse ano fica mínima; o rótulo mostra o sinal."}, "fontes_extra": [{"nome": "ANS · Cartilha \"Plano de saúde coletivo empresarial por empresário individual\" (versão de maio de 2018)", "url": "http://www.ans.gov.br/images/stories/noticias/pdf/Cartilha_atualizada_maio.pdf"}]}, {"valor": "91,1%", "frase": "Em 2024, 91,1% das pessoas de 35 a 44 anos usavam Pix para pagar contas ou fazer compras. Entre quem tinha 60 anos ou mais, 43,9%.", "fonte": "Banco Central do Brasil, pesquisa O brasileiro e sua relação com o dinheiro", "url": "https://www.bcb.gov.br/content/cedulasemoedas/pesquisabrasileirodinheiro/Apresentacao_brasileiro_relacao_dinheiro_2024.pdf", "ano": 2024, "tipo": "lido", "free": false, "grafico": {"tipo": "barras", "unidade": "%", "serie": [{"rotulo": "16 a 24 anos", "valor": 87.0}, {"rotulo": "25 a 34 anos", "valor": 91.2}, {"rotulo": "35 a 44 anos", "valor": 91.1}, {"rotulo": "45 a 59 anos", "valor": 71.4}, {"rotulo": "60 anos ou mais", "valor": 43.9}]}}], "falar": {"proposta": "Consulta e exame por R$ 180 por mês, com tudo por escrito antes de assinar: o que cobre, o que fica de fora e como o valor muda.", "use": ["consulta e exame", "por escrito", "o que fica de fora", "regra do reajuste", "carência em dias", "carteirinha", "sua consulta", "lista da rede com endereço"], "evite": [["cobertura completa", "o plano não tem internação, e a irmã, técnica de enfermagem, acha isso na primeira leitura"], ["a partir de", "valor que muda depois da letra miúda é o medo que ela traz de 13 anos de crediário"], ["proteja sua família", "põe ela em último lugar de novo e sugere uma proteção de hospital que o plano não dá"], ["sem carência*", "asterisco é letra miúda, e ela lê contrato procurando armadilha"], ["abre um MEI que sai mais barato", "o plano de empresa do microempreendedor individual (MEI) pede 6 meses de registro, pela cartilha da ANS de 2018 (pode ter mudado), e fica fora do teto de reajuste da ANS; vender só o preço menor esconde a regra que ela mais teme"], ["garanta já", "ela decide devagar e por escrito; pressa soa como golpe"]], "canal": "WhatsApp, por indicação de quem ela conhece. A corretora no Centro fica para o fim, quando ela quer olhar no olho para assinar.", "hora": "À noite, entre 19h e 22h, depois que a loja fecha: é quando ela cota plano no celular. Ou no domingo à tarde. Ligação no horário de banho e tosa, nunca.", "mensagem": "Oi, Luciene, tudo bem? A [nome de quem indicou] me passou seu número. Sou [seu nome], da corretora do Centro. O plano é de consulta e exame, por R$ 180 por mês. Ele não cobre internação, e prefiro te dizer isso logo. Posso te mandar por aqui, por escrito, o que cobre, a carência de cada item, se há cobrança por consulta ou exame, as clínicas com endereço e a regra do reajuste? Você lê com calma e mostra para quem quiser.", "por_etapa": [{"etapa": "Percebe", "mensagem": "Tontura no balcão pede médico hoje, pelo caminho que você já tem. O plano de consulta e exame serve para os próximos meses. Quando quiser, te mando a carência de cada item por escrito."}, {"etapa": "Procura", "mensagem": "R$ 180 por mês, para consulta e exame. Sem internação. O que cobre e o que fica de fora vão numa mensagem só, sem cadastro."}, {"etapa": "Compara", "mensagem": "Para o seu caderno: preço, cobrança por consulta ou exame (coparticipação), carência de consulta e de exame em dias, o que cobre, o que fica de fora, regra do reajuste e como cancelar. Tudo numa tela."}, {"etapa": "Decide", "mensagem": "Segue uma versão curta para você mostrar à sua irmã: o que cobre, a rede com endereço e o que o plano faz numa urgência. Você escolhe o mês de começar."}, {"etapa": "Usa", "mensagem": "Sua carteirinha está ativa. Te aviso no dia em que a carência da consulta acabar e te mando as clínicas da rede mais perto da loja, com o horário de cada uma."}, {"etapa": "Indica", "mensagem": "Seu contrato faz um ano. Antes do boleto, te mando o reajuste e a conta de como ele foi feito. Se alguma vizinha da rua quiser, mando a ela a mesma lista, por escrito."}], "fontes": [{"afirmacao": "Plano de empresa do empresário individual: 6 meses de registro para contratar, reajuste único para contratos com menos de 30 vidas e rescisão pela operadora uma vez por ano, no aniversário, com 60 dias de aviso.", "fonte": "ANS · Cartilha \"Plano de saúde coletivo empresarial por empresário individual\" (versão de maio de 2018)", "url": "http://www.ans.gov.br/images/stories/noticias/pdf/Cartilha_atualizada_maio.pdf", "trecho": "deve apresentar à operadora documentos que comprovem, pelo tempo mínimo de 6 meses: [...] Por vontade da operadora, apenas uma vez ao ano, no aniversário do contrato, desde que você seja comunicado com 60 dias de antecedência, informando o motivo da rescisão. [...] Contratos com menos de 30 vidas: reajuste único aplicável a todos os contratos com menos de 30 vidas da sua operadora.", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id ans-cartilha-empresario-individual-regras); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/ans-cartilha-empresario-individual.pdf.txt (HTTP 200, 10:17)", "id_lista": "normas/ans-cartilha-empresario-individual-regras"}, {"afirmacao": "O plano contratado por empresário individual é coletivo empresarial. A página antiga da ANS ainda indica a cartilha para o empresário individual, e o portal avisa que não é mais atualizado.", "fonte": "ANS · página \"Quero contratar um plano de saúde, o que preciso saber?\" (portal antigo da ANS)", "url": "http://www.ans.gov.br/ans-com-voce/quero-contratar-um-plano-de-saude-o-que-preciso-saber", "trecho": "Este site migrou para https://www.gov.br/ans/pt-br e não está sendo mais atualizado. [...] Se a contratação for por meio de uma empresa ou de um empresário individual, ele será coletivo empresarial. [...] Se você é empresário individual, baixe a cartilha da ANS sobre contratação de plano de saúde coletivo empresarial.", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id ans-quero-contratar-cartilha); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/ans-quero-contratar.texto.txt (HTTP 200, 10:16)", "id_lista": "normas/ans-quero-contratar-cartilha"}, {"afirmacao": "O reajuste do plano coletivo contratado por empresa é livre; na prática, o teto da ANS vale para os planos individuais ou familiares contratados depois de 2 de janeiro de 1999, menos os só odontológicos.", "fonte": "Ministério da Fazenda · Nota Técnica SEI (Sistema Eletrônico de Informações) nº 3878/2026, itens 6 e 7", "url": "https://www.gov.br/ans/pt-br/assuntos/consumidor/reajuste-variacao-de-mensalidade/reajuste-anual-de-planos-individuais-familiares-1/IRPI2026_NT_MinFazenda.pdf", "trecho": "6. Por fim, o reajuste dos planos coletivos contratados por pessoas jurídicas é livre. [...] 7. Portanto, na prática, os planos efetivamente sujeitos ao reajuste máximo estabelecido pela ANS são os planos individuais/familiares novos (pós 2 de janeiro de 1999), exc
