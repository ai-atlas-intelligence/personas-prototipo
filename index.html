eto os planos exclusivamente odontológicos", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id minfaz-nt-3878-itens-6-7); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/ans-nt-minfaz-2026.pdf.txt (HTTP 200, 10:16)", "id_lista": "normas/minfaz-nt-3878-itens-6-7"}], "condicao": "Troque [nome de quem indicou] pelo nome de quem passou o contato e [seu nome] pelo seu. Ela desconfia de número estranho: sem uma indicação de verdade, peça antes a quem a conhece que avise que você vai escrever."}, "encaixe": {"tarefas": ["Consultar e fazer exame quando um sintoma preocupa, sem fechar a loja", "Tirar consulta e exame do cartão de crédito", "Manter previsíveis as contas da casa e da loja", "Voltar a ter uma proteção que seja dela", "Cuidar da saúde da mãe"], "dores": ["Reajuste que chega no boleto sem explicação", "Não saber o que o plano cobre e o que fica de fora", "Consulta parcelada no cartão; em mês fraco, só o mínimo da fatura, sabendo que é o juro mais caro", "Fechar a loja para ir ao médico", "No fundo: se ela adoece, a loja para e a renda some", "No fundo: medo de esperar vaga para internar, como o pai esperou"], "ganhos": ["Saber o valor dos próximos 12 meses antes de assinar", "Consulta depois das 19h ou no sábado à tarde", "Lista curta do que cobre e do que não cobre, numa mensagem", "Incluir a mãe com preço claro", "Uma carteirinha na bolsa de novo"], "produtos": ["Plano de saúde de consulta e exame, sem internação: o segmento ambulatorial da Lei 9.656, de 1998", "Feito para quem trabalha por conta própria", "Cerca de R$ 180 por mês (valor que você informou)", "Venda por corretora no Centro de Teresina e por WhatsApp"], "aliviadores": ["Consulta sem limite de número e exame pedido pelo médico, dentro dos limites de cobertura que a lei define (Lei 9.656, art. 12). Tira a consulta do cartão de crédito.", "Se não houver coparticipação, o gasto com médico vira uma conta do mês, de valor conhecido até o aniversário do contrato, como o carnê que ela já paga em dia há anos.", "Se o contrato for individual ou familiar: reajuste anual com teto da ANS (Agência Nacional de Saúde Suplementar), definido todo ano e aplicado no aniversário do contrato. O teto deste ciclo é 5,11%; quem assina agora tem o primeiro reajuste em 2027, pelo teto do ano que vem. E a operadora só cancela por fraude ou atraso de mais de 60 dias em 12 meses (Lei 9.656, art. 13).", "Carência escrita em dias, dentro do teto da lei: até 180 dias nos casos comuns e até 24 horas para urgência (Lei 9.656, art. 12, V). O que o plano cobre numa urgência, e onde para, vem por escrito (ver a lacuna Urgência).", "Proposta por escrito no WhatsApp, para ler com calma depois que a loja fecha."], "criadores": ["A carteirinha na bolsa de novo, dois anos depois de cancelar o plano.", "Corretora no Centro para olhar no olho antes de assinar, como ela gosta de fechar.", "A mãe pode entrar: a lei proíbe impedir alguém de ter plano por causa da idade (Lei 9.656, art. 14). O preço dela vem à parte.", "Consulta por vídeo, que ela usou e aprovou no plano da empresa (a confirmar se o plano oferece).", "Lista da rede com endereço e horário, para ela achar a clínica mais perto da loja (a confirmar com a rede)."], "lacunas": ["Tipo de contrato. Suas respostas não dizem se o plano é individual ou coletivo. Só o individual ou familiar tem teto de reajuste da ANS e proteção contra cancelamento pela operadora; no coletivo, o reajuste fica fora do teto da ANS. O argumento mais forte para ela depende disso. Há ainda uma terceira via, o coletivo por adesão (4.343 dos 31.735 vínculos de mulheres de 35 a 44 anos de Teresina em junho de 2026); pela nota do Ministério da Fazenda, na prática o teto só vale para o individual ou familiar.", "Internação. É o medo de fundo dela, e o plano não cobre. A internação segue pelo SUS (Sistema Único de Saúde). Diga isso na primeira mensagem: escondido, aparece na leitura da irmã e derruba a venda.", "Urgência. Falta dizer o que o plano faz no pronto atendimento e onde a cobertura acaba. Foi nessa hora que o pai dela esperou vaga. Peça a regra por escrito à operadora.", "Preço. Você informou cerca de R$ 180. Para ela, \"cerca de\" soa como \"a partir de\". Feche o valor da faixa de idade dela e mande a tabela de faixas, que a lei exige no contrato (Lei 9.656, art. 16, IV, e art. 15).", "Coparticipação. Suas respostas não dizem se o plano cobra uma parte de cada consulta ou exame. Se cobrar, diga o valor por item na mesma mensagem do preço. A lei manda o contrato dizer isso com clareza (Lei 9.656, art. 16, VIII). Conta que muda de valor é a dor mais forte dela.", "A mãe, de 69 anos. O preço dela não foi informado e segue outra faixa de idade. Se vier junto e alto, pode travar a compra das duas. Ela tem pressão alta: pergunte à operadora o que ela precisa declarar na entrada e o que o plano cobre para a pressão nos primeiros 24 meses. Depois de 24 meses de contrato, a lei proíbe excluir a cobertura de doença que já existia (Lei 9.656, art. 11).", "Rede e horário. Não sabemos onde ficam as clínicas nem se atendem depois das 19h. Sem isso, consulta sem fechar a loja vira promessa vazia.", "Mercado pequeno e no CPF (Cadastro de Pessoas Físicas). Em junho de 2026, 872 dos 31.735 vínculos de mulheres de 35 a 44 anos de Teresina a plano médico eram sem internação (2,7%), e 743 desses 872 eram individuais ou familiares (85,2%). Conta nossa no arquivo de dados abertos da ANS. O dado não diz se falta oferta ou procura."], "fontes": [{"afirmacao": "Plano ambulatorial cobre consulta sem limite de número e exame pedido pelo médico", "fonte": "Presidência da República (Planalto) · Lei nº 9.656, de 3 de junho de 1998, art. 12, I", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9656.htm", "trecho": "LEI Nº 9.656, DE 3 DE JUNHO DE 1998. [...] Dispõe sobre os planos e seguros privados de assistência à saúde. [...] Art. 12. São facultadas a oferta, a contratação e a vigência dos produtos de que tratam o inciso I e o § 1o do art. 1o desta Lei, nas segmentações previstas nos incisos I a IV deste artigo, respeitadas as respectivas amplitudes de cobertura definidas no plano-referência de que trata o art. 10, segundo as seguintes exigências mínimas: (Redação dada pela Medida Provisória nº 2.177-44, de 2001) I - quando incluir atendimento ambulatorial: a) cobertura de consultas médicas, em número ilimitado, em clínicas básicas e especializadas, reconhecidas pelo Conselho Federal de Medicina; [...] b) cobertura de serviços de apoio diagnóstico, tratamentos e demais procedimentos ambulatoriais, solicitados pelo médico assistente; (Redação dada pela Medida Provisória nº 2.177-44, de 2001)", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-luciene.json (fatos_de_epoca, \"Plano de saúde ganha lei\")", "id_lista": "fatos_de_epoca/Plano de saúde ganha lei"}, {"afirmacao": "Carência: até 180 dias nos casos comuns, até 300 dias para parto e até 24 horas na urgência e na emergência.", "fonte": "Presidência da República (Planalto) · Lei nº 9.656, de 3 de junho de 1998, art. 12, V", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9656.htm", "trecho": "V - quando fixar períodos de carência: a) prazo máximo de trezentos dias para partos a termo; b) prazo máximo de cento e oitenta dias para os demais casos; c) prazo máximo de vinte e quatro horas para a cobertura dos casos de urgência e emergência;", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id lei9656-art12-v); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/planalto-l9656.texto.txt (HTTP 200, 10:10)", "id_lista": "normas/lei9656-art12-v"}, {"afirmacao": "No plano contratado individualmente, a operadora só suspende ou cancela por fraude ou por mais de 60 dias de atraso nos últimos 12 meses, com aviso até o 50º dia.", "fonte": "Presidência da República (Planalto) · Lei nº 9.656, de 3 de junho de 1998, art. 13, parágrafo único, II", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9656.htm", "trecho": "Art. 13. Os contratos de produtos de que tratam o inciso I e o § 1o do art. 1o desta Lei têm renovação automática a partir do vencimento do prazo inicial de vigência, não cabendo a cobrança de taxas ou qualquer outro valor no ato da renovação. [...] Parágrafo único. Os produtos de que trata o caput, contratados individualmente, terão vigência mínima de um ano, sendo vedadas: [...] II - a suspensão ou a rescisão unilateral do contrato, salvo por fraude ou não-pagamento da mensalidade por período superior a sessenta dias, consecutivos ou não, nos últimos doze meses de vigência do contrato, desde que o consumidor seja comprovadamente notificado até o qüinquagésimo dia de inadimplência;", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id lei9656-art13-pu-ii); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/planalto-l9656.texto.txt (HTTP 200, 10:10)", "id_lista": "normas/lei9656-art13-pu-ii", "lacuna": 0}, {"afirmacao": "Ninguém pode ser impedido de ter plano por causa da idade ou de deficiência.", "fonte": "Presidência da República (Planalto) · Lei nº 9.656, de 3 de junho de 1998, art. 14", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9656.htm", "trecho": "Art. 14. Em razão da idade do consumidor, ou da condição de pessoa portadora de deficiência, ninguém pode ser impedido de participar de planos privados de assistência à saúde. (Redação dada pela Medida Provisória nº 2.177-44, de 2001)", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id lei9656-art14); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/planalto-l9656.texto.txt (HTTP 200, 10:10)", "id_lista": "normas/lei9656-art14"}, {"afirmacao": "O contrato precisa trazer as faixas de idade e o percentual de reajuste de cada uma.", "fonte": "Presidência da República (Planalto) · Lei nº 9.656, de 3 de junho de 1998, art. 16, IV", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9656.htm", "trecho": "Art. 16. Dos contratos, regulamentos ou condições gerais dos produtos de que tratam o inciso I e o § 1o do art. 1o desta Lei devem constar dispositivos que indiquem com clareza: [...] IV - as faixas etárias e os percentuais a que alude o caput do art. 15;", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id lei9656-art16-iv); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/planalto-l9656.texto.txt (HTTP 200, 10:10)", "id_lista": "normas/lei9656-art16-iv"}, {"afirmacao": "A mensalidade só muda por idade se as faixas e os percentuais estiverem no contrato inicial.", "fonte": "Presidência da República (Planalto) · Lei nº 9.656, de 3 de junho de 1998, art. 15", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9656.htm", "trecho": "Art. 15. A variação das contraprestações pecuniárias estabelecidas nos contratos de produtos de que tratam o inciso I e o § 1o do art. 1o desta Lei, em razão da idade do consumidor, somente poderá ocorrer caso estejam previstas no contrato inicial as faixas etárias e os percentuais de reajustes incidentes em cada uma delas, conforme normas expedidas pela ANS, ressalvado o disposto no art. 35-E. (Redação dada pela Medida Provisória nº 2.177-44, de 2001)", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id lei9656-art15); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/planalto-l9656.texto.txt (HTTP 200, 10:10)", "id_lista": "normas/lei9656-art15"}, {"afirmacao": "O contrato precisa dizer com clareza a franquia, os limites financeiros ou o percentual de coparticipação.", "fonte": "Presidência da República (Planalto) · Lei nº 9.656, de 3 de junho de 1998, art. 16, VIII", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9656.htm", "trecho": "Art. 16. Dos contratos, regulamentos ou condições gerais dos produtos de que tratam o inciso I e o § 1o do art. 1o desta Lei devem constar dispositivos que indiquem com clareza: [...] VIII - a franquia, os limites financeiros ou o percentual de co-participação do consumidor ou beneficiário, contratualmente previstos nas despesas com assistência médica, hospitalar e odontológica; (Redação dada pela Medida Provisória nº 2.177-44, de 2001)", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id lei9656-art16-viii); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/planalto-l9656.texto.txt (HTTP 200, 10:10)", "id_lista": "normas/lei9656-art16-viii"}, {"afirmacao": "Depois de 24 meses de contrato, o plano não pode excluir a cobertura de doença ou lesão que a pessoa já tinha ao contratar.", "fonte": "Presidência da República (Planalto) · Lei nº 9.656, de 3 de junho de 1998, art. 11", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9656.htm", "trecho": "Art. 11. É vedada a exclusão de cobertura às doenças e lesões preexistentes à data de contratação dos produtos de que tratam o inciso I e o § 1o do art. 1o desta Lei após vinte e quatro meses de vigência do aludido instrumento contratual, cabendo à respectiva operadora o ônus da prova e da demonstração do conhecimento prévio do consumidor ou beneficiário. (Redação dada pela Medida Provisória nº 2.177-44, de 2001)", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id lei9656-art11); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/planalto-l9656.texto.txt (HTTP 200, 10:10)", "id_lista": "normas/lei9656-art11"}, {"afirmacao": "O teto de 5,11% vale para os planos individuais ou familiares na data de aniversário de cada contrato, entre 1º de maio de 2026 e 30 de abril de 2027.", "fonte": "ANS · Nota Técnica nº 2/2026/COREF/GEFAP/GGREP/DIRAD-DIPRO/DIPRO", "url": "https://www.gov.br/ans/pt-br/arquivos/assuntos/consumidor/reajustes-de-mensalidade/reajuste-anual-de-planos-individuais-familiares/metodologia-de-calculo/2023/IRPI2026_NT_Reajuste.pdf", "trecho": "O índice máximo de reajuste anual por variação de custos a incidir sobre as mensalidades dos planos privados de assistência à saúde médico-hospitalares de contratação individual ou familiar, na vigência da Lei nº 9.656/98 ou a ela adaptados, no período de 1º de maio de 2026 a 30 de abril de 2027 é de 5,11% (cinco inteiros e onze centésimos por cento). [...] Estão sujeitos à sua aplicação todos os beneﬁciários de planos privados de assistência à saúde médico-hospitalares, com ou sem cobertura odontológica, de contratação individual ou familiar, contratados na vigência da Lei nº 9.656/98 ou a ela adaptados, na data de aniversário de seus contratos.", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id ans-nt-2026-aniversario); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/ans-nt-reajuste-2026.pdf.txt (HTTP 200, 10:16)", "id_lista": "normas/ans-nt-2026-aniversario", "lacuna": 0}, {"afirmacao": "O reajuste do plano coletivo contratado por empresa é livre; na prática, o teto da ANS vale para os planos individuais ou familiares contratados depois de 2 de janeiro de 1999, menos os só odontológicos.", "fonte": "Ministério da Fazenda · Nota Técnica SEI (Sistema Eletrônico de Informações) nº 3878/2026, itens 6 e 7", "url": "https://www.gov.br/ans/pt-br/assuntos/consumidor/reajuste-variacao-de-mensalidade/reajuste-anual-de-planos-individuais-familiares-1/IRPI2026_NT_MinFazenda.pdf", "trecho": "6. Por fim, o reajuste dos planos coletivos contratados por pessoas jurídicas é livre. [...] 7. Portanto, na prática, os planos efetivamente sujeitos ao reajuste máximo estabelecido pela ANS são os planos individuais/familiares novos (pós 2 de janeiro de 1999), exceto os planos exclusivamente odontológicos", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id minfaz-nt-3878-itens-6-7); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/ans-nt-minfaz-2026.pdf.txt (HTTP 200, 10:16)", "id_lista": "normas/minfaz-nt-3878-itens-6-7", "lacuna": 0}, {"afirmacao": "4.343 dos 31.735 vínculos de mulheres de 35 a 44 anos de Teresina a plano médico eram de coletivo por adesão (junho de 2026)", "fonte": "ANS (Agência Nacional de Saúde Suplementar) · dados abertos de beneficiários, Piauí, junho de 2026", "url": "https://dadosabertos.ans.gov.br/FTP/PDA/informacoes_consolidadas_de_beneficiarios-024/202606/pda-024-icb-PI-2026_06.zip", "trecho": "ID_CMPT_MOVEL;CD_OPERADORA;NM_RAZAO_SOCIAL;NR_CNPJ;MODALIDADE_OPERADORA;SG_UF;CD_MUNICIPIO;NM_MUNICIPIO;TP_SEXO;DE_FAIXA_ETARIA;DE_FAIXA_ETARIA_REAJ;CD_PLANO;TP_VIGENCIA_PLANO;DE_CONTRATACAO_PLANO;DE_SEGMENTACAO_PLANO;DE_ABRG_GEOGRAFICA_PLANO;COBERTURA_ASSIST_PLAN;TIPO_VINCULO;QT_BENEFICIARIO_ATIVO;QT_BENEFICIARIO_ADERIDO;QT_BENEFICIARIO_CANCELADO;DT_CARGA [...] \"2026-06\";\"339679\";\"UNIMED CNU - COOPERATIVA CENTRAL\";\"02812468000106\";\"COOPERATIVA MÉDICA\";\"PI\";\"221100\";\"Teresina\";\"F\";\"35 a 39 anos\";\"34 a 38 anos\";\"498120241\";\"P\";\"Coletivo Empresarial\";\"Ambulatorial + Hospitalar com obstetrícia\";\"Nacional\";\"Médico-hospitalar\";\"Dependente\";3;0;0;\"2026-08-21\" [...] \"2026-06\";\"357511\";\"HUMANA SAÚDE NORDESTE LTDA. \";\"00361325000108\";\"MEDICINA DE GRUPO\";\"PI\";\"221100\";\"Teresina\";\"F\";\"40 a 44 anos\";\"39 a 43 anos\";\"487051204\";\"P\";\"Individual ou Familiar\";\"Ambulatorial + Hospitalar com obstetrícia\";\"Nacional\";\"Médico-hospitalar\";\"Dependente\";1;0;0;\"2026-08-21\"", "conferido_em": "2026-10-02", "como": "reaproveitado de dados/fatos-luciene.json (numeros, id ans-tipo-contratacao-teresina-mulheres-35-44-2026-06)", "id_lista": "numeros/ans-tipo-contratacao-teresina-mulheres-35-44-2026-06", "lacuna": 0}, {"afirmacao": "872 de 31.735 vínculos sem internação (2,7%); 743 de 872 individuais ou familiares (85,2%)", "fonte": "ANS (Agência Nacional de Saúde Suplementar) · dados abertos de beneficiários, Piauí, junho de 2026", "url": "https://dadosabertos.ans.gov.br/FTP/PDA/informacoes_consolidadas_de_beneficiarios-024/202606/pda-024-icb-PI-2026_06.zip", "trecho": "ID_CMPT_MOVEL;CD_OPERADORA;NM_RAZAO_SOCIAL;NR_CNPJ;MODALIDADE_OPERADORA;SG_UF;CD_MUNICIPIO;NM_MUNICIPIO;TP_SEXO;DE_FAIXA_ETARIA;DE_FAIXA_ETARIA_REAJ;CD_PLANO;TP_VIGENCIA_PLANO;DE_CONTRATACAO_PLANO;DE_SEGMENTACAO_PLANO;DE_ABRG_GEOGRAFICA_PLANO;COBERTURA_ASSIST_PLAN;TIPO_VINCULO;QT_BENEFICIARIO_ATIVO;QT_BENEFICIARIO_ADERIDO;QT_BENEFICIARIO_CANCELADO;DT_CARGA [...] \"2026-06\";\"357511\";\"HUMANA SAÚDE NORDESTE LTDA. \";\"00361325000108\";\"MEDICINA DE GRUPO\";\"PI\";\"221100\";\"Teresina\";\"F\";\"40 a 44 anos\";\"39 a 43 anos\";\"466690129\";\"P\";\"Individual ou Familiar\";\"Ambulatorial\";\"Grupo de municípios\";\"Médico-hospitalar\";\"Titular\";40;0;0;\"2026-08-21\" [...] \"2026-06\";\"368253\";\"HAPVIDA ASSISTENCIA MEDICA S.A.\";\"63554067000198\";\"MEDICINA DE GRUPO\";\"PI\";\"221100\";\"Teresina\";\"F\";\"35 a 39 anos\";\"34 a 38 anos\";\"485124202\";\"P\";\"Coletivo Empresarial\";\"Ambulatorial\";\"Grupo de municípios\";\"Médico-hospitalar\";\"Titular\";1;1;0;\"2026-08-21\"", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-luciene.json (numeros, id ans-segmentacao-teresina-mulheres-35-44-2026-06)", "id_lista": "numeros/ans-segmentacao-teresina-mulheres-35-44-2026-06"}]}, "ideias": [{"tipo": "Comunicação", "titulo": "Sem registro de empresa, ela entra pela porta com mais regra", "texto": "Sem CNPJ (Cadastro Nacional da Pessoa Jurídica), ela ouve da corretora: abre um MEI (microempreendedor individual) que fica mais barato. Só que o plano de empresa do MEI fica fora do teto de reajuste da ANS (Agência Nacional de Saúde Suplementar). O reajuste dele é um só para todos os contratos com menos de 30 vidas da operadora, e a operadora pode desfazer o contrato uma vez por ano, no aniversário, com 60 dias de aviso (cartilha da ANS, de 2018, que pode ter mudado). No CPF (Cadastro de Pessoas Físicas), o plano individual tem teto de reajuste, definido pela ANS todo ano e aplicado no aniversário do contrato, e só cai por fraude ou atraso (Lei 9.656, art. 13). Prometa só a regra: o teto do primeiro reajuste dela ainda não saiu. Para quem tem o boleto que muda como maior dor, isso pode vender mais que preço. Vale só se o seu contrato for individual. Hipótese a testar.", "teste": "Mande a 10 donas de pequeno negócio sem CNPJ duas propostas com o mesmo preço, 5 para cada versão; uma traz a regra do reajuste e do cancelamento na primeira linha. Conte quantas pedem a proposta completa. Trate como sinal: com 5 por grupo, só diferença grande conta (por exemplo, 4 de 5 contra 1 de 5). Para decidir, repita com mais gente.", "fontes": [{"afirmacao": "Plano de empresa do empresário individual: 6 meses de registro para contratar, reajuste único para contratos com menos de 30 vidas e rescisão pela operadora uma vez por ano, no aniversário, com 60 dias de aviso.", "fonte": "ANS · Cartilha \"Plano de saúde coletivo empresarial por empresário individual\" (versão de maio de 2018)", "url": "http://www.ans.gov.br/images/stories/noticias/pdf/Cartilha_atualizada_maio.pdf", "trecho": "deve apresentar à operadora documentos que comprovem, pelo tempo mínimo de 6 meses: [...] Por vontade da operadora, apenas uma vez ao ano, no aniversário do contrato, desde que você seja comunicado com 60 dias de antecedência, informando o motivo da rescisão. [...] Contratos com menos de 30 vidas: reajuste único aplicável a todos os contratos com menos de 30 vidas da sua operadora.", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id ans-cartilha-empresario-individual-regras); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/ans-cartilha-empresario-individual.pdf.txt (HTTP 200, 10:17)", "id_lista": "normas/ans-cartilha-empresario-individual-regras"}, {"afirmacao": "O plano contratado por empresário individual é coletivo empresarial. A página antiga da ANS ainda indica a cartilha para o empresário individual, e o portal avisa que não é mais atualizado.", "fonte": "ANS · página \"Quero contratar um plano de saúde, o que preciso saber?\" (portal antigo da ANS)", "url": "http://www.ans.gov.br/ans-com-voce/quero-contratar-um-plano-de-saude-o-que-preciso-saber", "trecho": "Este site migrou para https://www.gov.br/ans/pt-br e não está sendo mais atualizado. [...] Se a contratação for por meio de uma empresa ou de um empresário individual, ele será coletivo empresarial. [...] Se você é empresário individual, baixe a cartilha da ANS sobre contratação de plano de saúde coletivo empresarial.", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id ans-quero-contratar-cartilha); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/ans-quero-contratar.texto.txt (HTTP 200, 10:16)", "id_lista": "normas/ans-quero-contratar-cartilha"}, {"afirmacao": "No plano contratado individualmente, a operadora só suspende ou cancela por fraude ou por mais de 60 dias de atraso nos últimos 12 meses, com aviso até o 50º dia.", "fonte": "Presidência da República (Planalto) · Lei nº 9.656, de 3 de junho de 1998, art. 13, parágrafo único, II", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9656.htm", "trecho": "Art. 13. Os contratos de produtos de que tratam o inciso I e o § 1o do art. 1o desta Lei têm renovação automática a partir do vencimento do prazo inicial de vigência, não cabendo a cobrança de taxas ou qualquer outro valor no ato da renovação. [...] Parágrafo único. Os produtos de que trata o caput, contratados individualmente, terão vigência mínima de um ano, sendo vedadas: [...] II - a suspensão ou a rescisão unilateral do contrato, salvo por fraude ou não-pagamento da mensalidade por período superior a sessenta dias, consecutivos ou não, nos últimos doze meses de vigência do contrato, desde que o consumidor seja comprovadamente notificado até o qüinquagésimo dia de inadimplência;", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id lei9656-art13-pu-ii); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/planalto-l9656.texto.txt (HTTP 200, 10:10)", "id_lista": "normas/lei9656-art13-pu-ii"}, {"afirmacao": "O reajuste do plano coletivo contratado por empresa é livre; na prática, o teto da ANS vale para os planos individuais ou familiares contratados depois de 2 de janeiro de 1999, menos os só odontológicos.", "fonte": "Ministério da Fazenda · Nota Técnica SEI (Sistema Eletrônico de Informações) nº 3878/2026, itens 6 e 7", "url": "https://www.gov.br/ans/pt-br/assuntos/consumidor/reajuste-variacao-de-mensalidade/reajuste-anual-de-planos-individuais-familiares-1/IRPI2026_NT_MinFazenda.pdf", "trecho": "6. Por fim, o reajuste dos planos coletivos contratados por pessoas jurídicas é livre. [...] 7. Portanto, na prática, os planos efetivamente sujeitos ao reajuste máximo estabelecido pela ANS são os planos individuais/familiares novos (pós 2 de janeiro de 1999), exceto os planos exclusivamente odontológicos", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id minfaz-nt-3878-itens-6-7); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/ans-nt-minfaz-2026.pdf.txt (HTTP 200, 10:16)", "id_lista": "normas/minfaz-nt-3878-itens-6-7"}, {"afirmacao": "O teto de 5,11% vale para os planos individuais ou familiares na data de aniversário de cada contrato, entre 1º de maio de 2026 e 30 de abril de 2027.", "fonte": "ANS · Nota Técnica nº 2/2026/COREF/GEFAP/GGREP/DIRAD-DIPRO/DIPRO", "url": "https://www.gov.br/ans/pt-br/arquivos/assuntos/consumidor/reajustes-de-mensalidade/reajuste-anual-de-planos-individuais-familiares/metodologia-de-calculo/2023/IRPI2026_NT_Reajuste.pdf", "trecho": "O índice máximo de reajuste anual por variação de custos a incidir sobre as mensalidades dos planos privados de assistência à saúde médico-hospitalares de contratação individual ou familiar, na vigência da Lei nº 9.656/98 ou a ela adaptados, no período de 1º de maio de 2026 a 30 de abril de 2027 é de 5,11% (cinco inteiros e onze centésimos por cento). [...] Estão sujeitos à sua aplicação todos os beneﬁciários de planos privados de assistência à saúde médico-hospitalares, com ou sem cobertura odontológica, de contratação individual ou familiar, contratados na vigência da Lei nº 9.656/98 ou a ela adaptados, na data de aniversário de seus contratos.", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id ans-nt-2026-aniversario); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/ans-nt-reajuste-2026.pdf.txt (HTTP 200, 10:16)", "id_lista": "normas/ans-nt-2026-aniversario"}]}, {"tipo": "Comunicação", "titulo": "Quem cuida da loja também precisa de consulta", "texto": "Ela corta primeiro o que é dela. Fale da consulta dela como cuidado com a loja, que depende da saúde de quem abre a porta. Deixe a mãe e a filha para uma segunda conversa, depois que a carteirinha dela chegar. Assim o plano deixa de parecer egoísmo.", "teste": "Duas versões da mensagem pronta para 20 contatos indicados, 10 para cada: uma fala de cuidado com a loja, a outra de proteger a família. Conte quantas pedem a proposta. Trate como sinal: com 10 por grupo, só diferença grande conta (por exemplo, 7 de 10 contra 2 de 10). Para decidir, repita com mais gente."}, {"tipo": "Oferta", "titulo": "O contrato numa tela, com a saída à vista", "texto": "Antes do preço, uma tela só: o que cobre, o que fica de fora, a carência de cada item em dias, a cobrança por consulta ou exame, se houver, a regra do reajuste, a tabela de faixas de idade e como cancelar. É a mesma tela que a irmã, técnica de enfermagem, vai ler. Quem lê contrato procurando armadilha confia em quem mostra a saída antes da entrada. Hipótese a testar.", "teste": "Com 10 interessadas, mande a tela antes do preço para metade delas. Conte quantas voltam depois de mostrar à irmã ou a alguém de confiança. Trate como sinal: com 5 por grupo, só diferença grande conta (por exemplo, 4 de 5 contra 1 de 5). Para decidir, repita com mais gente.", "fontes": [{"afirmacao": "O contrato precisa dizer com clareza a franquia, os limites financeiros ou o percentual de coparticipação.", "fonte": "Presidência da República (Planalto) · Lei nº 9.656, de 3 de junho de 1998, art. 16, VIII", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9656.htm", "trecho": "Art. 16. Dos contratos, regulamentos ou condições gerais dos produtos de que tratam o inciso I e o § 1o do art. 1o desta Lei devem constar dispositivos que indiquem com clareza: [...] VIII - a franquia, os limites financeiros ou o percentual de co-participação do consumidor ou beneficiário, contratualmente previstos nas despesas com assistência médica, hospitalar e odontológica; (Redação dada pela Medida Provisória nº 2.177-44, de 2001)", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id lei9656-art16-viii); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/planalto-l9656.texto.txt (HTTP 200, 10:10)", "id_lista": "normas/lei9656-art16-viii"}, {"afirmacao": "O contrato precisa trazer as faixas de idade e o percentual de reajuste de cada uma.", "fonte": "Presidência da República (Planalto) · Lei nº 9.656, de 3 de junho de 1998, art. 16, IV", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9656.htm", "trecho": "Art. 16. Dos contratos, regulamentos ou condições gerais dos produtos de que tratam o inciso I e o § 1o do art. 1o desta Lei devem constar dispositivos que indiquem com clareza: [...] IV - as faixas etárias e os percentuais a que alude o caput do art. 15;", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id lei9656-art16-iv); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/planalto-l9656.texto.txt (HTTP 200, 10:10)", "id_lista": "normas/lei9656-art16-iv"}, {"afirmacao": "A mensalidade só muda por idade se as faixas e os percentuais estiverem no contrato inicial.", "fonte": "Presidência da República (Planalto) · Lei nº 9.656, de 3 de junho de 1998, art. 15", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9656.htm", "trecho": "Art. 15. A variação das contraprestações pecuniárias estabelecidas nos contratos de produtos de que tratam o inciso I e o § 1o do art. 1o desta Lei, em razão da idade do consumidor, somente poderá ocorrer caso estejam previstas no contrato inicial as faixas etárias e os percentuais de reajustes incidentes em cada uma delas, conforme normas expedidas pela ANS, ressalvado o disposto no art. 35-E. (Redação dada pela Medida Provisória nº 2.177-44, de 2001)", "conferido_em": "2026-10-05", "como": "registrado na lista dados/fatos-luciene.json (normas, id lei9656-art15); trecho conferido pelo build_fatos.py contra a cópia gravada _coleta/luciene/planalto-l9656.texto.txt (HTTP 200, 10:10)", "id_lista": "normas/lei9656-art15"}]}, {"tipo": "Produto", "titulo": "Horário de comerciante", "texto": "Negocie com a rede consulta depois das 19h e no sábado à tarde, mais consulta por vídeo, que a lei da telessaúde organiza desde 2022 (Lei 14.510). O trabalho que ela contrata é consultar sem fechar a loja. Sem esse horário, o plano resolve metade do problema.", "teste": "Peça à rede a lista de clínicas com horário depois das 19h e no sábado. Se a lista for curta, a promessa sai da mensagem.", "fontes": [{"afirmacao": "Telessaúde autorizada e organizada por lei desde 2022", "fonte": "Presidência da República (Planalto) · Lei nº 14.510, de 27 de dezembro de 2022", "url": "https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2022/lei/l14510.htm", "trecho": "LEI Nº 14.510, DE 27 DE DEZEMBRO DE 2022 Altera a Lei nº 8.080, de 19 de setembro de 1990, para autorizar e disciplinar a prática da telessaúde em todo o território nacional [...] Art. 26-A. A telessaúde abrange a prestação remota de serviços relacionados a todas as profissões da área da saúde regulamentadas pelos órgãos competentes do Poder Executivo federal", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-luciene.json (fatos_de_epoca, \"Consulta a distância vira lei\")", "id_lista": "fatos_de_epoca/Consulta a distância vira lei"}]}, {"tipo": "Produto", "titulo": "Um mapa para a hora difícil", "texto": "Uma página, revisada por profissional de saúde, com o que o plano faz numa urgência, onde a cobertura acaba e como seguir pelo SUS (Sistema Único de Saúde) se precisar internar. O plano não cobre o medo de fundo dela. Dizer o caminho com clareza é o cuidado que cabe a ele. Hipótese a testar.", "teste": "Mostre a página a 5 interessadas e à pessoa que lê o contrato com elas. Pergunte se confiam mais ou menos no plano depois de ler o que ele não cobre."}, {"tipo": "Portfólio", "titulo": "Degraus: CPF hoje, internação e MEI depois", "texto": "Comece pelo plano de consulta e exame no CPF. Deixe pronta, por escrito, a conta de dois próximos passos: um plano com internação, quando o caixa da loja deixar, e o plano de empresa, se ela virar MEI em 2027, com as duas regras de reajuste lado a lado. Pergunte à operadora o que acontece com a carência na troca. Em 2030, a decisão vira da casa, com a mãe aos 73 e a filha aos 20 (hipótese). Quem mostra o caminho inteiro tem chance de ficar com a família inteira.", "teste": "Nas primeiras 20 vendas, anote quem pergunta por internação ou por MEI. Se forem a maioria, monte a conta dos degraus antes da venda seguinte."}], "conversa": [["Por que você cancelou o plano?", "Fiquei no plano da antiga empresa pagando tudo sozinha. Quase não usava, e no quinto mês veio um aumento que ninguém me explicou. No mês em que a loja vendeu pouco, tive que escolher entre o plano e o aluguel."], ["O que te faria voltar a ter plano?", "Saber direitinho o que cobre e ter consulta perto. E um valor que eu consiga pagar até em mês fraco."], ["Você tem CNPJ?", "Ainda não. Já pensei em abrir o MEI, mas tenho medo da burocracia e do imposto."], ["Um plano sem internação te serve?", "Se eu entender bem o que fica de fora, serve. Internação eu ia ter que contar com o SUS, e disso eu tenho medo, por causa do meu pai. Mas o que eu uso mesmo é consulta e exame."], ["Quem te ajuda a decidir?", "Minha irmã. Ela é técnica de enfermagem e lê tudo antes de mim. Se ela torcer o nariz, eu nem assino."], ["Como você prefere receber uma proposta?", "Por escrito, no WhatsApp, depois que eu fecho a loja. Ligação no meio de um banho de cachorro eu não atendo."]], "teste": {"texto": "Plano de saúde a partir de R$ 180! Consultas e exames sem burocracia e carência reduzida*. Garanta já a proteção da sua família. Chame no WhatsApp!", "funciona": ["Mostra o preço, a primeira coisa que ela procura.", "Fala de consulta e exame, o que ela usa de verdade.", "Chama para o WhatsApp, o canal em que ela passa o dia."], "afasta": ["“A partir de” é o valor que muda depois da letra miúda, o medo que ela traz do crediário.", "O asterisco da carência é a armadilha que ela procura em todo contrato.", "“Proteção da sua família” põe ela em último lugar e sugere uma cobertura de hospital que o plano não tem.", "“Garanta já” empurra quem decide devagar e por escrito.", "Não diz o que fica de fora. A irmã vai perguntar da internação, e o anúncio fica devendo a resposta."], "reescrita": "Consulta e exame por R$ 180 por mês, para quem trabalha por conta própria. Não cobre internação, e a gente diz isso antes. Peça no WhatsApp, por escrito: o que cobre, a carência de cada item e a regra do reajuste."}, "elenco": [{"nome": "Raimunda Sousa", "idade": 52, "ocupacao": "Costureira em casa", "cidade": "Teresina (PI)", "quer": "Exames de rotina sem fila", "medo": "Reajuste por idade", "palavra": "valor fixo", "canal": "WhatsApp e indicação", "foto_prompt_en": "head and shoulders portrait photograph of a 52-year-old Brazilian woman, dark brown skin, black hair with gray streaks in a bun, reading glasses on a cord, yellow measuring tape around her neck, sewing room at home, natural light, blurred background, 50mm, realistic skin, candid", "foto_geracao": {"modelo": "stabilityai/stable-diffusion-xl-base-1.0", "seed": 5210, "variacao": 1, "candidata": "dev/candidatas/luciene-elenco-1-1.jpg", "em_uso": "img/luciene-elenco-1.jpg", "pedido": "dev/pedido-elenco.json"}, "foto": {"arquivo": "img/luciene-elenco-1.jpg", "alt": "Retrato gerado por inteligência artificial (IA) para Raimunda; não é uma pessoa real"}}, {"nome": "Thiago Ribeiro", "idade": 31, "ocupacao": "Conserta celulares, microempreendedor individual (MEI)", "cidade": "Teresina (PI)", "quer": "Plano barato só para ele", "medo": "Pagar por algo que não usa", "palavra": "consulta por vídeo", "canal": "Instagram", "foto_prompt_en": "head and shoulders portrait photograph of a 31-year-old Brazilian man, light brown skin, short dark hair, trimmed beard, plain green t-shirt, small phone repair shop behind him, natural light, blurred background, 50mm, realistic skin, candid", "foto_geracao": {"modelo": "stabilityai/stable-diffusion-xl-base-1.0", "seed": 3111, "variacao": 2, "candidata": "dev/candidatas/luciene-elenco-2-2.jpg", "em_uso": "img/luciene-elenco-2.jpg", "pedido": "dev/pedido-elenco.json"}, "foto": {"arquivo": "img/luciene-elenco-2.jpg", "alt": "Retrato gerado por inteligência artificial (IA) para Thiago; não é uma pessoa real"}}], "derruba": ["Nas entrevistas, a maioria das donas de pequeno negócio de Teresina já tem plano pela família ou pelo CNPJ (registro de empresa) e não sente falta de um plano próprio.", "Ela e outras como ela escolhem o preço de entrada menor mesmo quando o reajuste vem sem regra escrita.", "Quem trabalha por conta própria só aceita plano com internação: a oferta ambulatorial é descartada logo na primeira conversa."], "perguntas_campo": ["Conte a última vez que você precisou de médico. O que fez, aonde foi e quanto pagou?", "Você já teve plano de saúde? Como ele entrou e como saiu da sua vida?", "Quando você saiu do último emprego com carteira, alguém te explicou se dava para ficar no plano da empresa? Quanto passou a custar e o que mudou no boleto?", "Quais contas você paga em dia todo mês, aconteça o que acontecer? Por que essas?", "Quem você consulta antes de assinar um contrato? O que essa pessoa olha primeiro?", "Se um plano cobrisse consulta e exame e não cobrisse internação, o que você faria se precisasse internar?", "Hoje, como você paga consulta e exame? Num mês fraco, como fica a fatura do cartão?"], "hipoteses": "Os 11 fatos de época e os 9 números têm fonte aberta, conferida na origem entre 2 e 5 de outubro de 2026. As 12 regras e orientações de lei e de norma citadas em objeções, encaixe, ideias e linha do tempo (Lei 9.656, cartilha, página e nota técnica da ANS, nota do Ministério da Fazenda) estão na lista conferida desta persona, com trecho e cópia gravada. As regras do plano de empresa do empresário individual vêm da cartilha da ANS de 2018; a norma de origem ficou sem leitura, e elas podem ter mudado. 3 dos números são conta nossa sobre o dado publicado, e o 11,1% usa o preço que você informou (R$ 180). A vida da Luciene (família, empregos, falas, rotina, arquétipo, personalidade e a marca de cada fato na vida dela) é ficção plausível, escrita como hipótese para testar com clientes reais.", "pronome": "ela"}}, "produtos": {"jessica": {"tipo": "Curso", "produtoCurto": "Faculdade a distância em Gestão Comercial", "categoria": "Curso", "respostas": ["Curso superior de tecnologia em Gestão Comercial, a distância, com dois anos de duração", "Gente que trabalha no comércio e quer crescer no emprego", "R$ 249 por mês", "Online, para alunos de todo o Brasil", "Deixar a proposta de valor clara"], "fontesMontando": ["Censo da Educação Superior, do Ministério da Educação", "Pesquisa Nacional por Amostra de Domicílios, do Instituto Brasileiro de Geografia e Estatística (IBGE)", "Pesquisa sobre uso da internet nos domicílios (Cetic.br)"]}, "marcos": {"tipo": "Carro", "produtoCurto": "Carro elétrico compacto para motorista de aplicativo", "categoria": "Produto", "respostas": ["Carro elétrico compacto, com financiamento pensado para motorista de aplicativo", "Motoristas de aplicativo que rodam o dia inteiro", "A partir de R$ 130 mil, ou parcela semanal", "Concessionária em São Paulo e site", "Falar melhor com quem compra"], "fontesMontando": ["Trabalho por aplicativo, do Instituto Brasileiro de Geografia e Estatística (IBGE)", "Preço dos combustíveis, da Agência Nacional do Petróleo (ANP)", "Venda de carros elétricos, da Associação Brasileira do Veículo Elétrico (ABVE)"]}, "luciene": {"tipo": "Serviço", "produtoCurto": "Plano de saúde para quem trabalha por conta", "categoria": "Serviço", "respostas": ["Plano de saúde com consultas e exames, sem internação, para quem trabalha por conta própria", "Mulheres que têm um pequeno negócio em Teresina", "Cerca de R$ 180 por mês", "Teresina (PI), corretora no centro e WhatsApp", "Falar melhor com quem compra"], "fontesMontando": ["Censo 2022, do Instituto Brasileiro de Geografia e Estatística (IBGE)", "Beneficiários de planos, da Agência Nacional de Saúde Suplementar (ANS)", "Leis do setor, no site da Presidência da República"]}}, "conceitos": [{"id": "persona", "nome": "Persona", "o_que_e": "Um personagem fictício, com nome, rosto e história, que representa um grupo de clientes reais. A equipe decide pensando nessa pessoa concreta, com metas e rotina, em vez de um público abstrato.", "como_usamos": "Na ficha, a persona junta dados públicos conferidos, com a fonte no próprio cartão, e uma vida plausível marcada como hipótese. A caixa no alto e o bloco Como validar dizem o que é dado e o que é hipótese.", "limite": "A persona organiza hipóteses sobre um grupo para a equipe decidir junto; ela não mede o tamanho do grupo nem prova que ele compra. Pruitt e Grudin (2003) escrevem que a persona rende mais quando complementa, sem substituir, métodos quantitativos e qualitativos. Pruitt e Adlin (2006) a apresentam como método complementar, sem prometer solução para tudo.", "referencia": {"autores": "Alan Cooper", "titulo": "The Inmates Are Running the Asylum", "publicacao": "Indianapolis: Sams, 1999. ISBN 0672316498. LCCN 99060546", "ano": "1999", "edicao_brasileira": null, "url": null, "conferido_em": "2026-10-05"}}, {"id": "protopersona", "nome": "Protopersona", "o_que_e": "Um rascunho de persona montado com o que a equipe já acredita sobre o cliente, antes de pesquisa com gente real. Serve de ponto de partida e muda à medida que a pesquisa traz fatos.", "como_usamos": "As três personas deste protótipo são protopersonas: montadas com dados públicos e o método, sem entrevista. A capa diz isso, e o bloco Como validar mostra o que falta para virar persona validada.", "limite": "A protopersona registra crenças, e o próprio autor pede que ela seja tratada assim: \"represent their assumptions and beliefs\" e \"will be refined over time\". Ela serve para alinhar a equipe e escolher quem entrevistar; não serve para dimensionar mercado nem para decidir investimento sozinha.", "referencia": {"autores": "Jeff Gothelf", "titulo": "Using Proto-Personas for Executive Alignment", "publicacao": "UX Magazine, 1º de maio de 2012 (artigo on-line)", "ano": "2012", "edicao_brasileira": "O método aparece no livro do autor: Lean UX: projetando ótimos produtos com equipes Agile, Jeff Gothelf e Josh Seiden, tradução de Cláudio José Adas, 3ª edição, São Paulo, Novatec, [2022], 281 p", "url": "https://uxmag.com/articles/using-proto-personas-for-executive-alignment", "conferido_em": "2026-10-05"}}, {"id": "arquetipos", "nome": "Arquétipos de marca e de pessoa", "o_que_e": "Doze figuras que voltam em mitos e histórias, como o herói, o prestativo e o fora-da-lei. Mark e Pearson, partindo de Jung, organizaram as doze em quatro grupos de motivação e as usaram para ler marcas e pessoas.", "como_usamos": "No bloco de arquétipo da ficha Pro, a persona recebe um arquétipo principal e um secundário, com o desejo, o medo e o trecho da história que sustenta a leitura. A roda de quatro grupos mostra onde ela está. É hipótese para a entrevista (em que história você se vê?), nunca rótulo fixo.", "limite": "Tipologia interpretativa de marketing, construída a partir de Jung; a lista de doze não está no volume de Jung sobre arquétipos. Não se mede com régua e não prevê compra. Spangenberg (2021) testou a classificação com 242 adultos dos Estados Unidos e concluiu que a percepção dos consumidores \"differs markedly from the original four quadrant delineation\". Na persona, o arquétipo é leitura da história e precisa da entrevista.", "referencia": {"autores": "Margaret Mark e Carol S. Pearson", "titulo": "The Hero and the Outlaw: Building Extraordinary Brands Through the Power of Archetypes", "publicacao": "New York: McGraw-Hill, 2001. xii, 384 p. ISBN 0071364153. LCCN 2001274378", "ano": "2001", "edicao_brasileira": "O herói e o fora-da-lei: como construir marcas extraordinárias usando o poder dos arquétipos. Tradução de Merle Scoss. São Paulo: Cultrix", "url": null, "conferido_em": "2026-10-05"}}, {"id": "cinco-grandes-fatores", "nome": "Cinco grandes fatores de personalidade", "o_que_e": "Um jeito de descrever o temperamento de alguém em cinco eixos: abertura a experiências, escrupulosidade (organização e disciplina), extroversão, socialização (cordialidade) e neuroticismo (tendência à ansiedade). Cada pessoa fica num ponto de cada eixo, sem tipo certo ou errado.", "como_usamos": "No bloco de personalidade da ficha Pro, cada eixo aparece como uma barra com três faixas (baixa, média, alta), escrita como hipótese. A faixa sai da história da persona e das falas de entrevista; vira medida só quando pessoas reais respondem um questionário validado no Brasil.", "limite": "Descreve traços medidos por questionário em grupos grandes de pessoas. Na persona, a faixa de cada eixo é hipótese até que pessoas reais respondam um instrumento validado. O modelo descreve temperamento; ele sozinho não diz o que a pessoa compra nem por quê.", "referencia": {"autores": "Oliver P. John e Sanjay Srivastava", "titulo": "The Big Five trait taxonomy: history, measurement, and theoretical perspectives", "publicacao": "Capítulo em Lawrence A. Pervin e Oliver P. John (org.), Handbook of Personality: Theory and Research, 2ª edição. New York: Guilford Press, 1999. xiii, 738 p. LCCN 99025807", "ano": "1999", "edicao_brasileira": null, "url": null, "conferido_em": "2026-10-05"}}, {"id": "fases-da-vida-erikson", "nome": "Fases da vida (estágios psicossociais de Erikson)", "o_que_e": "Erikson dividiu a vida em oito fases, cada uma com uma questão central, como confiar nos outros, saber quem se é, criar laços ou deixar legado. O jeito como a pessoa atravessa a questão da fase pesa nas escolhas que ela faz.", "como_usamos": "Na ficha, as oito fases aparecem numa faixa, com a fase atual em destaque e uma frase sobre o que está em jogo. É leitura nossa, a testar em entrevista.", "limite": "Teoria clínica escrita nos Estados Unidos em 1950, com casos de consultório e estudos com os povos Sioux e Yurok. As idades das fases são aproximadas e a ordem das questões varia de pessoa para pessoa. Não prevê compra; serve para formular pergunta de entrevista.", "referencia": {"autores": "Erik H. Erikson", "titulo": "Childhood and Society", "publicacao": "New York: W. W. Norton, 1950. 397 p. (LCCN 50010326). Capítulo \"Eight stages of man\"", "ano": "1950", "edicao_brasileira": "Infância e sociedade. Rio de Janeiro: Zahar, 1971, 404 p", "url": "https://dedalus.usp.br/F/?func=direct&doc_number=000063334&local_base=USP01", "conferido_em": "2026-10-05"}}, {"id": "trabalhos-a-fazer", "nome": "Trabalhos a fazer (jobs to be done)", "o_que_e": "A pessoa \"contrata\" um produto para fazer um progresso numa situação concreta da vida dela. A situação explica a compra melhor do que idade, renda ou cargo.", "como_usamos": "No bloco de trabalhos a fazer da ficha Pro, cada trabalho vem escrito como situação mais progresso desejado, e com o que a persona usa hoje no lugar da oferta. Os trabalhos alimentam as expectativas em três esferas e o canvas de proposta de valor.", "limite": "Teoria de gestão apresentada com casos de empresa; o caso do milk-shake ilustra e o livro não traz estudo com amostra. O conceito diz o que perguntar e como ler a resposta; ele não mede quantas pessoas têm o mesmo trabalho.", "referencia": {"autores": "Clayton M. Christensen, Taddy Hall, Karen Dillon e David S. Duncan", "titulo": "Competing Against Luck: The Story of Innovation and Customer Choice", "publicacao": "New York: HarperBusiness (HarperCollins), 2016. xix, 262 p. LCCN 2017304992", "ano": "2016", "edicao_brasileira": "Muito além da sorte: processos inovadores para entender o que os clientes querem. Tradução de Beth Honorato. Porto Alegre: Bookman (Grupo A), 2018, 264 p", "url": "https://loja.grupoa.com.br/muito-alem-da-sorte-p991547", "conferido_em": "2026-10-05"}}, {"id": "mapa-de-empatia", "nome": "Mapa de empatia", "o_que_e": "Um quadro que ajuda a equipe a se colocar no lugar da pessoa: o que ela vê, ouve, diz, faz, pensa e sente diante de uma situação. A versão de 2017 começa pela meta: quem é a pessoa e o que ela precisa fazer.", "como_usamos": "Na ficha, o mapa tem seis quadros em volta do retrato: pensa e sente, ouve, vê, fala e faz, dores e ganhos. Tudo hipótese até a entrevista.", "limite": "Ferramenta de oficina para organizar o que a equipe sabe e o que falta saber. O próprio site pede que o mapa seja revisado por outras pessoas e que ninguém ponha palavras na boca da pessoa (\"Don't put your words into their mouth\"). O mapa sem entrevista é hipótese.", "referencia": {"autores": "Dave Gray, Sunni Brown e James Macanufo", "titulo": "Gamestorming: A Playbook for Innovators, Rulebreakers, and Changemakers", "publicacao": "Sebastopol (CA): O'Reilly, 2010. xvii, 266 p. ISBN 9780596804176", "ano": "2010", "edicao_brasileira": "Gamestorming: jogos corporativos para mudar, inovar e quebrar regras. Tradução de Luciane Camargo. Rio de Janeiro: Alta Books, 2012, 264 p", "url": null, "conferido_em": "2026-10-05"}}, {"id": "canvas-proposta-de-valor", "nome": "Canvas de proposta de valor", "o_que_e": "Um quadro com dois lados. De um lado, o cliente: as tarefas que quer cumprir, as dores que encontra e os ganhos que busca. Do outro, a oferta: o que você vende, que dores alivia e que ganhos cria. O encaixe entre os dois lados é a proposta de valor.", "como_usamos": "O lado do cliente sai da persona (trabalhos a fazer, dores e ganhos). O lado da oferta fica fora da persona, num bloco próprio de encaixe, com o que faria a pessoa não comprar. Cada encaixe aparece como afirmação a testar com clientes.", "limite": "O canvas organiza hipóteses sobre o encaixe; a própria Strategyzer escreve que o encaixe é uma afirmação até o cliente confirmar. Ele não diz quantas pessoas têm aquela dor nem quanto pagariam.", "referencia": {"autores": "Alexander Osterwalder, Yves Pigneur, Gregory Bernarda e Alan Smith (design de Trish Papadakos)", "titulo": "Value Proposition Design: How to Create Products and Services Customers Want", "publicacao": "Hoboken (NJ): John Wiley & Sons, 2014. xxv, 290 p. ISBN 9781118968055", "ano": "2014", "edicao_brasileira": "Value proposition design: como construir propostas de valor inovadoras. São Paulo: HSM do Brasil, 2014, 302 p", "url": null, "conferido_em": "2026-10-05"}}, {"id": "jornada-do-cliente", "nome": "Jornada do cliente", "o_que_e": "O caminho que a pessoa percorre antes, durante e depois da compra, com todos os pontos em que ela encontra a marca, os parceiros, outras pessoas e a si mesma. A experiência é a soma desses encontros ao longo do tempo.", "como_usamos": "Na ficha, a jornada tem cinco ou seis etapas, do momento em que a necessidade aparece até a indicação, com o que a pessoa faz, pensa, o canal, a emoção (hipótese) e a oportunidade de cada etapa. As etapas cobrem os três estágios do artigo: antes, durante e depois da compra.", "limite": "Artigo de revisão: reúne definições e o que se sabe sobre experiência e jornada e aponta o que falta pesquisar, segundo o resumo. Não traz medida pronta para uma persona. A jornada desenhada na ficha é hipótese até ser observada em entrevista ou em dado de uso.", "referencia": {"autores": "Katherine N. Lemon e Peter C. Verhoef", "titulo": "Understanding Customer Experience Throughout the Customer Journey", "publicacao": "Journal of Marketing, v. 80, n. 6, p. 69-96, novembro de 2016. DOI 10.1509/jm.15.0420", "ano": "2016", "edicao_brasileira": null, "url": "https://doi.org/10.1509/jm.15.0420", "conferido_em": "2026-10-05"}}, {"id": "dores-duas-profundidades", "nome": "Dores em duas profundidades", "o_que_e": "Cada dor é escrita em duas camadas. Na superfície fica o que a pessoa diz e mostra, como pressa, frustração ou insegurança. No fundo fica o que ela custa a dizer, como medo de ficar para trás ou solidão, e que explica por que a superfície dói.", "como_usamos": "Na ficha, as dores aparecem em duas camadas, superfície e fundo, e uma frase de raiz fecha o bloco quando existe. Sem entrevista, as duas camadas são hipótese e não recebem nota de intensidade.", "limite": "Modelo de organização da equipe, sem teste publicado. A camada de fundo é inferência; sem entrevista, fica como hipótese. A onda dos pôsteres antigos não tinha unidade, e a ficha não usa escala de intensidade sem medida.", "referencia": {"autores": "Modelo da equipe", "titulo": "Estrutura das dores (superficiais e profundas) nos pôsteres de persona e no quadro de trabalho da equipe", "publicacao": "Material interno, lido em 2026-10-02 e registrado em metodo-v3/leitura-exemplos.md e metodo-v3/leitura-miro.md", "ano": "sem data", "edicao_brasileira": null, "url": null, "conferido_em": "2026-10-02"}}, {"id": "expectativas-tres-esferas", "nome": "Expectativas em três esferas", "o_que_e": "O que a pessoa espera do produto, escrito em três esferas da vida: para si (pessoal), no trabalho (profissional) e diante dos outros (social). A mesma compra costuma atender as três de jeitos diferentes.", "como_usamos": "Na ficha, as três esferas (para a pessoa, no trabalho e com os outros) vêm preenchidas como hipótese, com aviso, até haver entrevista.", "limite": "Modelo de organização, sem teste publicado. Não mede a força de cada expectativa nem qual pesa mais na compra; isso sai de entrevista ou de pesquisa com amostra.", "referencia": {"autores": "Modelo da equipe", "titulo": "Expectativas com o curso nos pôsteres de persona da equipe", "publicacao": "Material interno, lido em 2026-10-02 e registrado em metodo-v3/leitura-exemplos.md", "ano": "sem data", "edicao_brasileira": null, "url": null, "conferido_em": "2026-10-02"}}, {"id": "experiencia-vivida-inflacao", "nome": "Experiência vivida e inflação", "o_que_e": "A inflação que a pessoa viveu pesa no que ela espera dos preços daqui para a frente. No mais jovem, o que aconteceu há pouco pesa mais, porque ocupa uma parte maior da vida dele.", "como_usamos": "Na linha da vida da ficha Pro, cruzamos o ano de nascimento da persona com os fatos de época já conferidos (planos econômicos, troca de moeda, anos de inflação alta) e mostramos a idade que ela tinha em cada um. A marca possível (preferir parcela fixa, desconfiar de reajuste) entra como hipótese para a entrevista.", "limite": "Estudo com dados dos Estados Unidos, sobre expectativa de inflação e, em parte, crédito e escolha de hipoteca. Aplicar ao Brasil das trocas de moeda é extrapolação nossa. A marca na persona é hipótese até a entrevista.", "referencia": {"autores": "Ulrike Malmendier e Stefan Nagel", "titulo": "Learning from Inflation Experiences", "publicacao": "The Quarterly Journal of Economics, v. 131, n. 1, p. 53-87, fevereiro de 2016 (online em outubro de 2015). Oxford University Press. DOI 10.1093/qje/qjv037", "ano": "2016", "edicao_brasileira": null, "url": "https://doi.org/10.1093/qje/qjv037", "conferido_em": "2026-10-05"}}, {"id": "geracoes-mannheim", "nome": "Gerações (Mannheim)", "o_que_e": "Nascer na mesma época não basta para formar uma geração. Pesa viver os mesmos acontecimentos numa idade parecida e dar a eles um sentido parecido.", "como_usamos": "Na linha da vida da ficha Pro, os acontecimentos de época aparecem com a idade da persona em cada um. A ficha evita rótulo de geração sem prova (millennial, geração Z) e pede, na entrevista, os acontecimentos que a pessoa cita como marcantes.", "limite": "Ensaio teórico de 1928, sem dados. Ele não diz quais acontecimentos marcaram a persona; isso sai de fato de época datado e de entrevista. Rótulo de geração usado em marketing (millennial, geração Z) fica fora do conceito.", "referencia": {"autores": "Karl Mannheim", "titulo": "Das Problem der Generationen", "publicacao": "Kölner Vierteljahrshefte für Soziologie, v. 7, 1928, p. 157-185 e 309-330. Versão inglesa: \"The Problem of Generations\", em Essays on the Sociology of Knowledge, London, Routledge & Kegan Paul, 1952", "ano": "1928", "edicao_brasileira": "\"O problema das gerações\", em Marialice M. Foracchi (org.), Karl Mannheim: sociologia. São Paulo: Ática, 1982, 215 p. (Coleção Grandes Cientistas Sociais, v. 25). Segundo Weller (2010), tradução feita da versão inglesa e reduzida", "url": "https://www.1000dokumente.de/Dokumente/Karl_Mannheim,_''Das_Problem_der_Generationen''", "conferido_em": "2026-10-05"}}, {"id": "linha-da-vida", "nome": "Linha da vida em fases", "o_que_e": "A história da persona contada ano a ano, do nascimento até hoje e um pouco adiante, com o que acontecia no país e no mundo em cada idade. Ajuda a entender de onde vêm os hábitos e os medos que ela traz para a compra.", "como_usamos": "Na ficha, a linha do tempo junta três tipos de marco: vida (hipótese), fato de época com fonte e horizonte até 2030 (hipótese). A faixa de formação e trabalho mostra os mesmos anos em barras.", "limite": "Modelo de organização da equipe, sem teste publicado. A linha da vida junta fato datado e ficção; o selo de cada marco diz qual é qual. Ela ajuda a formular perguntas de entrevista e não prova que a persona viveu os fatos do jeito descrito.", "referencia": {"autores": "Modelo da equipe", "titulo": "Framework Alpha (LTC): grade da vida em 4 fases e 16 etapas", "publicacao": "Material interno, quadro de trabalho no Miro, lido em 2026-10-02 e registrado em metodo-v3/leitura-miro.md", "ano": "sem data", "edicao_brasileira": null, "url": null, "conferido_em": "2026-10-02"}}, {"id": "espelhos", "nome": "Espelhos (grupo de referência)", "o_que_e": "As pessoas com quem a persona se compara hoje e as pessoas que ela quer ser. A gente se mede pelo grupo que toma como régua, inclusive um grupo de que ainda não faz parte e já começa a imitar.", "como_usamos": "No bloco de espelhos da ficha Pro, duas colunas: comparação (com quem ela se mede hoje) e aspiração (quem ela quer ser daqui a alguns anos). Cada espelho é um perfil fictício descrito por cargo, idade e rotina, nunca uma pessoa real. Pergunta de entrevista: com quem você se compara, e quem você quer ser daqui a cinco anos?", "limite": "Sociologia apoiada em dados de soldados dos Estados Unidos na Segunda Guerra (The American Soldier). A lente não diz quem é o grupo de referência da persona; isso sai de entrevista e de quem ela segue.", "referencia": {"autores": "Robert K. Merton (com Alice S. Rossi no capítulo de 1950)", "titulo": "Social Theory and Social Structure", "publicacao": "Glencoe: The Free Press, 1949; edição revista de 1957, que traz os dois capítulos sobre grupo de referência; edição ampliada de 1968 (New York: Free Press, LCCN 68028789)", "ano": "1957", "edicao_brasileira": "Sociologia: teoria e estrutura. Tradução de Miguel Maillet. São Paulo: Mestre Jou, 1968, 758 p", "url": "https://dedalus.usp.br/F/?func=direct&doc_number=000440979&local_base=USP01", "conferido_em": "2026-10-05"}}, {"id": "canais-e-confianca", "nome": "Canais e confiança", "o_que_e": "Onde a pessoa se informa, por onde compra e em quem confia antes de decidir. Mostra por onde a mensagem chega e quem pode falar por você.", "como_usamos": "Na ficha, cada canal aparece numa matriz de quanto a pessoa usa e quanto confia, de 1 a 5, como hipótese. Quando um canal tem dado público, a fonte aparece abaixo da matriz.", "limite": "O dado de canal descreve o grupo, e a persona herda a média do grupo. Confiança em pessoa ou marca específica raramente tem dado público; sem entrevista, fica como hipótese.", "referencia": {"autores": "Modelo da equipe", "titulo": "Poder de influência e comportamento de consumo nos pôsteres de persona da equipe", "publicacao": "Material interno, lido em 2026-10-02 e registrado em metodo-v3/leitura-exemplos.md e metodo-v3/dados.js", "ano": "sem data", "edicao_brasileira": null, "url": null, "conferido_em": "2026-10-02"}}], "arquetipos": [{"nome_pt": "Inocente", "grupo": "Independência e satisfação", "desejo": "Viver num lugar seguro e feliz, como um paraíso.", "medo": "Errar e ser castigado por isso."}, {"nome_pt": "Explorador", "grupo": "Independência e satisfação", "desejo": "Ter liberdade para descobrir quem é, explorando o mundo.", "medo": "Ficar preso, se acomodar e sentir vazio por dentro."}, {"nome_pt": "Sábio", "grupo": "Independência e satisfação", "desejo": "Descobrir a verdade.", "medo": "Ser enganado ou ficar na ignorância."}, {"nome_pt": "Herói", "grupo": "Risco e maestria", "desejo": "Provar o próprio valor com uma ação corajosa e difícil.", "medo": "Parecer fraco, vulnerável ou covarde."}, {"nome_pt": "Fora-da-lei", "grupo": "Risco e maestria", "desejo": "Virar o jogo, por revanche ou por revolução.", "medo": "Ficar sem poder e ser tratado como irrelevante."}, {"nome_pt": "Mago", "grupo": "Risco e maestria", "desejo": "Conhecer as leis de fundo que fazem o mundo funcionar.", "medo": "Provocar efeitos ruins que não previu."}, {"nome_pt": "Cara Comum", "grupo": "Pertença e prazer", "desejo": "Estar ligado aos outros e fazer parte.", "medo": "Se destacar, parecer metido e acabar rejeitado."}, {"nome_pt": "Amante", "grupo": "Pertença e prazer", "desejo": "Ter intimidade e prazer dos sentidos.", "medo": "Ficar sozinho, sem ser querido."}, {"nome_pt": "Bobo da Corte", "grupo": "Pertença e prazer", "desejo": "Viver o momento e aproveitar.", "medo": "O tédio, ou ser chato."}, {"nome_pt": "Prestativo", "grupo": "Estabilidade e controle", "desejo": "Proteger as pessoas de qualquer dano.", "medo": "Egoísmo e ingratidão."}, {"nome_pt": "Criador", "grupo": "Estabilidade e controle", "desejo": "Criar algo de valor que dure.", "medo": "Ter uma visão ou uma execução medíocre."}, {"nome_pt": "Governante", "grupo": "Estabilidade e controle", "desejo": "Ter o controle.", "medo": "O caos, ou ser derrubado."}], "consultora": {"nome": "Consultora", "foto": {"arquivo": "img/consultora.jpg", "alt": "Retrato de uma consultora, gerado por inteligência artificial (IA); não é uma pessoa real"}}}</script>
<script>
(function () {
  "use strict";
  document.documentElement.lang = "pt-BR";
  const D = JSON.parse(document.getElementById("dados").textContent);
  const ORDEM = D.ordem;
  const F = D.fichas;
  const PROD = D.produtos;
  const CONC = {};
  (D.conceitos || []).forEach((c) => { CONC[c.id] = c; });

  /* ---------- utilidades ---------- */
  const esc = (t) => String(t == null ? "" : t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const arr = (x) => (Array.isArray(x) ? x : []);
  const prim = (n) => String(n || "").split(" ")[0];
  const semAc = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const ele = (f) => (f && f.pronome) || "ela";
  const dele = (f) => (ele(f) === "ele" ? "dele" : "dela");
  const num = (v, d) => { const n = Number(v); return Number.isFinite(n) ? n : d; };
  const ARQ_EL = {};
  arr(D.arquetipos).forEach((a) => { ARQ_EL[semAc(a.nome_pt)] = a; });
  const fmt = (v) => { const n = Number(v); return Number.isFinite(n) ? n.toLocaleString("pt-BR", { maximumFractionDigits: 2 }) : esc(v); };

  function foto(f, cls, extra, decorativa) {
    const src = f && f.foto && f.foto.arquivo;
    const alt = decorativa ? "" : ((f && f.foto && f.foto.alt) || ("Foto de " + prim(f && f.nome)));
    return `<div class="foto ${cls || ""}">${src ? `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy">` : `<span class="foto__vazia">foto em geração</span>`}${extra || ""}</div>`;
  }
  function fonteA(nome, url) {
    if (!nome) return "";
    return url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(nome)} ↗<span class="sr"> (abre em nova aba)</span></a>` : esc(nome);
  }
  function fontesDe(xs) {
    const vistos = new Set();
    const ls = arr(xs).filter((s) => s && s.fonte).filter((s) => { const k = s.fonte + "|" + (s.url || ""); if (vistos.has(k)) return false; vistos.add(k); return true; });
    return ls.length ? `<span class="miudo" style="display:block;margin-top:6px">${ls.length > 1 ? "Fontes" : "Fonte"}: ${ls.map((s) => fonteA(s.fonte, s.url)).join(" · ")}</span>` : "";
  }
  function conceito(ids, titulo) {
    const lista = arr(ids).map((i) => CONC[i]).filter(Boolean);
    if (!lista.length) return "";
    return `<details class="conceito"><summary>Sobre o conceito<span class="sr"> de ${esc(titulo || "")}</span></summary><div class="conceito__corpo">${lista.map((c) => {
      const r = c.referencia || {};
      const ref = [r.autores, r.titulo, r.publicacao, r.ano].filter(Boolean).join(". ");
      return `<p><b>${esc(c.nome)}.</b> ${esc(c.o_que_e)} ${c.como_usamos ? esc(c.como_usamos) : ""}</p>${c.limite ? `<p class="miudo">Limite: ${esc(c.limite)}</p>` : ""}<p class="miudo">${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(ref)} ↗</a>` : esc(ref)}${r.edicao_brasileira ? ` · Edição brasileira: ${esc(typeof r.edicao_brasileira === "string" ? r.edicao_brasileira : [r.edicao_brasileira.titulo, r.edicao_brasileira.editora, r.edicao_brasileira.ano].filter(Boolean).join(", "))}` : ""}</p>`;
    }).join("")}</div></details>`;
  }

  /* ---------- estado ---------- */
  const E = { tela: "inicio", id: null, passo: 0, modo: "pro", respostas: {}, objetivo: {}, conversa: {}, teste: {}, timers: [] };
  ORDEM.forEach((k) => {
    E.respostas[k] = arr(PROD[k].respostas).slice();
    E.objetivo[k] = PROD[k].respostas[4];
    E.conversa[k] = [];
    E.teste[k] = { texto: (F[k].teste && F[k].teste.texto) || "", feito: false };
  });
  try { const m = localStorage.getItem("pp-modo"); if (m === "free" || m === "pro") E.modo = m; } catch (e) {}

  const app = document.getElementById("app");
  function limpar() { E.timers.forEach(clearTimeout); E.timers = []; }
  function ir(tela, extra, ancora) {
    limpar();
    Object.assign(E, { tela }, extra || {});
    render();
    if (ancora) { const el = document.getElementById(ancora); if (el) { el.scrollIntoView(); return; } }
    window.scrollTo(0, 0);
    app.focus({ preventScroll: true });
  }
  let toastT;
  function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("ver"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("ver"), 2800); }
  function marcarModo() { document.querySelectorAll("[data-modo]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.modo === E.modo))); }

  /* ---------- gráficos ---------- */
  const COR = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)"];
  function grafico(g) {
    const h = graficoCorpo(g);
    return h && g.nota ? h + `<p class="miudo" style="margin-top:4px">${esc(g.nota)}</p>` : h;
  }
  function graficoCorpo(g) {
    if (!g || !arr(g.serie).length) return "";
    const s = g.serie.filter((x) => Number.isFinite(Number(x.valor)));
    if (!s.length) return "";
    const un = g.unidade ? " " + esc(g.unidade) : "";
    if (g.tipo === "rosca" && s.length <= 5) {
      const tot = s.reduce((a, b) => a + Number(b.valor), 0) || 1;
      let ang = -Math.PI / 2; const R = 46, r = 28, cx = 60, cy = 60;
      const arcos = s.map((x, i) => {
        const fr = Number(x.valor) / tot, a2 = ang + fr * Math.PI * 2;
        const gap = s.length > 1 ? Math.min(0.025, fr * Math.PI * 0.4) : 0;
        const a0 = ang + gap, a1 = a2 - gap, big = a1 - a0 > Math.PI ? 1 : 0;
        const p = (rr, a) => [cx + rr * Math.cos(a), cy + rr * Math.sin(a)].map((n) => n.toFixed(2)).join(" ");
        const d = fr >= 0.999 ? `M ${cx} ${cy - R} A ${R} ${R} 0 1 1 ${cx - 0.01} ${cy - R} L ${cx - 0.01} ${cy - r} A ${r} ${r} 0 1 0 ${cx} ${cy - r} Z` : `M ${p(R, a0)} A ${R} ${R} 0 ${big} 1 ${p(R, a1)} L ${p(r, a1)} A ${r} ${r} 0 ${big} 0 ${p(r, a0)} Z`;
        ang = a2;
        return `<path d="${d}" style="fill:${COR[i % 5]}"><title>${esc(x.rotulo)}: ${fmt(x.valor)}${un}</title></path>`;
      }).join("");
      return `<div class="grafico" style="display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center"><svg viewBox="0 0 120 120" role="img" aria-label="${esc(s.map((x) => x.rotulo + ": " + fmt(x.valor) + (g.unidade ? " " + g.unidade : "")).join("; "))}">${arcos}</svg><ul style="list-style:none;display:grid;gap:4px;font-size:13px">${s.map((x, i) => `<li><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${COR[i % 5]};margin-right:6px"></span>${esc(x.rotulo)}: <b>${fmt(x.valor)}${un}</b></li>`).join("")}</ul></div>`;
    }
    if (g.tipo === "pictograma") {
      const v = Math.max(0, Math.min(100, Number(s[0].valor)));
      const cheios = Math.round(v / 10);
      const pts = Array.from({ length: 10 }, (_, i) => `<rect x="${i * 22 + 1}" y="1" width="18" height="18" rx="5" style="fill:${i < cheios ? "var(--c3)" : "var(--surface-3)"}"/>`).join("");
      return `<div class="grafico"><svg viewBox="0 0 220 20" role="img" aria-label="${esc(s[0].rotulo)}: ${fmt(v)}%">${pts}</svg><p class="miudo" style="margin-top:4px">${esc(s[0].rotulo)}: ${fmt(v)}${un || "%"} (cada quadrado, 10%)</p></div>`;
    }
    const max = Math.max(...s.map((x) => Number(x.valor))) || 1;
    const h = 24, W = 300, lab = 0;
    const rotMax = Math.max(...s.map((x) => (fmt(x.valor) + un).length)) * 6.8 + 10;
    const linhas = s.map((x, i) => {
      const w = Math.max(3, (Number(x.valor) / max) * (W - rotMax));
      return `<text x="0" y="${i * (h + 16) + 11}" style="fill:var(--ink-2);font-size:12px">${esc(x.rotulo)}</text>
        <rect x="${lab}" y="${i * (h + 16) + 16}" width="${w.toFixed(1)}" height="${h - 10}" rx="4" style="fill:${COR[i % 5]}"><title>${esc(x.rotulo)}: ${fmt(x.valor)}${un}</title></rect>
        <text x="${(lab + w + 6).toFixed(1)}" y="${i * (h + 16) + 27}" style="fill:var(--ink);font-size:12px;font-weight:700">${fmt(x.valor)}${un}</text>`;
    }).join("");
    return `<div class="grafico"><svg viewBox="0 0 ${W} ${s.length * (h + 16)}" role="img" aria-label="${esc(s.map((x) => x.rotulo + ": " + fmt(x.valor) + (g.unidade ? " " + g.unidade : "")).join("; "))}">${linhas}</svg></div>`;
  }

  function faixaDaVida(f) {
    const ini = num(f.nascimento, 1980), fim = 2030;
    const W = 800, padL = 78, padR = 34, FS = 14, LH = 32;
    const x = (a) => padL + ((num(a, ini) - ini) / (fim - ini)) * (W - padL - padR);
    const linhas = [["Formação", arr(f.formacao), "var(--c1)"], ["Trabalho", arr(f.trajetoria), "var(--c2)"]];
    let y = 34, corpo = "";
    linhas.forEach(([rot, itens, cor]) => {
      corpo += `<text x="0" y="${y + 20}" style="fill:var(--ink-3);font-size:${FS}px;font-weight:700">${rot}</text>`;
      itens.forEach((it, i) => {
        const de = num(it.de, ini), ate = it.ate === null || it.ate === "" || it.ate === undefined || /atual|hoje/i.test(String(it.ate)) ? 2026 : num(it.ate, 2026);
        const x0 = x(de), x1 = Math.max(x0 + 6, x(ate + (ate === de ? 0.6 : 0)));
        const yy = y + i * LH;
        const futuro = de > 2026;
        corpo += `<rect x="${x0.toFixed(1)}" y="${yy + 5}" width="${(x1 - x0).toFixed(1)}" height="22" rx="5" style="fill:${futuro ? "var(--surface)" : cor};stroke:${cor};stroke-width:2;stroke-dasharray:${futuro ? "5 4" : "0"}"><title>${esc(it.titulo)} (${de} a ${esc(it.ate || "hoje")})${futuro ? ", horizonte" : ""}</title></rect>`;
        const texto = esc(String(it.titulo || "").slice(0, 42));
        const larg = texto.length * FS * 0.56 + 10;
        let tx, anc = "start", fill = "var(--ink-2)";
        if (x1 + 6 + larg < W) { tx = x1 + 6; }
        else { tx = x0 - 6; anc = "end"; }
        corpo += `<text x="${tx.toFixed(1)}" y="${yy + 21}" text-anchor="${anc}" style="fill:${fill};font-size:${FS - 1}px;font-weight:600">${texto}</text>`;
      });
      y += Math.max(1, itens.length) * LH + 12;
    });
    const anos = [];
    for (let a = Math.ceil(ini / 5) * 5; a <= fim; a += 5) anos.push(a);
    const eixo = anos.map((a) => `<line x1="${x(a).toFixed(1)}" x2="${x(a).toFixed(1)}" y1="22" y2="${y}" style="stroke:var(--line)"/><text x="${x(a).toFixed(1)}" y="14" text-anchor="middle" style="fill:var(--ink-3);font-size:${FS - 1}px">${a}</text>`).join("");
    const hoje = `<line x1="${x(2026).toFixed(1)}" x2="${x(2026).toFixed(1)}" y1="20" y2="${y + 4}" style="stroke:var(--sun);stroke-width:2"/>`;
    const fatos = arr(f.linha_do_tempo).filter((t) => t.tipo === "fato").map((t) => `<circle cx="${x(t.ano).toFixed(1)}" cy="${y + 14}" r="6" style="fill:var(--c1)"><title>${esc(t.ano)}: ${esc(t.titulo)}</title></circle>`).join("");
    const H = y + 30;
    return `<div class="vida-faixa"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Formação e trabalho ao longo dos anos; os mesmos itens estão nas tabelas abaixo">${eixo}${corpo}${hoje}<text x="0" y="${y + 19}" style="fill:var(--ink-3);font-size:${FS}px;font-weight:700">Fatos</text>${fatos}</svg></div>
    <p class="legenda"><span><i style="background:var(--c1)"></i>Formação</span><span><i style="background:var(--c2)"></i>Trabalho</span><span><i style="background:var(--c1);border-radius:50%"></i>Fato de época</span><span><i style="background:var(--sun)"></i>Hoje</span><span><i style="border:2px dashed var(--c1)"></i>Horizonte</span><span>Tudo hipótese, menos os fatos de época.</span></p>`;
  }

  const ARQS = [
    ["Inocente", 0], ["Explorador", 0], ["Sábio", 0],
    ["Herói", 1], ["Fora-da-lei", 1], ["Mago", 1],
    ["Cara comum", 2], ["Amante", 2], ["Bobo da corte", 2],
    ["Prestativo", 3], ["Criador", 3], ["Governante", 3]
  ];
  const GRUPOS = [["Independência e satisfação", "var(--c4)"], ["Risco e maestria", "var(--c5)"], ["Pertença e prazer", "var(--c2)"], ["Estabilidade e controle", "var(--c1)"]];
  const SIN = { "cara comum": "cara comum", "comum": "cara comum", "homem comum": "cara comum", "pessoa comum": "cara comum", "rebelde": "fora-da-lei", "fora-da-lei": "fora-da-lei", "fora da lei": "fora-da-lei", "bobo": "bobo da corte", "bobo da corte": "bobo da corte", "prestativo": "prestativo", "prestativa": "prestativo", "cuidador": "prestativo", "cuidadora": "prestativo", "governante": "governante", "soberano": "governante", "governanta": "governante", "heroi": "heroi", "heroina": "heroi", "sabio": "sabio", "sabia": "sabio", "exploradora": "explorador", "explorador": "explorador", "inocente": "inocente", "mago": "mago", "maga": "mago", "amante": "amante", "criador": "criador", "criadora": "criador" };
  function idxArq(nome) {
    let n = semAc(nome).replace(/^o |^a /, "").trim();
    n = SIN[n] || n;
    return ARQS.findIndex(([a]) => semAc(a) === n || semAc(a).startsWith(n) || n.startsWith(semAc(a)));
  }
  function rodaArquetipos(a) {
    const ip = idxArq(a && a.principal && a.principal.nome), is = idxArq(a && a.secundario && a.secundario.nome), ish = idxArq(a && a.sombra && a.sombra.nome);
    const cx = 180, cy = 180, R = 150, r = 58;
    let s = `<defs><pattern id="hach" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" style="fill:var(--surface)"/><line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--ink-3);stroke-width:2"/></pattern></defs>`;
    ARQS.forEach(([nome, g], i) => {
      const a0 = -Math.PI / 2 + (i * Math.PI) / 6 + 0.012, a1 = -Math.PI / 2 + ((i + 1) * Math.PI) / 6 - 0.012;
      const P = (rr, a) => `${(cx + rr * Math.cos(a)).toFixed(1)} ${(cy + rr * Math.sin(a)).toFixed(1)}`;
      const destaque = i === ip ? 0.62 : i === is ? 0.34 : 0.12;
      const fill = i === ish ? "url(#hach)" : GRUPOS[g][1];
      s += `<path d="M ${P(r, a0)} L ${P(R, a0)} A ${R} ${R} 0 0 1 ${P(R, a1)} L ${P(r, a1)} A ${r} ${r} 0 0 0 ${P(r, a0)} Z" style="fill:${fill};fill-opacity:${i === ish ? 1 : destaque};stroke:${i === ip ? "var(--ink)" : "none"};stroke-width:2"><title>${nome}</title></path>`;
      const am = (a0 + a1) / 2, tr = (R + r) / 2 + 6;
      const tx = cx + tr * Math.cos(am), ty = cy + tr * Math.sin(am);
      let rot = (am * 180) / Math.PI; if (rot > 90 || rot < -90) rot += 180;
      const forte = i === ip || i === is;
      s += `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" transform="rotate(${rot.toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)})" style="font-size:${nome.length > 10 ? 10.5 : 12}px;font-weight:${forte ? 800 : 600};fill:var(--ink)">${nome}</text>`;
    });
    s += `<circle cx="${cx}" cy="${cy}" r="${r - 6}" style="fill:var(--surface)"/>`;
    s += `<text x="${cx}" y="${cy - 6}" text-anchor="middle" style="font-size:11px;fill:var(--ink-3);font-weight:700">ARQUÉTIPO</text><text x="${cx}" y="${cy + 12}" text-anchor="middle" style="font-size:14px;fill:var(--ink);font-weight:800">${esc(ip > -1 ? ARQS[ip][0] : (a && a.principal && a.principal.nome) || "")}</text>`;
    return `<svg viewBox="0 0 360 360" role="img" aria-label="Roda dos 12 arquétipos com o principal em destaque">${s}</svg>`;
  }

  function curvaJornada(j) {
    const n = j.length; if (!n) return "";
    const W = 1000, H = 120, top = 18, bot = 100;
    const y = (e) => top + ((2 - Math.max(-2, Math.min(2, num(e, 0)))) / 4) * (bot - top);
    const x = (i) => (W / n) * (i + 0.5);
    const pts = j.map((e, i) => [x(i), y(e.emocao)]);
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const area = d + ` L ${pts[n - 1][0].toFixed(1)} ${bot} L ${pts[0][0].toFixed(1)} ${bot} Z`;
    const zero = y(0);
    const rotulos = ["muito mal", "mal", "neutro", "bem", "muito bem"];
    const pontos = pts.map((p, i) => { const e = num(j[i].emocao, 0); return `<span title="${esc(j[i].etapa)}: ${rotulos[e + 2] || ""}" style="position:absolute;left:${(p[0] / W) * 100}%;top:${p[1]}px;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:3px solid var(--surface);background:${e < 0 ? "var(--c5)" : e === 0 ? "var(--ink-3)" : "var(--c3)"}"></span><span class="miudo" style="position:absolute;left:${(p[0] / W) * 100}%;top:${p[1] + (e < 0 ? -30 : 12)}px;transform:translateX(-50%);white-space:nowrap">${rotulos[e + 2] || ""}</span>`; }).join("");
    return `<div style="position:relative;height:${H}px"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%" role="img" aria-label="Curva de emoção ao longo da jornada">
      <line x1="0" x2="${W}" y1="${zero.toFixed(1)}" y2="${zero.toFixed(1)}" style="stroke:var(--line);stroke-dasharray:4 4" vector-effect="non-scaling-stroke"/>
      <path d="${area}" style="fill:var(--c3);fill-opacity:.12"/>
      <path d="${d}" style="fill:none;stroke:var(--c3);stroke-width:3;stroke-linejoin:round" vector-effect="non-scaling-stroke"/>
    </svg>${pontos}</div>`;
  }

  function matrizCanais(c) {
    const W = 520, H = 400, L = 52, B = 48, T = 16, Rr = 16;
    const x = (v) => L + ((num(v, 1) - 1) / 4) * (W - L - Rr);
