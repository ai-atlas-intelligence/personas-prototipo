    const y = (v) => T + ((5 - num(v, 1)) / 4) * (H - T - B);
    const mx = x(3), my = y(3);
    let s = `<rect x="${L}" y="${T}" width="${W - L - Rr}" height="${H - T - B}" rx="10" style="fill:var(--surface-2)"/>`;
    s += `<rect x="${mx}" y="${T}" width="${W - Rr - mx}" height="${my - T}" rx="10" style="fill:var(--primary-soft)"/>`;
    s += `<line x1="${mx}" x2="${mx}" y1="${T}" y2="${H - B}" style="stroke:var(--line);stroke-width:2"/><line x1="${L}" x2="${W - Rr}" y1="${my}" y2="${my}" style="stroke:var(--line);stroke-width:2"/>`;
    const q = [["Fale por aqui", W - Rr - 10, T + 18, "end"], ["Confia, mas usa pouco", L + 10, T + 18, "start"], ["Usa, mas desconfia", W - Rr - 10, H - B - 10, "end"], ["Pouco peso", L + 10, H - B - 10, "start"]];
    s += q.map(([t, qx, qy, an]) => `<text x="${qx}" y="${qy}" text-anchor="${an}" style="font-size:12px;font-weight:700;fill:var(--ink-3);paint-order:stroke;stroke:var(--surface-2);stroke-width:5px;stroke-linejoin:round">${t}</text>`).join("");
    s += `<text x="${(L + W - Rr) / 2}" y="${H - 12}" text-anchor="middle" style="font-size:13px;fill:var(--ink-2);font-weight:600">Quanto usa →</text>`;
    s += `<text x="16" y="${(T + H - B) / 2}" text-anchor="middle" transform="rotate(-90 16 ${(T + H - B) / 2})" style="font-size:13px;fill:var(--ink-2);font-weight:600">Quanto confia →</text>`;
    const vistos = {};
    c.forEach((k, i) => {
      const kx = x(k.uso), ky = y(k.confianca), chave = k.uso + "-" + k.confianca;
      const dup = vistos[chave] = (vistos[chave] || 0) + 1;
      const ly = ky + (dup - 1) * 16;
      const esquerda = kx > W - 150;
      s += `<circle cx="${kx}" cy="${ky}" r="8" style="fill:${COR[i % 5]};stroke:var(--surface);stroke-width:2"><title>${esc(k.canal)}: uso ${k.uso}, confiança ${k.confianca}</title></circle>`;
      s += `<text x="${esquerda ? kx - 12 : kx + 12}" y="${ly + 4}" text-anchor="${esquerda ? "end" : "start"}" style="font-size:13px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round">${esc(k.canal)}</text>`;
    });
    return `<div class="matriz"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc("Matriz de canais, de 1 a 5, hipótese. " + c.map((k) => k.canal + ": uso " + k.uso + ", confiança " + k.confianca).join("; "))}">${s}</svg></div>`;
  }

    if (d.modo) {

      const y = window.scrollY; render(); window.scrollTo(0, E.tela === "persona" ? y : 0);

      if (d.ir === "perguntas") return ir("perguntas", { passo: E.id ? 1 : 0 });
      return ir(d.ir, null, d.ancora);
    }
    if (d.ver) return ir("persona", { id: d.ver });
    if (d.escolher) return ir("perguntas", { id: d.escolher, passo: 1 });
    if (d.avancar) return E.passo >= PERGUNTAS.length ? ir("montando") : ir("perguntas", { passo: E.passo + 1 });
    if (d.voltar) return ir("perguntas", { passo: Math.max(0, E.passo - 1) });
    if (d.editar) return ir("perguntas", { passo: 1 });
    if (d.categoria) { PROD[E.id].categoria = d.categoria; app.querySelectorAll("[data-categoria]").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.categoria === d.categoria))); return; }
    if (d.objetivo) { E.objetivo[E.id] = d.objetivo; app.querySelectorAll("[data-objetivo]").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.objetivo === d.objetivo))); return; }
    if (d.perguntar) {
      const c = F[E.id].conversa[+d.perguntar]; const m = { q: c[0], a: "" };
      E.conversa[E.id].push(m); renderMantendo();
      E.timers.push(setTimeout(() => { m.a = c[1]; if (E.tela === "persona") renderMantendo(); }, 900));
      return;
    }
    if (d.testar) { E.teste[E.id].feito = true; renderMantendo(); return; }
    if (d.copiar) {
      const el = document.getElementById(d.copiar); const t = el ? el.textContent : "";
      try { navigator.clipboard.writeText(t).then(() => toast("Mensagem copiada."), () => selecionar(el)); } catch (e) { selecionar(el); }
      return;
    }
    if (d.toast) toast(d.toast);
  });
  function renderMantendo() { const y = window.scrollY; render(); window.scrollTo(0, y); }
  function selecionar(el) { if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Texto selecionado. Use Copiar do teclado."); }
  document.addEventListener("input", (ev) => {
    const t = ev.target;
    if (t.dataset.resposta !== undefined) E.respostas[E.id][+t.dataset.resposta] = t.value;
    if (t.dataset.teste) E.teste[E.id].texto = t.value;
  });
  function pelaAncora() {
    const h = (location.hash || "").replace("#", "");
    if (F[h]) { E.tela = "persona"; E.id = h; return true; }
    if (h === "planos" || h === "business" || h === "metodo") { E.tela = h; return true; }
    return false;
  }
  window.addEventListener("hashchange", () => { if (pelaAncora()) { limpar(); render(); window.scrollTo(0, 0); } });
  pelaAncora();
  render();
})();
</script>
