reajuste por escrito.", "Bolsa do Programa Universidade para Todos (Prouni). Pela renda que ela descreve, a casa caberia na bolsa integral (conta na linha do tempo, em 2005). E ela fez o ensino médio em escola pública. A pré-seleção é pela nota do Exame Nacional do Ensino Médio (Enem) (Lei 11.096, arts. 2º e 3º). Se ela fizer o Enem, o concorrente pode ser o curso de graça. Não sabemos se o curso oferece vagas do Prouni.", "Fundo de Financiamento Estudantil (Fies). Pela Lei 13.530, os contratos a partir de 2018 têm juro real zero. A dívida começa a ser paga no mês seguinte à formatura. Durante o curso, ela ainda paga todo mês os gastos operacionais do Fies. Se o financiamento não cobrir tudo, a parte que falta também sai do bolso dela, em boleto, a forma que ela evita desde 2023. Tira menos da casa agora, sem zerar. Pesa contra: é dívida, e a prestação depois da formatura acompanha a renda dela. E ela jurou nunca mais assinar sem saber o valor de cada parcela. A lei do Fies em vigor diz que ele vale para curso presencial ou a distância, com avaliação positiva no MEC (Lei 10.260, art. 1º, na redação de 2022). Não sabemos se o curso aceita Fies.", "Aula no celular. Não sabemos se a aula abre bem num Android intermediário, se baixa no Wi-Fi e quanto dado gasta. Vídeo longo que travava foi o que a fez parar em 2023.", "Certificado no meio do caminho. Ela quer algo para mostrar na loja antes da formatura. O produto não diz se há certificado ao fim do primeiro ano. Sem isso, o que ela tem para mostrar são as notas.", "Situação no Ministério da Educação (MEC). Não sabemos se o curso já tem reconhecimento. É a primeira coisa que a prima vai conferir.", "Promoção. Não há dado de que gerente de loja pese o diploma de tecnólogo na escolha de supervisora. Não prometa cargo nem salário."], "fontes": [{"afirmacao": "68,1% de desistência acumulada nos cursos a distância da rede privada, ciclo 2020 a 2024 (inclui quem faleceu)", "fonte": "Instituto Semesp, 16º Mapa do Ensino Superior no Brasil, 2026", "url": "https://www.semesp.org.br/mapa/edicao-16/brasil/", "trecho": "Taxa de Desistência Acumulada Percentual de ingressantes que desistiram do curso ou faleceram até o ano de referência [...] Na rede privada, por exemplo, o indicador aponta 64,7% de desistência no total (nos cursos EAD é ainda maior, 68,1%).", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-jessica.json (semesp-desistencia-ead-privada-2020-2024)", "lacuna": 0}, {"afirmacao": "Ao menos 10% do curso presencial e outros 10% presenciais ou síncronos mediados; dois anos para cumprir por inteiro", "fonte": "Planalto · Decreto nº 12.456, de 19 de maio de 2025, arts. 12 e 41", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/decreto/d12456.htm", "trecho": "Art. 12. Os cursos de graduação a distância deverão ofertar, observadas as Diretrizes Curriculares Nacionais e ato do Ministro de Estado da Educação, no mínimo: I - 10% (dez por cento) da carga horária total do curso por meio de atividades presenciais; e II - 10% (dez por cento) da carga horária total do curso em atividades presenciais ou síncronas mediadas. [...] Art. 41. As Instituições de Educação Superior credenciadas e os cursos autorizados deverão atender, de forma integral, as disposições deste Decreto e do ato do Ministro de Estado que o discipline, no prazo de dois anos, contado da data de publicação deste Decreto. Parágrafo único. Ato do Ministro de Estado da Educação disciplinará as regras de transição para a aplicação do disposto neste Decreto [...] Este texto não substitui o publicado no DOU de 20.5.2025.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-jessica.json (fato de 2025)"}, {"afirmacao": "Diploma sem o formato do curso", "fonte": "Planalto · Decreto nº 9.235, de 2017, art. 100, na redação do Decreto nº 12.456, de 2025", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/decreto/d12456.htm", "trecho": "Art. 40. O Decreto nº 9.235, de 15 dezembro de 2017, passa a vigorar com as seguintes alterações: [...] Art. 100. É vedada a identificação do formato de oferta do curso na emissão e no registro de diplomas.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-jessica.json (fato de 2025); lido no texto do Decreto 12.456, art. 40"}, {"afirmacao": "Bolsa integral do Prouni: renda de até 1,5 salário mínimo por pessoa, ensino médio em escola pública entre os critérios e pré-seleção pelo Enem", "fonte": "Planalto · Lei nº 11.096, de 13 de janeiro de 2005, arts. 1º, 2º e 3º", "url": "https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2005/lei/l11096.htm", "trecho": "§ 1º A bolsa de estudo integral será concedida a brasileiros não portadores de diploma de curso superior, cuja renda familiar mensal per capita não exceda o valor de até 1 (um) salário-mínimo e 1/2 (meio). [...] Art. 2º A bolsa será destinada: [...] a) o ensino médio completo em escola da rede pública; [...] Art. 3º O estudante a ser beneficiado pelo Prouni será pré-selecionado pelos resultados do Exame Nacional do Ensino Médio (Enem), observados o disposto no § 1º do art. 2º desta Lei e outros critérios estabelecidos pelo Ministério da Educação, e, na etapa final, será selecionado pela instituição privada de ensino superior, que poderá realizar processo seletivo próprio.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-jessica.json (fato de 2005); arts. 2º, I, a, e 3º na redação da Lei 14.350, de 2022"}, {"afirmacao": "Renda média de R$ 2.071 por mês de quem tem ensino médio completo em Recife (2º trimestre de 2026), base da conta dos 12,0%", "fonte": "IBGE, PNAD Contínua trimestral, tabela 5438 do SIDRA", "url": "https://apisidra.ibge.gov.br/values/t/5438/n6/2611606/n7/2601/v/5932,5940/p/202602/c1568/all?formato=json", "trecho": "\"V\":\"2071\",\"D1C\":\"2611606\",\"D1N\":\"Recife (PE)\",\"D2C\":\"5932\",\"D2N\":\"Rendimento médio mensal real das pessoas de 14 anos ou mais de idade ocupadas na semana de referência com rendimento de trabalho, habitualmente recebido no trabalho principal\",\"D3C\":\"202602\",\"D3N\":\"2º trimestre 2026\",\"D4C\":\"11630\",\"D4N\":\"Ensino médio completo ou equivalente\" [...] \"V\":\"2390\",\"D1C\":\"2611606\",\"D1N\":\"Recife (PE)\",\"D2C\":\"5932\",\"D2N\":\"Rendimento médio mensal real das pessoas de 14 anos ou mais de idade ocupadas na semana de referência com rendimento de trabalho, habitualmente recebido no trabalho principal\",\"D3C\":\"202602\",\"D3N\":\"2º trimestre 2026\",\"D4C\":\"11631\",\"D4N\":\"Ensino superior incompleto ou equivalente\" [...] \"V\":\"7313\",\"D1C\":\"2611606\",\"D1N\":\"Recife (PE)\",\"D2C\":\"5932\",\"D2N\":\"Rendimento médio mensal real das pessoas de 14 anos ou mais de idade ocupadas na semana de referência com rendimento de trabalho, habitualmente recebido no trabalho principal\",\"D3C\":\"202602\",\"D3N\":\"2º trimestre 2026\",\"D4C\":\"11632\",\"D4N\":\"Ensino superior completo ou equivalente\" [...] \"V\":\"4.8\",\"D1C\":\"2611606\",\"D1N\":\"Recife (PE)\",\"D2C\":\"5940\",\"D2N\":\"Coeficiente de variação - Rendimento médio mensal real das pessoas de 14 anos ou mais de idade ocupadas na semana de referência com rendimento de trabalho, habitualmente recebido no trabalho principal\",\"D3C\":\"202602\",\"D3N\":\"2º trimestre 2026\",\"D4C\":\"11630\",\"D4N\":\"Ensino médio completo ou equivalente\" [...] \"V\":\"6.8\",\"D1C\":\"2611606\",\"D1N\":\"Recife (PE)\",\"D2C\":\"5940\",\"D2N\":\"Coeficiente de variação - Rendimento médio mensal real das pessoas de 14 anos ou mais de idade ocupadas na semana de referência com rendimento de trabalho, habitualmente recebido no trabalho principal\",\"D3C\":\"202602\",\"D3N\":\"2º trimestre 2026\",\"D4C\":\"11632\",\"D4N\":\"Ensino superior completo ou equivalente\"", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-jessica.json (ibge-renda-por-escolaridade-recife-2026)"}, {"afirmacao": "Salário mínimo de R$ 1.621 em 2026, base da conta dos 15,4%", "fonte": "Planalto · Decreto nº 12.797, de 23 de dezembro de 2025", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/decreto/d12797.htm", "trecho": "Art. 1º A partir de 1º de janeiro de 2026, o valor do salário mínimo será de R$ 1.621,00 (mil seiscentos e vinte e um reais). Parágrafo único. Em decorrência do disposto no caput, o valor diário do salário mínimo corresponderá a R$ 54,04 (cinquenta e quatro reais e quatro centavos) e o valor horário, a R$ 7,37 (sete reais e trinta e sete centavos).", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-jessica.json (fato de 2026)"}, {"afirmacao": "Fies: juro real zero e dívida paga a partir do mês seguinte à conclusão, para contratos a partir de 2018. Durante o curso, gastos operacionais todo mês e, se o financiamento for parcial, a parte não financiada em boleto. Depois, prestação vinculada à renda", "fonte": "Planalto · Lei nº 13.530, de 7 de dezembro de 2017 (arts. 4º, § 14, e 5º-C, II, IV, VIII e § 1º, da Lei 10.260, na redação dada por ela)", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2017/lei/l13530.htm", "trecho": "§ 14. Para os financiamentos pelo Fies inferiores a 100% (cem por cento) dos encargos educacionais, a parcela não financiada será paga pelo estudante em boleto único ao agente financeiro [...] Os financiamentos concedidos a partir do primeiro semestre de 2018 observarão o seguinte: [...] II - taxa de juros real igual a zero, na forma definida pelo Conselho Monetário Nacional; [...] IV - o início do pagamento do financiamento no mês imediatamente subsequente ao da conclusão do curso [...] VIII - quitação do saldo devedor remanescente após a conclusão do curso, na forma do regulamento editado pelo Ministério da Educação e observado o que for aprovado pelo CG-Fies, em prestações mensais equivalentes ao maior valor entre o pagamento mínimo e o resultante da aplicação percentual mensal vinculada à renda ou aos proventos mensais brutos do estudante financiado pelo Fies [...] § 1º Ao longo do período de utilização do financiamento e do período de amortização, o estudante financiado pelo Fies é obrigado a pagar diretamente ao agente financeiro parcelas mensais referentes aos gastos operacionais com o Fies, na forma estabelecida em regulamento editado pelo Ministério da Educação, nos termos do que for aprovado pelo CG-Fies.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-jessica.json (fato de 2017, Novo Fies); art. 4º, § 14, e art. 5º-C, VIII e § 1º, lidos em 2026-10-05 no texto guardado (_coleta/jes-planalto-l13530-fies)"}, {"afirmacao": "Fies para cursos superiores presenciais ou a distância, com avaliação positiva no Ministério da Educação (redação de 2022)", "fonte": "Planalto · Lei nº 10.260, de 12 de julho de 2001, texto compilado, art. 1º (redação da Lei nº 14.375, de 2022)", "url": "https://www.planalto.gov.br/ccivil_03/leis/leis_2001/l10260compilado.htm", "trecho": "Art. 1º É instituído, nos termos desta Lei, o Fundo de Financiamento Estudantil (Fies), de natureza contábil, vinculado ao Ministério da Educação, destinado à concessão de financiamento a estudantes de cursos superiores, na modalidade presencial ou a distância, não gratuitos e com avaliação positiva nos processos conduzidos pelo Ministério, de acordo com regulamentação própria. (Redação dada pela Lei nº 14.375, de 2022)", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-jessica.json (normas_de_apoio, l10260-art1-fies-presencial-ou-distancia); texto compilado guardado às 12h50 (_coleta/jes-planalto-l10260-fies-compilado, HTTP 200)"}]}, "ideias": [{"tipo": "Produto", "titulo": "Alguém percebe no sétimo dia", "texto": "A sombra dela é sumir em silêncio, e o primeiro sinal é a semana sem entrar na plataforma, bem antes da mensalidade atrasada. Uma pessoa da tutoria chama no WhatsApp no sétimo dia sem acesso e refaz com ela o plano da semana. A receita está na permanência. A aluna que chega à formatura paga R$ 5.976 (conta: 24 × 249, sem reajuste). A que para no sexto mês paga R$ 1.494 (conta: 6 × 249).", "teste": "Uma turma com o alerta e outra sem, comparando o acesso no segundo mês."}, {"tipo": "Produto", "titulo": "Calendário do comércio", "texto": "Pelo decreto de 2025, um quinto do curso tem hora marcada: 10% presencial e outros 10% presenciais ou ao vivo (conta: 10% + 10%). As faculdades têm até maio de 2027 para cumprir. Ofereça cada encontro ao vivo em três horários: de manhã, no começo da tarde e à noite. Ela escolhe conforme a escala da semana. Provas no polo e prazos de entrega ficam fora das datas de pico do varejo, como Natal e Dia das Mães. Responde à escala que muda, uma das dores mais fortes dela.", "teste": "Num semestre, oferecer os encontros ao vivo em três horários a uma turma e em horário único a outra. Comparar a presença de quem trabalha em escala.", "fontes": [{"afirmacao": "Ao menos 10% do curso presencial e outros 10% presenciais ou síncronos mediados; dois anos para cumprir por inteiro", "fonte": "Planalto · Decreto nº 12.456, de 19 de maio de 2025, arts. 12 e 41", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/decreto/d12456.htm", "trecho": "Art. 12. Os cursos de graduação a distância deverão ofertar, observadas as Diretrizes Curriculares Nacionais e ato do Ministro de Estado da Educação, no mínimo: I - 10% (dez por cento) da carga horária total do curso por meio de atividades presenciais; e II - 10% (dez por cento) da carga horária total do curso em atividades presenciais ou síncronas mediadas. [...] Art. 41. As Instituições de Educação Superior credenciadas e os cursos autorizados deverão atender, de forma integral, as disposições deste Decreto e do ato do Ministro de Estado que o discipline, no prazo de dois anos, contado da data de publicação deste Decreto. Parágrafo único. Ato do Ministro de Estado da Educação disciplinará as regras de transição para a aplicação do disposto neste Decreto [...] Este texto não substitui o publicado no DOU de 20.5.2025.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-jessica.json (fato de 2025)"}]}, {"tipo": "Oferta", "titulo": "A conta inteira na primeira resposta", "texto": "Quando ela pergunta o preço no direct, a resposta traz R$ 249, a regra do reajuste, o total dos dois anos e o endereço do polo. Ela some quando lê \"a partir de\". Se der para travar o valor até a formatura, isso vira o argumento principal. Se não der, a regra escrita já separa o curso do anúncio de primeira mensalidade com desconto.", "teste": "Por 30 dias, responder metade dos directs com a conta inteira e metade só com o preço do mês. Comparar quantas conversas viram matrícula."}, {"tipo": "Oferta", "titulo": "Matrícula em dupla da mesma loja", "texto": "Duas colegas da mesma loja começam juntas, com benefício para as duas. Ataca a solidão que a fez parar em 2023 e põe para trabalhar, desde o primeiro dia, a indicação, o canal em que ela mais confia.", "teste": "Oferecer a matrícula em dupla em duas ou três lojas. No segundo mês, comparar o acesso de quem entrou em dupla com o de quem entrou sozinha."}, {"tipo": "Portfólio", "titulo": "Convênio com redes do varejo", "texto": "Uma versão para empresas: a rede de lojas paga parte da mensalidade ou combina a escala nos dias de prova. Ela mesma diz que, além do que der para cortar em casa, só com bolsa ou \"se a loja ajudar\". E a gerente já fala que diploma conta na promoção. A lei já tem uma via: no Fies-Empresa, a empresa é a tomadora do financiamento e responde pelos pagamentos (Lei 10.260, art. 5º-B). Pelo texto da lei, ela estudaria sem assinar dívida no próprio nome. O regulamento não foi lido, e não sabemos se essa modalidade está aberta hoje, nem o que a loja poderia cobrar dela em troca. A bolsa do Prouni é a alternativa de graça; o convênio é o que a loja pode somar. A gerente vira aliada, e uma loja traz várias alunas.", "teste": "Hipótese a testar: apresentar a proposta a duas ou três redes de calçados e moda do Recife. Contar quantas topam uma turma piloto.", "fontes": [{"afirmacao": "Fies-Empresa: a empresa contrata o financiamento da graduação de trabalhadores e responde pelos pagamentos", "fonte": "Planalto · Lei nº 10.260, de 12 de julho de 2001, texto compilado, art. 5º-B, caput e §§ 1º, 2º e 4º", "url": "https://www.planalto.gov.br/ccivil_03/leis/leis_2001/l10260compilado.htm", "trecho": "Art. 5o-B. O financiamento da educação profissional e tecnológica e de educação superior poderá ser contratado pelo estudante trabalhador, na modalidade Fies-Trabalhador, em caráter individual, ou por empresa, para custeio da formação profissional e tecnológica e de graduação superior de trabalhadores, na modalidade Fies-Empresa. (Redação dada pela Lei nº 13.530, de 2017) § 1o Na modalidade denominada Fies-Empresa, a empresa figurará como tomadora do financiamento, responsabilizando-se integralmente pelos pagamentos perante o Fies, inclusive os juros incidentes, até o limite do valor contratado. [...] § 2o No Fies-Empresa, poderão ser pagos com recursos do Fies exclusivamente cursos de formação inicial e continuada, de educação profissional técnica de nível médio e de educação superior. [...] § 4o Regulamento disporá sobre os requisitos, condições e demais normas para contratação do financiamento de que trata este artigo.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-jessica.json (normas_de_apoio, l10260-art5b-fies-empresa); regulamento do § 4º não lido"}]}, {"tipo": "Comunicação", "titulo": "Uma tela para a prima", "texto": "Quem decide é a prima Tainá, formada a distância. Monte uma imagem só, pronta para encaminhar no WhatsApp. Nela vão preço, total dos dois anos, regra do reajuste, endereço do polo, idas por semestre e situação do curso no Ministério da Educação (MEC). Junto, vídeos curtos de alunas do comércio mostrando a semana real, com escala, ônibus e polo, sem a palavra \"fácil\".", "teste": "Mandar a imagem a um grupo de interessadas e só o preço a outro. Comparar quantas encaminham a mensagem e quantas fazem a matrícula."}], "conversa": [["O que te faria fazer a matrícula hoje?", "Ver uma aula de verdade no meu celular e ter certeza de que a mensalidade não muda. Se eu sentir que dou conta, eu faço."], ["Quanto você consegue pagar por mês?", "Depende da comissão do mês. Eu cortaria o delivery e a música. Mais que isso, só com bolsa ou se a loja ajudar."], ["Por que você parou o outro curso?", "Era tudo vídeo longo, travava no celular e eu fui ficando para trás. Quando vi, estava devendo três mensalidades. Não contei para ninguém."], ["O que você acha de diploma a distância?", "Minha gerente diz que diploma conta, mas não sei se a distância vale. Minha tia acha mais fraco. Eu queria um jeito de mostrar que estudei de verdade. Prova presencial até ajuda."], ["Quando você estudaria?", "De manhã, no quarto e de fone, na semana que pego à tarde. E no ônibus, se der para baixar a aula antes. À noite eu chego morta."], ["O que faria você desistir de novo?", "Ficar sozinha. Se eu sumir uma semana e ninguém perceber, eu não volto. Se alguém me chamar, eu volto."]], "teste": {"texto": "Graduação 100% online! Estude sem sair de casa, de forma fácil e rápida. Matrícula com 50% de desconto na primeira mensalidade. Vagas limitadas!", "funciona": ["Fala em graduação, a palavra que ela procura.", "\"Online\" sugere estudo no horário dela, o que a escala que muda exige.", "Matrícula aberta dá senso de momento, útil logo depois de uma frustração no trabalho."], "afasta": ["\"Fácil e rápida\" confirma a dúvida da tia e tira o mérito que ela quer provar.", "\"100% online\" e \"sem sair de casa\" esbarram no Decreto 12.456, de 2025. Pela regra, a graduação a distância tem prova presencial e um quinto do curso com hora marcada (conta: 10% + 10%). As faculdades têm até maio de 2027 para cumprir por inteiro (art. 41; conta: dois anos depois da publicação). Ela estuda até 2028 e vai descobrir no polo.", "Desconto só na primeira mensalidade repete a isca de 2023, quando a mensalidade cheia a fez parar.", "\"Vagas limitadas\" soa como pressão. Ela pesquisa desde julho e pergunta tudo duas vezes.", "Não diz preço cheio, duração, curso nem onde é a prova, as perguntas que ela faz primeiro."], "reescrita": "Graduação tecnológica em Gestão Comercial, de dois anos (curso de tecnólogo), para quem trabalha no comércio. R$ 249 por mês. Antes da matrícula, você recebe por escrito o endereço do polo da prova e as idas por semestre. Recebe também os horários com hora marcada e a regra de reajuste da mensalidade.", "condicao": "Só use esta versão se o curso tiver polo de prova no Recife e regra de reajuste por escrito. Os horários com hora marcada também precisam caber numa escala que muda."}, "elenco": [{"nome": "Carlos Mendes", "idade": 34, "ocupacao": "Repositor de supermercado", "cidade": "Belo Horizonte (MG)", "quer": "Ganhar mais sem trocar de área", "medo": "Não lembrar mais como se estuda", "palavra": "promoção", "canal": "WhatsApp e YouTube", "foto_prompt_en": "Photorealistic head-and-shoulders portrait of a 34-year-old Brazilian man from Belo Horizonte, a person who does not exist. Brown skin, shaved head, short beard, plain red work vest over a gray t-shirt with no logo. Supermarket aisle with stocked shelves softly blurred behind him. Natural window light mixed with store light. Eye level, tired but friendly expression. No text, no logos, no brand names, no watermark. 85mm lens, shallow depth of field, documentary style.", "foto": {"arquivo": "img/jessica-elenco-1.jpg", "alt": "Retrato gerado por inteligência artificial (IA) para Carlos; não é uma pessoa real"}}, {"nome": "Renata Lima", "idade": 41, "ocupacao": "Dona de loja de roupas", "cidade": "Campinas (SP)", "quer": "Organizar o caixa e vender on-line", "medo": "Perder tempo com teoria", "palavra": "prática", "canal": "Instagram", "foto_prompt_en": "Photorealistic head-and-shoulders portrait of a 41-year-old Brazilian woman from Campinas, a person who does not exist. Light tan skin, long wavy brown hair, thin glasses, simple purple blouse with no logo. Inside her small clothing boutique, racks of clothes softly blurred behind her. Soft natural daylight from the shop window. Eye level, confident practical expression. No text, no logos, no brand names, no watermark. 85mm lens, shallow depth of field, documentary style.", "foto": {"arquivo": "img/jessica-elenco-2.jpg", "alt": "Retrato gerado por inteligência artificial (IA) para Renata; não é uma pessoa real"}}], "derruba": ["Em pelo menos 4 de 6 entrevistas com vendedoras de 20 a 26 anos, o preço pesa mais que a escala e o cansaço. O dado do Nordeste aponta para o trabalho: 32,8% dizem que precisam trabalhar, e 9,6% citam falta de dinheiro. Mas ele cobre de 15 a 29 anos, trabalhando ou não. E \"precisa trabalhar\" pode querer dizer falta de tempo ou falta de renda.", "Em pelo menos 4 de 6 conversas com quem já estuda Gestão Comercial a distância, o aluno tem mais de 30 anos e emprego firme ou negócio próprio. Nesse caso, Carlos (repositor, 34 anos) ou Renata (dona de loja, 41) viram a persona principal.", "Em pelo menos 4 de 6 conversas com gerentes de loja, o diploma não pesa na promoção a supervisora. Cai o gatilho da vaga perdida, e a proposta precisa trocar promessa de cargo por habilidade de loja.", "Em pelo menos 4 de 6 entrevistas, a vendedora já tem nota do Enem ou espera a bolsa integral do Prouni. Nesse caso, o concorrente principal é o curso de graça, e a proposta precisa dizer por que pagar."], "perguntas_campo": ["Conte a última vez que você pensou em começar uma faculdade. O que tinha acontecido naquele dia?", "Como é a sua escala nesta semana? Em que horário você tem 20 minutos com a cabeça livre?", "Você já começou um curso e parou? O que fez você parar, e quem ficou sabendo?", "Na sua loja, o que pesa para alguém virar supervisora? Me dê o exemplo de alguém que subiu.", "Quanto você pagaria por mês sem cortar nada? E, para pagar mais, o que cortaria? Já pensou em bolsa, como a do Prouni, ou em financiamento, como o Fies?"], "hipoteses": "Dado conferido: 10 fatos de época e 12 números com fonte aberta, lidos entre 1º e 5 de outubro de 2026. São 8 nos cartões de números, 2 no canal de inteligência artificial (IA), 1 na objeção sobre tecnólogo e 1 na lacuna sobre desistência. As leis citadas têm trecho e endereço na lista conferida. Na página, a fonte com o endereço aparece junto das objeções, do encaixe, das ideias e do \"Como falar\". Contas nossas, sempre com a conta escrita: 12,0%, 15,4%, R$ 1.822, R$ 5.976, R$ 1.494, R$ 1.233 e R$ 2.431,50. Também são contas o quinto do curso com hora marcada e o prazo de maio de 2027. O que está sem fonte é hipótese. Isso inclui toda a vida da Jéssica: família, bairro, renda, empregos, falas e rotina. Inclui também o arquétipo, os cinco fatores, as dores, as expectativas e a jornada. E ainda os canais, o consumo, os critérios, a conversa, as ideias e o elenco. Tudo isso pede entrevista com clientes reais.", "pronome": "ela"}, "marcos": {"id": "marcos", "nome": "Marcos Almeida", "idade": 38, "nascimento": 1988, "cidade": "São Paulo", "uf": "SP", "ocupacao": "Motorista de aplicativo", "resumo": "Marcos dirige por aplicativo em São Paulo há quase dez anos, desde que perdeu o emprego de vendedor na crise de 2016. Mora em Guaianases, na zona leste, com a esposa e os dois filhos. Roda seis dias por semana, cerca de 11 horas por dia com o aplicativo ligado. Quitou o carro em março, e o motor já pede uma reforma cara. Só troca por um elétrico se a conta da semana fechar.", "frase": "Eu faço a conta do combustível todo dia. Carro novo, para mim, tem que se pagar na corrida.", "tracos": ["Calculista", "Cansado", "Desconfia de novidade", "Confia mais no colega que no vendedor"], "foto": {"prompt_en": "head and shoulders portrait photograph of a 38-year-old Brazilian man, light brown skin, short dark hair, short beard, plain gray t-shirt, sitting in the driver seat of his car in city traffic, serious tired look, natural light, blurred background, 50mm, realistic skin, candid", "alt": "Retrato gerado por inteligência artificial (IA), de pessoa que não existe. Homem de 38 anos, pele morena clara, cabelo escuro curto e barba curta. Está de camiseta cinza, no banco do motorista, com olhar sério e cansado.", "modelo": "stabilityai/stable-diffusion-xl-base-1.0", "semente": 3811, "parametros": "segunda de três variações (semente-base 3810, mais 1), 32 passos, guia 6,0, 896x1152, reduzida para 640x823; prompt negativo em dev/candidatas/marcos.json", "arquivo": "img/marcos.jpg"}, "identidade": [{"rotulo": "Estado civil", "valor": "Casado desde 2011 com Patrícia, 37 anos, auxiliar administrativa numa clínica do bairro", "hipotese": true}, {"rotulo": "Mora com", "valor": "A esposa e os dois filhos. Os pais dele moram na casa de baixo, no mesmo terreno", "hipotese": true}, {"rotulo": "Filhos", "valor": "Kauã, 14 anos, e Lívia, 8", "hipotese": true}, {"rotulo": "Moradia", "valor": "Casa de dois quartos construída em cima da casa dos pais, sem escritura própria. Garagem coberta embaixo, com uma tomada comum", "hipotese": true}, {"rotulo": "Bairro", "valor": "Guaianases, no extremo leste da cidade", "hipotese": true}, {"rotulo": "Escolaridade", "valor": "Ensino médio completo em escola estadual, em 2005. Técnico em manutenção automotiva trancado", "hipotese": true}, {"rotulo": "Carro de trabalho", "valor": "Sedã compacto flex fabricado em 2020, comprado seminovo em 2022 de outro motorista. Passa dos 300 mil km. Quitado em março de 2026", "hipotese": true}, {"rotulo": "Jornada", "valor": "Seis dias por semana, com folga no domingo. Sai às 5h40 e volta perto das 20h20. São cerca de 11 horas de aplicativo ligado por dia, fora almoço, pausa e corrida particular. Conta: 11 × 6 = 66 horas por semana. Com a corrida particular, são perto de 75 horas de trabalho por semana (conta: 12,5 × 6 = 75)", "hipotese": true}, {"rotulo": "Quilômetros", "valor": "Cerca de 160 km por dia. Conta: 160 × 6 = 960 km por semana, perto de 50 mil km por ano (960 × 52 = 49.920)", "hipotese": true}, {"rotulo": "Combustível", "valor": "Roda só com etanol, que na conta dele sai mais barato que a gasolina. O carro faz cerca de 8 km por litro na cidade. Conta: 960 ÷ 8 = 120 litros por semana. Pela ANP (Agência Nacional do Petróleo, Gás Natural e Biocombustíveis), o etanol custava em média R$ 3,91 na cidade de São Paulo. Era a semana de 27 de setembro a 3 de outubro de 2026. Dá R$ 469 por semana (120 × 3,91 = 469,20)", "hipotese": true}, {"rotulo": "Faturamento bruto", "valor": "Perto de R$ 1.600 por semana, somando os dois aplicativos e as corridas particulares. Varia de uma semana para outra", "hipotese": true}, {"rotulo": "Outros gastos do carro", "valor": "Cerca de R$ 150 por semana com óleo, pneu, freio e oficina. Mais R$ 50 com lavagem e os dois chips do celular. A retífica fica fora dessa conta. Seguro do carro ele não tem. O IPVA do sedã ele paga uma vez por ano e também deixa fora da conta da semana", "hipotese": true}, {"rotulo": "Renda pessoal", "valor": "Sobram perto de R$ 930 por semana. Conta: 1.600 de faturamento, menos 469 de etanol, 150 de oficina e 50 de lavagem e chips, dá 931. No mês, fica de R$ 3.500 a R$ 4.500, conforme a semana. Numa semana comum, perto de R$ 4.000 (931 × 52 ÷ 12 = 4.034)", "hipotese": true}, {"rotulo": "Comparado à média", "valor": "Na conta da ficha, a sobra dele passa da média do IBGE (Instituto Brasileiro de Geografia e Estatística) para quem dirige carro por aplicativo. A média era de R$ 2.873 por mês em 2025 (ver Em números). O IBGE não diz se a média é antes ou depois do combustível. Se for depois, a diferença vem das horas. Com a corrida particular do meio do dia, ele trabalha perto de 75 horas por semana (conta: 12,5 × 6 = 75), contra a média de 45,9 (IBGE, 2025). Por hora, fica abaixo da média: 931 ÷ 75 = R$ 12,4, contra R$ 14,4 no mesmo informativo do IBGE que traz os R$ 2.873. Se for antes, o faturamento dele passa de duas vezes a média. Conta: 1.600 × 52 ÷ 12 = 6.933 por mês. Nesse caso, os R$ 1.600 por semana pedem conferência em campo", "hipotese": true}, {"rotulo": "Teto da parcela mais energia", "valor": "Na conta dele, parcela mais energia do elétrico precisam ficar abaixo do gasto de hoje com etanol e oficina. Esse teto fica perto de R$ 620 por semana (469 + 150 = 619). Se a soma passar disso, ele fecha o simulador. A parcela que cabe é menor: 620 menos a energia, menos pneu e revisão do elétrico. O que o carro novo pagar a mais de seguro e IPVA, dentro ou fora da parcela, sai do mesmo teto. A regra do IPVA para elétrico em São Paulo não foi conferida", "hipotese": true}, {"rotulo": "Celular e plano", "valor": "Android intermediário de 2023 no suporte do painel. Plano controle de cerca de R$ 60 por mês e um segundo chip de outra operadora para área sem sinal", "hipotese": true}, {"rotulo": "Formalização", "valor": "MEI (microempreendedor individual) aberto em 2019, com as guias atrasadas desde 2020. Nem sabe se o MEI ainda está ativo. Não contribui para a previdência", "hipotese": true}], "arquetipo": {"principal": {"nome": "Governante", "motivacao": "Estabilidade e controle", "desejo": "Ter o controle da própria conta: saber quanto entra, quanto sai e quanto sobra.", "medo": "O caos no caixa: uma quebra, uma dívida ou uma mudança de tarifa que derruba a semana.", "por_que": "Toda noite ele lança no celular os quilômetros, os litros e o faturamento do dia. Recusa corrida longa sem volta, pede três orçamentos antes de qualquer conserto e sonha com um segundo carro para depender menos do aplicativo, que decide quanto ele recebe. É o desejo de controle que Mark e Pearson descrevem no Governante, vivido por quem não manda no próprio preço.", "como_aparece": "Na compra, ele chega com perguntas de dono: quanto custa por quilômetro, em quantas semanas o carro se paga, o que acontece se a bateria falhar. Simulação feita com a rotina dele convence. Promessa genérica afasta."}, "secundario": {"nome": "Cara Comum", "por_que": "Ele se mede pelo grupo de motoristas e confia em quem vive a mesma rotina. Um extrato de colega vale mais que qualquer anúncio. Também tem medo de parecer metido: carro elétrico, para ele, ainda tem cara de carro de rico."}, "sombra": {"nome": "Herói", "risco": "Quando a conta aperta, o controle vira prova de resistência. Ele estica a jornada em vez de mudar o jogo e esconde o cansaço da família. Mensagem que elogia o “guerreiro que não para” alimenta esse lado e empurra para longe a compra que daria mais tempo para ele."}}, "personalidade": [{"traco": "Abertura a experiências", "valor": 2, "nota": "Prefere o conhecido. Só testa novidade depois que um colega testou.", "faixa": "baixa"}, {"traco": "Escrupulosidade", "valor": 4, "nota": "Anota tudo e planeja a troca de carro com meses de antecedência. Paga em dia a parcela e as contas da casa. O MEI ficou para trás em 2020, e ele evita olhar essa dívida.", "faixa": "alta"}, {"traco": "Extroversão", "valor": 2, "nota": "Educado com o passageiro, mas prefere o rádio baixo. Fala mais no grupo do que ao vivo.", "faixa": "baixa"}, {"traco": "Socialização", "valor": 3, "nota": "Cordial no atendimento e solidário com colega. Desconfiado com vendedor.", "faixa": "média"}, {"traco": "Neuroticismo", "valor": 4, "nota": "A conta da semana tira o sono. Fica tenso quando o aplicativo muda a tarifa.", "faixa": "alta"}], "fase_de_vida": {"nome": "Generatividade versus estagnação", "em_jogo": "Deixar algo de pé para os filhos. Aos 38, ele pesa se os dez anos de volante viraram patrimônio ou só quilometragem.", "nota": "Leitura por faixa aproximada, marcada como hipótese: Erikson não fixa idade para cada fase. Na entrevista, a pergunta é o que ele quer ter construído até os 45."}, "formacao": [{"de": 1995, "ate": 2002, "titulo": "Ensino fundamental", "onde": "Escola estadual em Guaianases", "nota": "Entrou na 1ª série no ano seguinte à troca de moeda. Bom em matemática, distraído no resto.", "hipotese": true}, {"de": 2003, "ate": 2005, "titulo": "Ensino médio", "onde": "Escola estadual, no turno da noite a partir de 2004", "nota": "Passou para a noite para ajudar na oficina do tio durante o dia.", "hipotese": true}, {"de": 2006, "ate": 2007, "titulo": "Técnico automotivo, incompleto", "onde": "Curso técnico em manutenção automotiva, em escola técnica pública, à noite", "nota": "Trancou no terceiro semestre, quando o horário da loja apertou. Ficou o ouvido para motor.", "hipotese": true}, {"de": 2008, "ate": 2008, "titulo": "Carteira de motorista, categoria B", "onde": "Autoescola do bairro, paga em seis vezes", "nota": "Tirou aos 20 anos, com o pai ensinando a dirigir nos fins de semana.", "hipotese": true}, {"de": 2018, "ate": 2018, "titulo": "Carteira com atividade remunerada", "onde": "Órgão de trânsito de São Paulo", "nota": "Pela Lei 13.640, de 2018, quem dirige por aplicativo precisa ter na CNH (Carteira Nacional de Habilitação) a informação de que exerce atividade remunerada. Ver a linha do tempo.", "hipotese": true}, {"de": 2019, "ate": 2019, "titulo": "Cadastro municipal de condutor", "onde": "Prefeitura de São Paulo, CONDUAPP (Cadastro Municipal de Condutores)", "nota": "Pelo decreto municipal de 2016, com redação de 2019, o motorista de aplicativo precisa desse cadastro. Ver a linha do tempo. Custos do cadastro não foram conferidos.", "hipotese": true}, {"de": 2023, "ate": 2023, "titulo": "Curso de finanças pessoais", "onde": "Curso on-line gratuito, em vídeos no celular, assistidos na fila de espera do aeroporto", "nota": "Dali saiu a planilha da semana que ele usa até hoje.", "hipotese": true}], "trajetoria": [{"de": 2003, "ate": 2005, "titulo": "Ajudante na oficina do tio", "onde": "Oficina mecânica em Guaianases, sem registro", "nota": "Aprendeu a ouvir o motor. Daí vem a desconfiança de carro que ele não sabe abrir.", "hipotese": true}, {"de": 2006, "ate": 2008, "titulo": "Estoquista", "onde": "Loja de departamentos num shopping da zona leste, com carteira assinada", "nota": "Primeiro registro em carteira. Saiu para ganhar comissão.", "hipotese": true}, {"de": 2009, "ate": 2016, "titulo": "Vendedor de móveis e eletrodomésticos", "onde": "Loja de rua em Itaquera, salário mais comissão", "nota": "Aprendeu a vender em parcelas e a ler um carnê. Demitido em agosto de 2016, quando as vendas caíram.", "hipotese": true}, {"de": 2016, "ate": 2018, "titulo": "Motorista de aplicativo com carro alugado", "onde": "Locadora com aluguel semanal", "nota": "Começou em novembro de 2016, com parte da rescisão como caução. O aluguel levava boa parte da semana.", "hipotese": true}, {"de": 2018, "ate": "hoje", "titulo": "Com carro próprio", "onde": "Motorista de aplicativo em dois aplicativos de corrida, na cidade de São Paulo", "nota": "Primeiro carro financiado em 2018, trocado em 2022 por um seminovo, quitado em março de 2026.", "hipotese": true}, {"de": 2019, "ate": 2020, "titulo": "MEI de motorista, parado desde 2020", "onde": "Microempreendedor individual, como motorista de aplicativo independente", "nota": "Abriu no ano em que a ocupação entrou na lista. Pagou as guias até o começo de 2020. Hoje nem sabe se o MEI ainda está ativo.", "hipotese": true}, {"de": 2023, "ate": "hoje", "titulo": "Clientes fixos", "onde": "Corridas particulares agendadas pelo WhatsApp", "nota": "Seis clientes fixos, entre consultas médicas e aeroporto. É a parte da renda em que ele mesmo põe o preço.", "hipotese": true}], "dia": [{"hora": "05:10", "o_que": "Acorda antes do despertador. Café em pé na cozinha, de olho no preço do etanol que alguém postou no grupo.", "canal": "Grupo de motoristas no WhatsApp"}, {"hora": "05:40", "o_que": "Liga o aplicativo ainda na garagem. A primeira corrida costuma ser alguém indo para a estação de trem.", "canal": "Aplicativo de corrida"}, {"hora": "07:00", "o_que": "Pico da manhã rumo ao centro. Rádio de notícias baixo, janela fechada, ar ligado só com passageiro.", "canal": "Rádio"}, {"hora": "10:30", "o_que": "Abastece com etanol no posto de sempre e anota quilometragem e litros no bloco preso ao quebra-sol.", "canal": "Caderno e calculadora do celular"}, {"hora": "12:00", "o_que": "Desliga o aplicativo. Marmita no carro, numa rua com sombra, e meia hora de cochilo com o banco deitado. Antes, vê um vídeo de motorista que trocou para elétrico.", "canal": "YouTube"}, {"hora": "13:30", "o_que": "Corrida particular: leva uma cliente fixa à consulta, espera e traz de volta.", "canal": "WhatsApp"}, {"hora": "15:00", "o_que": "Religa o aplicativo. A tarde é fraca, e ele aceita corrida curta perto de hospital e shopping.", "canal": "Aplicativo de corrida"}, {"hora": "16:30", "o_que": "Pausa de vinte minutos. No grupo, um colega posta o extrato da semana com elétrico e a discussão esquenta.", "canal": "Grupo de motoristas no WhatsApp"}, {"hora": "18:00", "o_que": "Pico da tarde. Escolhe corridas que levam para a zona leste, na direção de casa.", "canal": "Aplicativo de corrida"}, {"hora": "20:00", "o_que": "Desliga o aplicativo na última corrida, já perto de casa. Foram cerca de 11 horas com ele ligado.", "canal": "Aplicativo de corrida"}, {"hora": "20:20", "o_que": "Chega em casa. Janta com o Kauã. A Lívia já está deitada.", "canal": "Sem tela"}, {"hora": "21:30", "o_que": "Lança o dia na planilha e abre de novo o simulador de financiamento. Fecha sem decidir e vai dormir.", "canal": "Planilha no celular e site do banco"}], "linha_do_tempo": [{"ano": 1988, "idade": 0, "tipo": "vida", "titulo": "Nasce em Guaianases", "texto": "Caçula de três. A mãe costura para fora e o pai dirige ônibus na zona leste. Cresce ouvindo que motorista bom cuida do carro como cuida da casa."}, {"ano": 1994, "idade": 6, "tipo": "fato", "titulo": "O real vira a moeda do país", "texto": "Em 1º de julho de 1994, o real passou a ser a moeda oficial do Brasil.", "fonte": {"nome": "Planalto · Lei nº 9.069, de 29 de junho de 1995 (Plano Real)", "url": "https://www.planalto.gov.br/ccivil_03/leis/l9069.htm"}, "marca": "Lembra da mãe riscando preços no caderno do mercado. Ficou o hábito de anotar tudo e a desconfiança de preço que muda sem aviso."}, {"ano": 2012, "idade": 24, "tipo": "vida", "titulo": "Nasce o Kauã", "texto": "Casado com a Patrícia desde 2011, vira pai aos 24. Troca o sábado de folga por hora extra na loja."}, {"ano": 2014, "idade": 26, "tipo": "fato", "titulo": "São Paulo cria incentivo ao carro elétrico", "texto": "Em 27 de maio de 2014, a cidade de São Paulo criou um incentivo para quem tem carro elétrico. É um crédito igual à parte do IPVA (Imposto sobre a Propriedade de Veículos Automotores) que fica com o município. Pelo texto compilado da Prefeitura, o incentivo produziu efeitos até 31 de dezembro de 2024.", "fonte": {"nome": "Prefeitura de São Paulo · Lei Municipal nº 15.997, de 27 de maio de 2014 (texto compilado)", "url": "https://legislacao.prefeitura.sp.gov.br/lei-15997-de-27-de-maio-de-2014"}, "marca": "Passou longe dele na época. Hoje, quando alguém no grupo fala em desconto no IPVA do elétrico, ele pergunta se ainda vale antes de acreditar.", "free": true}, {"ano": 2015, "idade": 27, "tipo": "fato", "titulo": "Dois anos de economia encolhendo", "texto": "O PIB (Produto Interno Bruto) do Brasil caiu 3,5% em 2015 e 3,3% em 2016, pela série atual do IBGE (Instituto Brasileiro de Geografia e Estatística).", "fonte": {"nome": "IBGE · Contas Nacionais Anuais, SIDRA (Sistema IBGE de Recuperação Automática) tabela 6784 (PIB, variação em volume)", "url": "https://servicodados.ibge.gov.br/api/v3/agregados/6784/periodos/2006|2007|2008|2009|2010|2011|2012|2013|2014|2015|2016|2017|2018|2019|2020|2021|2022|2023/variaveis/9810?localidades=N1[all]"}, "marca": "Na loja, o carnê parou de sair e a comissão minguou. Aprendeu que emprego com carteira também acaba."}, {"ano": 2016, "idade": 28, "tipo": "fato", "titulo": "São Paulo regula o transporte por aplicativo", "texto": "Em 10 de maio de 2016, a Prefeitura de São Paulo regulou o uso das ruas da cidade pelo transporte individual pago de passageiros chamado por plataforma de tecnologia. Desde 2019, o decreto pede o CONDUAPP (Cadastro Municipal de Condutores) para o motorista e o CSVAPP (Certificado de Segurança do Veículo de Aplicativo) para o carro.", "fonte": {"nome": "Prefeitura de São Paulo · Decreto Municipal nº 56.981, de 10 de maio de 2016 (texto compilado)", "url": "https://legislacao.prefeitura.sp.gov.br/decreto-56981-de-10-de-maio-de-2016"}, "marca": "Entrou num trabalho que a cidade tinha acabado de regular. Ter regra deu ao bico cara de profissão."}, {"ano": 2016, "idade": 28, "tipo": "vida", "titulo": "Perde o emprego e vai para o volante", "texto": "Demitido em agosto. Em novembro, usa parte da rescisão como caução de um carro alugado por semana e liga o aplicativo pela primeira vez."}, {"ano": 2017, "idade": 29, "tipo": "fato", "titulo": "Reforma trabalhista define o autônomo", "texto": "Em 13 de julho de 2017, a reforma trabalhista incluiu na CLT (Consolidação das Leis do Trabalho) uma regra sobre o autônomo. Contratar um autônomo, se cumpridas as formalidades legais, afasta o vínculo de empregado, mesmo com exclusividade.", "fonte": {"nome": "Planalto · Lei nº 13.467, de 13 de julho de 2017 (reforma trabalhista)", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2017/lei/l13467.htm"}, "marca": "Ouviu a notícia no rádio do carro e entendeu que, no aplicativo, ninguém ia dar férias nem 13º salário."}, {"ano": 2018, "idade": 30, "tipo": "fato", "titulo": "Lei federal do transporte por aplicativo", "texto": "Em 26 de março de 2018, a Lei 13.640 regulamentou o transporte por aplicativo e deu aos municípios o poder de regular e fiscalizar o serviço. A lei pede a inscrição do motorista no INSS (Instituto Nacional do Seguro Social).", "fonte": {"nome": "Planalto · Lei nº 13.640, de 26 de março de 2018", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13640.htm"}, "marca": "Refez a carteira com a observação de atividade remunerada. A parte do INSS ficou para depois."}, {"ano": 2018, "idade": 30, "tipo": "vida", "titulo": "Nasce a Lívia e chega o carro próprio", "texto": "Com a segunda filha em casa, sai do aluguel e financia um sedã compacto usado em 48 parcelas. Pela primeira vez, o carro de trabalho é dele."}, {"ano": 2019, "idade": 31, "tipo": "fato", "titulo": "Motorista de aplicativo pode ser MEI", "texto": "Em 8 de agosto de 2019, o motorista de aplicativo independente entrou na lista de ocupações que podem se formalizar como MEI (microempreendedor individual).", "fonte": {"nome": "Receita Federal · Portal do Simples Nacional, notícia \"Comitê Gestor aprova nova Resolução\" (08/08/2019)", "url": "https://www8.receita.fazenda.gov.br/Simplesnacional/Noticias/NoticiaCompleta.aspx?id=0647390c-68fc-4206-acc7-933c4a3303e4"}, "marca": "Abriu o MEI no mesmo ano, orgulhoso de ter empresa no papel. Pagou as guias por alguns meses."}, {"ano": 2020, "idade": 32, "tipo": "fato", "titulo": "Lei da emergência do coronavírus", "texto": "Em 6 de fevereiro de 2020, a Lei 13.979 definiu as medidas para enfrentar a emergência de saúde pública causada pelo coronavírus.", "fonte": {"nome": "Planalto · Lei nº 13.979, de 6 de fevereiro de 2020", "url": "https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2020/lei/l13979.htm"}, "marca": "Na lembrança dele, foram semanas quase sem corrida. Parou de pagar o MEI e nunca mais pôs as guias em dia."}, {"ano": 2022, "idade": 34, "tipo": "fato", "titulo": "Combustível vira bem essencial no imposto", "texto": "Em 23 de junho de 2022, a Lei Complementar 194 passou a tratar combustíveis como bens essenciais. E proibiu ICMS (Imposto sobre Circulação de Mercadorias e Serviços) mais alto sobre eles que nas operações em geral.", "fonte": {"nome": "Planalto · Lei Complementar nº 194, de 23 de junho de 2022", "url": "https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp194.htm"}, "marca": "Foi o ano em que passou a anotar o preço da bomba toda semana e a comparar etanol e gasolina antes de cada abastecida."}, {"ano": 2022, "idade": 34, "tipo": "vida", "titulo": "Troca de carro, de novo parcelado", "texto": "Quita o primeiro carro e, no mesmo mês, financia um sedã flex seminovo em 48 parcelas. A Patrícia pergunta se dá. Ele mostra o caderno."}, {"ano": 2024, "idade": 36, "tipo": "fato", "titulo": "Projeto de lei do motorista de aplicativo", "texto": "Em 5 de março de 2024, chegou à Câmara o projeto de lei complementar 12/2024, que trata do trabalho do motorista de aplicativo e da inclusão dele na previdência. Na última movimentação lida, de 12 de maio de 2026, estava pronto para a pauta do Plenário, sem votação.", "fonte": {"nome": "Câmara dos Deputados · API (interface de programação de aplicações) de dados abertos, proposição PLP (projeto de lei complementar) 12/2024", "url": "https://dadosabertos.camara.leg.br/api/v2/proposicoes/2419243"}, "marca": "Acompanha pelo grupo, entre a esperança de algum direito e o medo de perder a liberdade de horário. Ninguém sabe dizer o que muda para ele."}, {"ano": 2026, "idade": 38, "tipo": "fato", "titulo": "Crédito federal para o carro do motorista", "texto": "Em 19 de maio de 2026, a Medida Provisória 1.359 autorizou até R$ 30 bilhões em financiamento para motoristas de aplicativo e taxistas comprarem carro novo. A Lei 15.503, de 14 de setembro de 2026, manteve esse valor.", "fonte": {"nome": "Planalto · Lei nº 15.503, de 14 de setembro de 2026, art. 6º", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2026/lei/l15503.htm"}, "marca": "Virou o assunto do grupo. Uns falam em teto de R$ 150 mil por carro, outros em R$ 200 mil. Ele quer ver juros e prazo no papel antes de acreditar.", "free": true, "fontes_extra": [{"nome": "Planalto · Medida Provisória nº 1.359, de 19 de maio de 2026, revogada pela Lei 15.503 e mostrada riscada", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2026/mpv/mpv1359.htm"}]}, {"ano": 2026, "idade": 38, "tipo": "vida", "titulo": "Última parcela e orçamento de retífica", "texto": "Em março, paga a última parcela. Em abril, o mecânico avisa que o motor, com quase 290 mil km, pede retífica. O orçamento come o que seria o primeiro mês sem parcela."}, {"ano": 2026, "idade": 38, "tipo": "vida", "titulo": "Começa a simular o elétrico", "texto": "Desde setembro, abre toda noite o simulador do banco ao lado do caderno: parcela semanal mais energia, contra etanol mais manutenção."}, {"ano": 2027, "idade": 39, "tipo": "horizonte", "titulo": "A decisão da troca", "texto": "Se a conta fechar e um colega de confiança provar com o extrato, troca no começo do ano. Se não fechar, reforma o motor e adia. O adiamento tem prazo, mas longo. O certificado da Prefeitura pede carro de aplicativo com no máximo 10 anos de fabricação, e o dele é de 2020. Conta: 2020 + 10 = 2030; a forma de a Prefeitura contar os anos não foi conferida. Se a retífica segurar o motor, ele pode adiar a troca por até quatro anos.", "fonte": {"nome": "Prefeitura de São Paulo · Decreto nº 56.981, de 2016, art. 15-D, IV, com redação do Decreto nº 62.040, de 2022 (texto compilado)", "url": "https://legislacao.prefeitura.sp.gov.br/decreto-56981-de-10-de-maio-de-2016"}}, {"ano": 2030, "idade": 42, "tipo": "horizonte", "titulo": "Menos horas e um segundo carro", "texto": "Quer rodar menos horas e ter um segundo carro alugado para outro motorista. O Kauã faz 18 anos, e Marcos quer que ele estude em vez de dirigir."}], "trabalhos": {"frase": "Quando o carro pede reforma cara logo depois da última parcela, quero um que gaste menos por quilômetro e caiba na semana, para rodar menos horas sem ganhar menos.", "funcional": "Baixar o custo por quilômetro e ter um carro que rode o dia inteiro sem parar na oficina.", "emocional": "Dormir sem a conta da semana na cabeça e sentir que a decisão está na mão dele.", "social": "Provar para a Patrícia e para o grupo de motoristas que a troca foi conta bem feita.", "usa_hoje": "Hipótese. Hoje, no lugar do elétrico, ele segura o sedã flex de 2020 rodando a etanol, cogita a retífica do motor que o mecânico ofereceu e faz a conta da semana na planilha. A outra saída que ele considera é outro carro flex usado, comprado de motorista, como o atual."}, "expectativas": [{"esfera": "Para ele", "texto": "Trabalhar menos horas e ganhar o mesmo. Chegar em casa duas noites por semana a tempo de jantar com a Lívia."}, {"esfera": "No trabalho", "texto": "Um carro que não pare na oficina e rode o dia inteiro sem ele caçar onde carregar."}, {"esfera": "Com os outros", "texto": "Mostrar para a família e para o grupo de motoristas que a troca foi uma boa decisão."}], "dores": {"superficie": [{"texto": "O etanol leva perto de 30% do que ele fatura na semana (469 de 1.600)."}, {"texto": "O aplicativo muda a tarifa e ele só descobre no extrato."}, {"texto": "Onde carregar no meio do dia sem perder corrida?"}, {"texto": "Quanto o carro vai valer daqui a três anos?"}], "fundo": [{"texto": "Medo de se endividar com um carro que pouca gente sabe consertar."}, {"texto": "Horas demais no volante, longe dos filhos."}, {"texto": "Se ele adoecer, a renda para: o MEI está atrasado e ele não contribui para a previdência."}, {"texto": "Aos 38, a sensação de rodar em círculo: dez anos de volante e nada de pé além do carro."}], "raiz": "Ele não decide quanto ganha por corrida e paga sozinho tudo o que o carro custa. Por isso controla cada centavo e cada hora, até o limite do cansaço."}, "ganhos": ["Saber, antes de assinar, quanto sobra no fim da semana.", "Custo por quilômetro menor e previsível, sem susto na bomba.", "Duas noites por semana em casa antes das 19h.", "Garantia da bateria escrita em reais e em anos.", "Um primeiro passo para o segundo carro e uma pequena frota."], "empatia": {"pensa_sente": ["Se a conta não fechar, quem paga é a minha família.", "Elétrico é bonito no vídeo. Quero ver o extrato.", "Estou cansado, mas parar agora é perder a semana.", "Depois dos 40, quero passar menos tempo no volante."], "ve": ["Colegas do grupo simulando o crédito do governo", "O preço da bomba no painel do posto toda manhã", "Carregador de shopping com carro esperando na fila", "Carros elétricos de colegas na fila do aeroporto"], "ouve": ["No grupo: “a bateria dura menos do que dizem” e “eu economizo muito”", "Da Patrícia: “mais um financiamento?”", "Do tio mecânico: “elétrico ninguém conserta”", "No rádio: o projeto de lei dos motoristas, que segue sem votação"], "fala_faz": ["Anota quilômetros, litros e faturamento toda noite", "Recusa corrida longa sem volta", "Pergunta no grupo quanto o colega gasta por mês", "Pede três orçamentos antes de qualquer conserto"], "dores": ["Combustível caro", "Medo da bateria e do conserto", "Nenhuma proteção se adoecer", "Pouco tempo com os filhos"], "ganhos": ["Sobra maior e previsível na semana", "Menos horas no volante", "Carro que não para", "Respeito do grupo pela boa escolha"]}, "jornada": [{"etapa": "Percebe", "faz": "Paga a última parcela e, no mês seguinte, recebe o orçamento da retífica.", "pensa": "Ou reformo este, ou troco agora.", "canal": "Oficina e grupo no WhatsApp", "emocao": -1, "oportunidade": "Conteúdo “reformar ou trocar?” com a conta feita, para quem acabou de quitar o carro."}, {"etapa": "Pesquisa", "faz": "Assiste a vídeos de motoristas com elétrico e pergunta no grupo quanto cada um gasta.", "pensa": "Quero ver o extrato, sem propaganda.", "canal": "YouTube e grupos de motoristas", "emocao": 0, "oportunidade": "Quando houver clientes motoristas, extratos reais deles, com autorização, em vídeo curto. Antes disso, o test drive de um dia."}, {"etapa": "Compara", "faz": "Põe no caderno o flex novo, o híbrido e o elétrico. Simula parcela semanal e o crédito do governo.", "pensa": "Onde eu carrego? E se a bateria der problema?", "canal": "Site da concessionária e simulador do banco", "emocao": -2, "oportunidade": "Mapa de carregadores na rota dele e garantia da bateria escrita em reais."}, {"etapa": "Decide", "faz": "Vai à concessionária com a Patrícia e pede para rodar um dia com o carro, com o aplicativo ligado.", "pensa": "Se a parcela mais a energia der menos que o etanol mais a manutenção, eu troco.", "canal": "Concessionária", "emocao": 1, "oportunidade": "Test drive de um dia inteiro e vendedor que fala em custo por quilômetro. Na conta, ponha também pneu, revisão, seguro e o IPVA do elétrico menos o do sedã."}, {"etapa": "Usa", "faz": "Nas primeiras semanas, compara a planilha nova com a antiga e descobre quantos km a tomada da garagem repõe numa noite.", "pensa": "Sobrou mesmo, ou foi sorte?", "canal": "Aplicativo do carro e planilha", "emocao": 1, "oportunidade": "Resumo semanal no WhatsApp com quilômetros, gasto de energia e quanto sobrou."}, {"etapa": "Indica", "faz": "Posta o extrato da semana no grupo e leva um colega para ver o carro.", "pensa": "Agora sou eu que mostro a conta.", "canal": "Grupo de motoristas no WhatsApp", "emocao": 2, "oportunidade": "Indicação entre motoristas: o colega indicado recebe a conta da semana feita com os números dele. Prêmio por indicação só se couber na oferta, que hoje não inclui recarga."}], "canais": [{"canal": "Grupo no WhatsApp", "uso": 5, "confianca": 5, "nota": "Grupos de motoristas. É onde ele pergunta, compara e se convence pelo extrato do colega.", "fonte": null}, {"canal": "Aplicativo de corrida", "uso": 5, "confianca": 2, "nota": "Passa o dia dentro dele, mas quem define o valor é o aplicativo. Em 2025, 80,2% dos motoristas de aplicativo de passageiros diziam depender totalmente do aplicativo para isso.", "fonte": {"nome": "IBGE, trabalho por plataformas digitais 2025", "url": "https://biblioteca.ibge.gov.br/visualizacao/livros/liv102309_informativo.pdf"}}, {"canal": "Vídeos no YouTube", "uso": 4, "confianca": 4, "nota": "Assiste no almoço. Confia em motorista que mostra a conta e pula vídeo de montadora.", "fonte": null}, {"canal": "Rádio", "uso": 4, "confianca": 3, "nota": "Ligado o dia inteiro, em volume baixo. Notícia de trânsito e de lei do setor chega por aqui.", "fonte": null}, {"canal": "Instagram", "uso": 3, "confianca": 1, "nota": "Vê anúncio de carro entre uma corrida e outra. Rola a tela sem clicar.", "fonte": null}, {"canal": "Mecânico de confiança", "uso": 2, "confianca": 5, "nota": "O tio mecânico. Pouco contato, mas uma frase dele derruba uma compra.", "fonte": null}, {"canal": "Concessionária", "uso": 2, "confianca": 2, "nota": "Vai no fim, para fechar. Desconfia de vendedor que fala do carro e esquece a conta.", "fonte": null}], "consumo": [{"rotulo": "Como paga", "valor": "Pix no dia a dia, parcela fixa para o que é grande e cartão de crédito só para emergência do carro."}, {"rotulo": "Onde compra", "valor": "Peça e pneu na loja do bairro indicada pelo mecânico. Carro, até hoje, só comprou usado, o último de outro motorista. Carro novo seria a primeira vez na concessionária, depois de decidir no grupo."}, {"rotulo": "Quanto pesquisa", "valor": "Muito. De três a seis meses para trocar de carro e três orçamentos para qualquer conserto."}, {"rotulo": "Sensibilidade a preço", "valor": "Alta para a parcela e o custo por quilômetro. Baixa para o preço cheio do carro: ele pensa na parcela da semana. Mostre o total pago. Ele não pede, mas confere no grupo."}, {"rotulo": "Quando compra", "valor": "Quando a última parcela termina ou o carro pede uma reforma cara."}, {"rotulo": "Fidelidade", "valor": "Fica com a marca que tem peça barata e mecânico que conhece. Muda de marca só com prova de colega."}], "decisao": {"criterios": [{"criterio": "Custo por quilômetro", "peso": 5}, {"criterio": "Parcela que cabe na semana", "peso": 5}, {"criterio": "Garantia e custo da bateria", "peso": 4}, {"criterio": "Onde carregar, perto de casa e na rota", "peso": 4}, {"criterio": "Valor de revenda em três anos", "peso": 3}, {"criterio": "Aceito nas categorias do aplicativo", "peso": 3}, {"criterio": "Conforto para o passageiro", "peso": 2}], "gatilhos": ["Última parcela paga", "Orçamento de retífica ou de câmbio", "Extrato de colega que trocou para elétrico", "Notícia do crédito federal de 2026, ainda sem regra lida", "Alta no preço do etanol", "Limite de 10 anos de fabricação na Prefeitura: o sedã de 2020 vale até perto de 2030"], "objecoes": [{"objecao": "E se a bateria der problema?", "resposta": "Diga por escrito o que o fabricante garante: anos, quilômetros e o que cobre. Diga também quanto custa trocar fora da garantia. Se você ainda não tem esse número, diga que vai buscar e volte com ele. Sem isso, ele não assina.", "free": true}, {"objecao": "Onde eu carrego no meio do dia?", "resposta": "A oferta hoje não inclui recarga. Diga isso. Confirme com o fabricante quanto tempo o modelo leva para carregar numa tomada comum, como a da garagem dele, e quanto custa instalar um ponto. Não prometa rede na rua que você não controla."}, {"objecao": "Pouca gente sabe consertar elétrico.", "resposta": "Se houver oficina autorizada, mostre a mais perto da zona leste e quanto tempo leva uma revisão. Se ela for longe, diga. Carro reserva não faz parte da oferta: não deixe ele achar que faz."}, {"objecao": "Quanto ele vai valer daqui a três anos?", "resposta": "Ninguém sabe ao certo, e ele percebe quando o vendedor chuta. A oferta não tem recompra. Diga o que é fato. A fatia dos eletrificados nas vendas de carros leves subiu de 9,4% em agosto de 2025 para 21,8% em agosto de 2026. A fonte é a ABVE (Associação Brasileira do Veículo Elétrico). É sinal de mercado maior, sem garantia de preço.", "fontes": [{"fonte": "ABVE, balanço de agosto de 2026 (09/09/2026)", "url": "https://abve.org.br/com-57-mil-emplacamentos-em-agosto-eletrificados-abrem-a-corrida-para-o-milhao-em-setembro/", "trecho": "Evolução da participação dos eletrificados no mercado brasileiro: ago/25: 9,4% nov/25: 9,3% fev/26: 14,1% maio/26: 17,0% ago/26: 21,8% [...] Em outras palavras, de cada 100 veículos leves vendidos no Brasil em agosto, 22 foram eletrificados.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json"}]}, {"objecao": "Parcela de carro de R$ 130 mil não cabe. E a Patrícia vai dizer: mais um financiamento?", "resposta": "Fale da parcela semanal, do prazo e do total pago, nessa ordem. Depois faça a conta com os números dele: o que gasta hoje com combustível e oficina contra parcela mais energia. Mande uma versão curta para a Patrícia ler. Se não fechar, diga. Quem perde dinheiro com o seu carro conta isso no grupo."}, {"objecao": "Vale a pena esperar o crédito do governo?", "resposta": "A lei autoriza o crédito. Pela Lei 15.503, de 14 de setembro de 2026, a União pode destinar até R$ 30 bilhões para financiar carro novo de motorista de aplicativo e taxista. Depende do orçamento. Não lemos a notícia do início da operação: a página do governo pediu login. Juros e prazo ficam com o CMN (Conselho Monetário Nacional), em norma que não conseguimos ler (art. 6º, § 9º). Antes de prometer, confirme três coisas. O modelo entra: a montadora precisa de habilitação do governo (art. 8º). Marcos entra: quem pode pedir sai de um ato que também não lemos (art. 6º, § 10). O banco aprova: o risco de crédito fica com o banco (art. 6º, § 6º). E a mesma linha pode financiar um flex novo, que concorre com o seu carro. Só depois simule as opções lado a lado.", "fontes": [{"fonte": "Planalto · Lei nº 15.503, de 14 de setembro de 2026, conversão da MP (medida provisória) 1.366, que revoga a MP 1.359", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2026/lei/l15503.htm", "trecho": "Art. 6º Observada a disponibilidade orçamentária e financeira, fica a União autorizada a destinar o valor de até R$ 30.000.000.000,00 (trinta bilhões de reais) para disponibilizar linhas de financiamento reembolsável a profissionais de transporte remunerado privado individual de passageiros, taxistas e cooperativas de taxistas, para aquisição de veículos automotores novos", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json (fontes_extras do fato de 2026)"}, {"fonte": "Planalto · Lei nº 15.503, de 14 de setembro de 2026, art. 6º, § 9º", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2026/lei/l15503.htm", "trecho": "§ 9º As condições, os encargos financeiros, os prazos e as demais normas regulamentadoras das linhas de financiamento de que trata o caput serão estabelecidos pelo Conselho Monetário Nacional.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json (fontes_extras do fato de 2026)", "capturas": ["capturas/marcos-planalto-l15503-art6-par4-a-par10.png"]}, {"fonte": "Planalto · Lei nº 15.503, de 14 de setembro de 2026, art. 8º", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2026/lei/l15503.htm", "trecho": "Art. 8º A habilitação das montadoras dos veículos a serem financiados no âmbito das linhas de financiamento de que trata o art. 6º será realizada pelo Ministério do Desenvolvimento, Indústria, Comércio e Serviços.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json (fontes_extras do fato de 2026)", "capturas": ["capturas/marcos-planalto-l15503-arts-8-10-12-13.png"]}, {"fonte": "Planalto · Lei nº 15.503, de 14 de setembro de 2026, art. 6º, § 10", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2026/lei/l15503.htm", "trecho": "§ 10. Ato conjunto do Ministro de Estado do Desenvolvimento, Indústria, Comércio e Serviços e do Ministro de Estado da Fazenda disporá sobre as linhas de financiamento de que trata o caput, inclusive quanto a critérios de elegibilidade dos beneficiários, critérios de elegibilidade para adesão das plataformas digitais intermediadoras do serviço de transporte remunerado privado individual de passageiros, critérios de elegibilidade dos itens financiáveis e critérios de sustentabilidade ambiental, social ou econômica, bem como sobre os limites e termos das referidas linhas de financiamento.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json (fontes_extras do fato de 2026)", "capturas": ["capturas/marcos-planalto-l15503-art6-par4-a-par10.png"]}, {"fonte": "Planalto · Lei nº 15.503, de 14 de setembro de 2026, art. 6º, § 6º", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2026/lei/l15503.htm", "trecho": "§ 6º As linhas de financiamento de que trata o caput serão fornecidas pelo BNDES ou por instituições financeiras por ele habilitadas, que assumirão os riscos das operações, incluído o risco de crédito, e as ofertarão aos beneficiários a que se refere o § 1º, observados os critérios de elegibilidade de que trata o § 10.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json (fontes_extras do fato de 2026)", "capturas": ["capturas/marcos-planalto-l15503-art6-par4-a-par10.png"]}, {"fonte": "Planalto · Exposição de motivos nº 1.248/2026, da MP (medida provisória) 1.362, de 25 de maio de 2026", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2026/exm/exm-mp-1362-26.pdf", "trecho": "considerando a comercialização de 200.000 veículos “ﬂex-fuel” e a quilometragem média anual de 50.000 km por veículo, estima-se que a frota beneﬁciada percorra aproximadamente 10 bilhões de quilômetros por ano.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json (fontes_extras do fato de 2026)"}]}, {"objecao": "O aplicativo aceita esse carro?", "resposta": "Confirme a regra de cada aplicativo para o modelo antes de vender e diga em quais categorias ele roda. Em São Paulo, o carro de aplicativo também precisa do certificado da Prefeitura, o CSVAPP (Certificado de Segurança do Veículo de Aplicativo), exigido desde 2019. Ajude com o passo a passo. Para o carro de hoje dele, a mesma regra conta: o certificado pede no máximo 10 anos de fabricação, e o sedã dele é de 2020.", "fontes": [{"fonte": "Prefeitura de São Paulo · Decreto nº 56.981, de 2016, art. 15, § 1º, com redação do Decreto nº 58.595, de 2019 (texto compilado)", "url": "https://legislacao.prefeitura.sp.gov.br/decreto-56981-de-10-de-maio-de-2016", "trecho": "§ 1º Os motoristas e veículos cadastrados nas OTTCs devem possuir, respectivamente, o CONDUAPP e o CSVAPP.(Redação dada pelo Decreto nº 58.595/2019)", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json (fontes_extras do fato de 2016)", "capturas": ["capturas/marcos-sp-decreto-56981-conduapp-10-anos.png"]}, {"fonte": "Prefeitura de São Paulo · Decreto nº 56.981, de 2016, art. 15-D, IV, com redação do Decreto nº 62.040, de 2022 (texto compilado)", "url": "https://legislacao.prefeitura.sp.gov.br/decreto-56981-de-10-de-maio-de-2016", "trecho": "Art. 15-D. Para a obtenção do Certificado de Segurança do Veículo de Aplicativo [...] IV - operar veículo motorizado com, no máximo, 10 (dez) anos de fabricação;(Redação dada pelo Decreto nº 62.040/2022)", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json (fontes_extras do fato de 2016)", "capturas": ["capturas/marcos-sp-decreto-56981-conduapp-10-anos.png"]}]}], "quem_influencia": ["Patrícia, a esposa, que cuida da conta da casa", "Colegas do grupo de motoristas", "O tio mecânico", "Motoristas que mostram a conta no YouTube"]}, "numeros": [{"valor": "941 mil", "frase": "Em 2025, 941 mil pessoas tinham o aplicativo de transporte de passageiros como trabalho principal no Brasil, sem contar táxi, contra 680 mil em 2022. O IBGE mediu 2022 no 4º trimestre e 2025 no 3º.", "fonte": "IBGE (Instituto Brasileiro de Geografia e Estatística), trabalho por plataformas digitais", "url": "https://biblioteca.ibge.gov.br/visualizacao/livros/liv102309_informativo.pdf", "ano": 2025, "tipo": "lido", "free": true, "grafico": {"tipo": "barras", "unidade": "mil", "serie": [{"rotulo": "2022", "valor": 680}, {"rotulo": "2024", "valor": 878}, {"rotulo": "2025", "valor": 941}]}}, {"valor": "R$ 2.873 por mês", "frase": "Em 2025, o motorista de carro por aplicativo ganhava R$ 2.873 por mês, só R$ 68 a mais que o motorista sem aplicativo. Em 2024, a diferença era de R$ 359. A média inclui quem usa aplicativo de táxi.", "fonte": "IBGE, trabalho por plataformas digitais", "url": "https://biblioteca.ibge.gov.br/visualizacao/livros/liv102309_informativo.pdf", "ano": 2025, "tipo": "lido", "free": true, "grafico": {"tipo": "barras", "unidade": "reais", "serie": [{"rotulo": "2024, com aplicativo", "valor": 2909}, {"rotulo": "2024, sem aplicativo", "valor": 2550}, {"rotulo": "2025, com aplicativo", "valor": 2873}, {"rotulo": "2025, sem aplicativo", "valor": 2805}]}}, {"valor": "R$ 6,35", "frase": "Na semana de 27 de setembro a 3 de outubro de 2026, o litro da gasolina comum custava em média R$ 6,35 nos postos da cidade de São Paulo. O do etanol custava R$ 3,91.", "fonte": "ANP (Agência Nacional do Petróleo, Gás Natural e Biocombustíveis), síntese semanal 40/2026", "url": "https://www.gov.br/anp/pt-br/assuntos/precos-e-defesa-da-concorrencia/precos/arq-sintese-semanal/2026/sintese-precos-40.pdf", "ano": 2026, "tipo": "lido", "free": true, "grafico": {"tipo": "barras", "unidade": "reais", "serie": [{"rotulo": "Gasolina comum", "valor": 6.35}, {"rotulo": "Etanol hidratado", "valor": 3.91}]}}, {"valor": "45,9 horas", "frase": "Em 2025, quem dirigia carro por aplicativo trabalhava 45,9 horas por semana, 5,5 horas a mais que o motorista sem aplicativo.", "fonte": "IBGE, trabalho por plataformas digitais", "url": "https://biblioteca.ibge.gov.br/visualizacao/livros/liv102309_informativo.pdf", "ano": 2025, "tipo": "lido", "free": false, "grafico": {"tipo": "barras", "unidade": "horas", "serie": [{"rotulo": "2024, com aplicativo", "valor": 45.9}, {"rotulo": "2024, sem aplicativo", "valor": 40.9}, {"rotulo": "2025, com aplicativo", "valor": 45.9}, {"rotulo": "2025, sem aplicativo", "valor": 40.4}]}}, {"valor": "33,4%", "frase": "Em 2025, o motivo mais citado por quem dirige por aplicativo de passageiros foi não ter achado outro trabalho (33,4%), à frente da flexibilidade (27,2%) e da renda maior (24,4%).", "fonte": "IBGE, trabalho por plataformas digitais", "url": "https://biblioteca.ibge.gov.br/visualizacao/livros/liv102309_informativo.pdf", "ano": 2025, "tipo": "lido", "free": false, "grafico": {"tipo": "barras", "unidade": "%", "serie": [{"rotulo": "Não achou outro trabalho", "valor": 33.4}, {"rotulo": "Flexibilidade", "valor": 27.2}, {"rotulo": "Renda maior que em outros trabalhos", "valor": 24.4}]}}, {"valor": "80,2%", "frase": "Em 2025, 80,2% dos motoristas de aplicativo de passageiros diziam depender totalmente do aplicativo para definir o valor que recebem.", "fonte": "IBGE, trabalho por plataformas digitais", "url": "https://biblioteca.ibge.gov.br/visualizacao/livros/liv102309_informativo.pdf", "ano": 2025, "tipo": "lido", "free": false, "grafico": {"tipo": "pictograma", "unidade": "%", "serie": [{"rotulo": "Dizem depender totalmente do aplicativo para o valor recebido", "valor": 80.2}]}}, {"valor": "25,5%", "frase": "Em 2025, só 25,5% dos motoristas de carro por aplicativo contribuíam para a previdência, contra 59,2% dos motoristas sem aplicativo.", "fonte": "IBGE, trabalho por plataformas digitais", "url": "https://biblioteca.ibge.gov.br/visualizacao/livros/liv102309_informativo.pdf", "ano": 2025, "tipo": "lido", "free": false, "grafico": {"tipo": "barras", "unidade": "%", "serie": [{"rotulo": "Motorista com aplicativo", "valor": 25.5}, {"rotulo": "Motorista sem aplicativo", "valor": 59.2}, {"rotulo": "Todos os motoristas de carro", "valor": 43.8}, {"rotulo": "Todos os ocupados do setor privado", "valor": 62.4}]}}, {"valor": "22 em cada 100", "frase": "A fatia dos eletrificados nas vendas de veículos leves no Brasil subiu de 9,4% em agosto de 2025 para 21,8% em agosto de 2026. Eletrificados somam os 100% elétricos e os híbridos.", "fonte": "ABVE (Associação Brasileira do Veículo Elétrico)", "url": "https://abve.org.br/com-57-mil-emplacamentos-em-agosto-eletrificados-abrem-a-corrida-para-o-milhao-em-setembro/", "ano": 2026, "tipo": "lido", "free": false, "grafico": {"tipo": "barras", "unidade": "%", "serie": [{"rotulo": "ago/25", "valor": 9.4}, {"rotulo": "nov/25", "valor": 9.3}, {"rotulo": "fev/26", "valor": 14.1}, {"rotulo": "mai/26", "valor": 17.0}, {"rotulo": "ago/26", "valor": 21.8}]}}, {"valor": "80.178", "frase": "Em 2025, os carros 100% elétricos foram 80.178 dos 223.912 eletrificados vendidos no Brasil. Os híbridos que vão na tomada venderam mais: 101.364.", "fonte": "ABVE, balanço de 2025", "url": "https://abve.org.br/eletrificados-crescem-dez-vezes-mais-do-que-conjunto-do-mercado-em-2025-com-224-mil-veiculos-vendidos/", "ano": 2025, "tipo": "lido", "free": false, "grafico": {"tipo": "rosca", "unidade": "veículos", "serie": [{"rotulo": "Híbrido que vai na tomada", "valor": 101364}, {"rotulo": "100% elétrico", "valor": 80178}, {"rotulo": "Híbrido flex", "valor": 21323}, {"rotulo": "Híbrido", "valor": 21047}]}}], "falar": {"proposta": "Carro elétrico com parcela semanal, e a conta da sua semana feita com os seus números antes de você assinar.", "use": ["parcela semanal", "custo por quilômetro", "quanto sobra na semana", "a conta com os seus números", "por escrito", "extrato de motorista"], "evite": [["economia garantida", "ele não consegue conferir; a economia depende dos quilômetros dele e de onde ele carrega"], ["a partir de R$ 130 mil", "ele pensa na parcela da semana; o preço cheio na frente assusta, e o “a partir de” soa como letra miúda"], ["sustentável", "fala de um motivo que não pesa na conta dele"], ["tecnologia de ponta", "soa caro e frágil para quem depende do carro para trabalhar"], ["guerreiro", "elogia o cansaço que ele quer deixar para trás"], ["IPVA grátis", "lembra o crédito da cidade no imposto do carro (IPVA, Imposto sobre a Propriedade de Veículos Automotores). Pelo texto da Prefeitura, esse crédito só produziu efeitos até 31 de dezembro de 2024. A regra estadual do IPVA para elétrico não foi conferida. Ele confere no grupo antes de acreditar"]], "canal": "Vídeo curto no YouTube com a conta na tela, e o site da loja à noite. Nos grupos de motoristas, só com autorização do administrador, ou quando um cliente que já trocou topar mostrar o extrato. A concessionária entra no fim, para fechar.", "hora": "No grupo de motoristas, poste só com autorização do administrador, ou deixe o post para um cliente que já comprou e se apresenta como cliente. Grupo de motorista costuma barrar anúncio de vendedor (hipótese). Ele lê o grupo das 5h10 às 5h40. Mensagem direta só no almoço, por volta das 12h, ou à noite, perto das 21h30, quando ele abre a planilha. Mensagem de vendedor antes de ele ligar o aplicativo tende a irritar (hipótese).", "mensagem": "Marcos, quer ver se o elétrico fecha na sua conta? Me manda quantos km você roda por dia e quanto gasta hoje com combustível e oficina. Eu devolvo por escrito a parcela semanal, o gasto com energia e quanto sobra na semana. Se não compensar, eu te falo.", "por_etapa": [{"etapa": "Percebe", "mensagem": "Quitou o carro e o motor já pede retífica? Antes de pagar a reforma, compare: retífica no carro de hoje ou parcela semanal no elétrico. Mande os seus números que a gente faz a conta."}, {"etapa": "Pesquisa", "mensagem": "Venha rodar um dia inteiro com este carro, com o seu aplicativo ligado, e compare com a sua planilha. Use esta mensagem quando a loja oferecer o test drive de um dia. Quando houver clientes motoristas, troque pela semana deles, com autorização e o extrato na tela."}, {"etapa": "Compara", "mensagem": "Ponha lado a lado: parcela semanal mais energia contra combustível mais oficina de hoje. Mande as suas dúvidas sobre bateria, recarga e crédito do governo. A resposta vem por escrito."}, {"etapa": "Decide", "mensagem": "Venha com quem decide com você e traga a sua planilha. A gente simula a parcela na sua frente e entrega o custo total do financiamento no papel."}, {"etapa": "Usa", "mensagem": "Como foi a primeira semana? Mande os quilômetros rodados e o gasto com energia que a gente compara com a sua planilha antiga."}, {"etapa": "Indica", "mensagem": "Se a conta fechou, mostre a sua semana no grupo. Quem você indicar recebe a mesma conta, feita com os números dele."}], "fontes": [{"afirmacao": "Incentivo municipal ao elétrico com efeitos até 31/12/2024", "fonte": "Prefeitura de São Paulo · Lei Municipal nº 15.997, de 27 de maio de 2014 (texto compilado)", "url": "https://legislacao.prefeitura.sp.gov.br/lei-15997-de-27-de-maio-de-2014", "trecho": "Art. 1º O Município de São Paulo incentivará a utilização de veículos automotores movidos à base de energia elétrica ou a hidrogênio. [...] consistirá na geração, em favor do proprietário ou arrendatário mercantil, de crédito correspondente à quota-parte do IPVA [...] Parágrafo único. Esta Lei produzirá efeitos até 31 de dezembro de 2024.", "conferido_em": "2026-10-05", "como": "reaproveitado de dados/fatos-marcos.json, com captura capturas/marcos-sp-lei-15997-efeitos-ate-2024.png"}], "condicao": "Antes de devolver a conta, tenha em mãos três números: o consumo do modelo em km por kWh (quilowatt-hora), a tarifa de energia da casa dele e a parcela semanal. Saiba também quantos km a tomada comum repõe numa noite. Quando ele responder, pergunte quem paga a luz da garagem e se dá para instalar um ponto ali. Sem isso, não prometa a conta."}, "encaixe": {"tarefas": ["Trocar o carro de trabalho antes de gastar na retífica o que sobrou sem a parcela", "Baixar o custo por quilômetro, a parte da conta que ele controla", "Rodar o dia inteiro sem parar na oficina", "Trabalhar menos horas sem ganhar menos", "Mostrar para a Patrícia e para o grupo que a troca foi conta bem feita"], "dores": ["O etanol leva perto de 30% do faturamento, e o preço da bomba muda toda semana", "Medo de se endividar com um carro que pouca gente sabe consertar", "Não saber quanto custa a bateria se ela der problema", "Não saber onde carregar no meio do dia sem perder corrida", "Revenda incerta daqui a três anos", "Se o carro parar ou ele adoecer, a renda para no mesmo dia"], "ganhos": ["Saber, antes de assinar, quanto sobra no fim da semana", "Custo por quilômetro menor e previsível", "Duas noites por semana em casa antes das 19h", "Respeito do grupo pela boa escolha", "Um passo para o segundo carro"], "produtos": ["Carro elétrico compacto, a partir de R$ 130 mil", "Financiamento pensado para motorista de aplicativo, com opção de parcela semanal", "Venda na concessionária em São Paulo e pelo site"], "aliviadores": ["Tira o combustível da conta. Ele roda de etanol, então compare com o etanol. Na cidade de São Paulo, o litro custava em média R$ 3,91 na semana de 27 de setembro a 3 de outubro de 2026 (ANP). A energia entra no lugar e também pede a conta com os quilômetros dele.", "Carro novo no lugar de um motor com mais de 300 mil km que já pede retífica", "Parcela semanal, no mesmo ritmo em que ele faz a conta", "Concessionária em São Paulo para ver o carro com a Patrícia antes de assinar"], "criadores": ["Mexe na parte da conta que é dele. Em 2025, 80,2% dos motoristas de aplicativo de passageiros diziam que o aplicativo define totalmente quanto recebem (IBGE, Instituto Brasileiro de Geografia e Estatística). O custo por quilômetro sobra para ele decidir.", "Parcela conhecida antes de assinar no lugar do preço da bomba, que muda toda semana", "Site para olhar a oferta às 21h30, quando ele abre o simulador do banco"], "lacunas": ["Conta da semana: a oferta não mostra custo por quilômetro nem quanto sobra. Na conta de Marcos, parcela mais energia precisam ficar abaixo do que ele gasta hoje com etanol e oficina, perto de R$ 620 por semana (hipótese da ficha). A parcela sozinha precisa ficar abaixo disso, porque energia, pneu, revisão e o que o carro novo pagar a mais de seguro e IPVA saem do mesmo teto. Para responder, o produto precisa publicar a parcela semanal e o consumo do modelo. A renda dá pouca folga: em 2025, o motorista de carro por aplicativo ganhava em média R$ 2.873 por mês no Brasil (IBGE).", "Re
